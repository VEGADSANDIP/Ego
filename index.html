  const lastNow = ls[mode] || null;
  const lastLine = (ls.test||ls.practice) ? `છેલ્લે આપેલ સેટ: ${ls.test?'⏱ ટેસ્ટ → સેટ '+ls.test:''}${ls.test&&ls.practice?' · ':''}${ls.practice?'✍ પ્રેક્ટિસ → સેટ '+ls.practice:''}` : 'આ ટેસ્ટ હજી સેટ સાથે આપી નથી.';

    <div class="ink-dim fs-12" style="margin-top:6px;">${lastLine}</div>
    <div id="mqSetChips" style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0;">
      ${MQ_SETS.map(c=>`<button class="btn ${c==='A'?'btn-primary':'btn-secondary'}" data-set="${c}" onclick="mqPickSet('${c}')" style="flex-direction:column; gap:1px; line-height:1.2;">${c==='A'?'A · મૂળ':'સેટ '+c}${lastNow===c?'<span style="display:block; white-space:nowrap; font-size:10.5px; font-weight:700; color:var(--success);">✓ છેલ્લે</span>':''}</button>`).join('')}
    </div>
    ${mqMarkBoxHTML()}
    <div class="sheet-actions"><button class="btn btn-primary btn-block" onclick="if(!mqSaveMarksFromSheet()) return; closeSheet(); mqStart('${t.id}','${mode}',null,mqSetChoice)">શરૂ કરો ▶</button></div>`);

function mqPickSet(c){
  mqSetChoice = c;
  document.querySelectorAll('#mqSetChips button').forEach(b=>{
    const on = b.dataset.set===c;
    b.className = 'btn ' + (on?'btn-primary':'btn-secondary');
  });
}
function mqStart(testId, mode, onlyIdx, setCode){
  const t = mqGetTest(testId); if(!t) return;
  if(mode!=='read' && !t.questions.some(q=>q.ans!=null) && mode==='practice'){ toast('જવાબ ચાવી ઉમેરો (✎ એડિટ)','error'); return; }
  const base = onlyIdx || t.questions.map((_,i)=>i);
  const sc = (mode==='read') ? 'A' : (setCode||'A');
  if(mode!=='read'){ const h = mqSetHolder(testId); if(h){ h.lastSet = Object.assign({}, h.lastSet, {[mode]: sc}); save(); } }
  let built;
  if(t.virtual && t.srcs){
    /* દરેક ટેસ્ટનો પેપર સેટ અલગ — એક ટેસ્ટ પૂરી થયા પછી જ બીજી ટેસ્ટ */
    built = {idx:[], perm:{}};
    mqGroups(t, base).forEach(g=>{
      const b = mqBuildSet({id:g.tid, questions:t.questions}, g.items, sc);
      built.idx = built.idx.concat(b.idx); Object.assign(built.perm, b.perm);
    });
  } else built = mqBuildSet(t, base, sc);
  mqSession = {testId, mode, marks:mqMarks(), idx:built.idx, perm:built.perm, setCode:sc, pos:0, answers:{}, start:Date.now(), finished:false, showAns:true, onlyStar:false};
  mqSession.groups = mqGroups(t, built.idx);
  renderMain(); mqScrollTop(); mqStartTimer();
}
function mqSrcName(tid){ const x=DB.qtests.find(q=>q.id===tid); return x?x.name:''; }
/* સંયુક્ત ટેસ્ટમાં પ્રશ્નોને દરેક મૂળ ટેસ્ટ મુજબ જૂથમાં વહેંચે (ક્રમ જળવાય) */
function mqGroups(t, list){
  if(!(t && t.virtual && t.srcs)) return [{tid:null, name:t?t.name:'', items:list.slice()}];
  const g = [], map = {};
  list.forEach(qi=>{ const sr=t.srcs[qi]; const k=sr?sr.t:'?'; if(!map[k]){ map[k]={tid:k, name:mqSrcName(k), items:[]}; g.push(map[k]); } map[k].items.push(qi); });
  return g;
}
/* સત્રમાં અત્યારના પ્રશ્નની ટેસ્ટ-સ્થિતિ: {name, ti, nT, j, m} */
function mqLoc(S, t, p){
  const gs = S.groups || mqGroups(t, S.idx); let acc = 0;
  for(let i=0;i<gs.length;i++){ const n=gs[i].items.length; if(p < acc+n) return {name:gs[i].name, ti:i+1, nT:gs.length, j:p-acc+1, m:n}; acc+=n; }
  return {name:t.name, ti:1, nT:1, j:p+1, m:S.idx.length};
}
function mqScrollTop(){ document.getElementById('main').scrollIntoView({behavior:'instant',block:'start'}); }
function mqStartTimer(){
  clearInterval(mqTimerHandle);
  mqTimerHandle = setInterval(()=>{
    const el = document.getElementById('mqTimer');
    if(!mqSession || mqSession.finished || !el){ if(!mqSession) clearInterval(mqTimerHandle); return; }
    const sec = Math.floor((Date.now()-mqSession.start)/1000);
    el.textContent = String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  },1000);
}
function mqExit(force){
  if(mqSession && !mqSession.finished && mqSession.mode!=='read' && !force && Object.keys(mqSession.answers).length){
    if(!confirm('બહાર નીકળશો તો આ પ્રયત્ન સેવ નહીં થાય. બહાર નીકળવું છે?')) return;
  }
  mqSession = null; clearInterval(mqTimerHandle); renderMain(); mqScrollTop();
}
let _mqSelHolder = {};
function mqGetTest(id){
  if(typeof id==='string' && id.startsWith('sel:')){
    const ids = id.slice(4).split(',').filter(Boolean);
    const tests = ids.map(i=>DB.qtests.find(x=>x.id===i)).filter(Boolean);
    if(!tests.length) return null;
    const questions = [], srcs = []; tests.forEach(t=>t.questions.forEach((q,i)=>{ questions.push(q); srcs.push({t:t.id, i}); }));
    return {id, name:'પસંદ કરેલી ટેસ્ટ ('+tests.length+')', questions, srcs, attempts:[], virtual:true, folderId:mqFolderId, nTests:tests.length};
  }
  if(typeof id==='string' && id.startsWith('folder:')){
    const fid = id.slice(7);
    const f = DB.qfolders.find(x=>x.id===fid); if(!f) return null;
    const tests = mqFolderTestsDeep(fid).slice().sort((a,b)=>a.name.localeCompare(b.name,'gu',{numeric:true}));
    const questions = [], srcs = []; tests.forEach(t=>t.questions.forEach((q,i)=>{ questions.push(q); srcs.push({t:t.id, i}); }));
    return {id, name:f.name, questions, srcs, attempts:[], virtual:true, folderId:fid, nTests:tests.length};
  }
  return DB.qtests.find(x=>x.id===id);
}
function mqTest(){ return mqGetTest(mqSession.testId); }
function renderMqSession(){
  const S = mqSession;
  if(S.mode==='read') return mqRenderRead();
  if(S.finished) return mqRenderResult();
  return mqRenderQuestion();
}
function mqRenderQuestion(){
  const S = mqSession, t = mqTest(), qi = S.idx[S.pos], q = t.questions[qi];
  const picked = S.answers[qi];
  const practice = S.mode==='practice';
  const locked = practice && picked!==undefined;
  const perm = (S.perm && S.perm[qi]) || [0,1,2,3];
  const opts = perm.map((k,d)=>{
    const o = q.opts[k];
    let cls = '';
    if(locked && q.ans!=null){ if(k===q.ans) cls='ok'; else if(k===picked) cls='bad'; }
    else if(picked===k) cls='sel';
    return `<button class="mq-opt ${cls}" onclick="mqPick(${k})"><span class="ltr">${MQ_LET[d]}</span><span style="flex:1;">${esc(o)}</span></button>`;
  }).join('');
  const total = S.idx.length;
  const answeredN = Object.keys(S.answers).length;
  const loc = mqLoc(S, t, S.pos), multi = loc.nT>1 || !!t.virtual;
  return mqSticky(`
   <div class="mq-topbar mq-center">
     <button class="btn btn-sm btn-secondary" onclick="mqExit()">✕ બહાર</button>
     <span class="mq-title">${esc(multi?loc.name:t.name)}</span>
     <span class="badge badge-primary" id="mqTimer">00:00</span>
   </div>
   <div class="mq-bar"><i style="width:${Math.round((S.pos+1)/total*100)}%"></i></div>
   <div class="ink-dim" style="font-size:12.5px;display:flex;justify-content:space-between;">
     <span>${S.mode==='test'?'⏱ ટેસ્ટ':'✍ પ્રેક્ટિસ'}${S.setCode&&S.setCode!=='A'?' · સેટ '+S.setCode:''} · ${multi?`ટેસ્ટ ${loc.ti}/${loc.nT} · પ્રશ્ન ${loc.j}/${loc.m}`:`પ્રશ્ન ${S.pos+1}/${total}`} · +${fmtMark((S.marks||{pos:1}).pos)}/−${fmtMark((S.marks||{neg:0}).neg)}</span><span>જવાબ આપ્યા: ${answeredN}</span></div>`) + `
   <div class="card" style="margin-top:8px;">
     <div class="mq-q">${multi?loc.j:S.pos+1}. ${esc(q.q)}</div>
     ${opts}
     ${locked && q.ans==null?'<div class="ink-dim" style="font-size:12.5px;">આ પ્રશ્ન માટે જવાબ ચાવી નથી</div>':''}
     ${locked && q.ans!=null?`<div style="font-weight:700;margin-top:4px;color:${picked===q.ans?'var(--success)':'var(--danger)'};">${picked===q.ans?'✅ સાચો જવાબ!':'❌ ખોટો — સાચો: ('+MQ_LET[perm.indexOf(q.ans)]+')'}</div>`:''}
   </div>
   <div class="mq-nav">
     <button class="btn btn-secondary" ${S.pos===0?'disabled':''} onclick="mqMove(-1)">◀ પાછળ</button>
     <button class="btn btn-secondary" onclick="mqOpenPalette()">▦ ${S.pos+1}/${total}</button>
     ${S.pos<total-1?`<button class="btn btn-primary" onclick="mqMove(1)">આગળ ▶</button>`:`<button class="btn btn-primary" onclick="mqFinish()">સમાપ્ત ✔</button>`}
   </div>`;
}
function mqPick(k){
  const S = mqSession, qi = S.idx[S.pos];
  if(S.mode==='practice'){ if(S.answers[qi]!==undefined) return; S.answers[qi]=k; }
  else { if(S.answers[qi]===k) delete S.answers[qi]; else S.answers[qi]=k; }
  renderMain();
  if(S.mode==='test'){ mqStartTimer(); }
}
function mqMove(d){
  const S = mqSession; S.pos = Math.max(0, Math.min(S.idx.length-1, S.pos+d)); renderMain(); mqScrollTop();
}
function mqOpenPalette(){
  const S = mqSession, t = mqTest();
  const cells = S.idx.map((qi,p)=>{
    const a = S.answers[qi]; let cls = a!==undefined?'done':'';
    if(S.mode==='practice' && a!==undefined && t.questions[qi].ans!=null) cls = a===t.questions[qi].ans?'ok':'bad';
    if(p===S.pos) cls += ' cur';
    return `<button class="${cls}" onclick="mqGoto(${p})">${p+1}</button>`;
  }).join('');
  openSheet(`<h3>પ્રશ્નો</h3><div class="ink-dim" style="font-size:12.5px;">જવાબ આપ્યા: ${Object.keys(S.answers).length}/${S.idx.length}</div>
    <div class="mq-pal">${cells}</div>
    <div class="sheet-actions"><button class="btn btn-primary btn-block" onclick="closeSheet(); mqFinish();">સમાપ્ત કરો ✔</button></div>`);
}
function mqGoto(p){ mqSession.pos = p; closeSheet(); renderMain(); mqScrollTop(); }
function mqFinish(){
  const S = mqSession;
  const un = S.idx.length - Object.keys(S.answers).length;
  if(un>0 && !confirm(`${un} પ્રશ્નો બાકી છે. છતાં સમાપ્ત કરવું છે?`)) return;
  const t = mqTest();
  let correct=0, wrong=0, skipped=0;
  S.idx.forEach(qi=>{
    const a = S.answers[qi], q = t.questions[qi];
    if(a===undefined) skipped++; else if(q.ans!=null && a===q.ans) correct++; else if(q.ans!=null) wrong++; else skipped++;
  });
  const total = S.idx.length;
  const timeSec = Math.floor((Date.now()-S.start)/1000);
  const mk = S.marks || {pos:1, neg:0};
  const score = Math.round((correct*mk.pos - wrong*mk.neg)*100)/100;
  const maxScore = Math.round(total*mk.pos*100)/100;
  const pct = maxScore>0 ? Math.max(0, Math.round(score/maxScore*100)) : 0;
  S.result = {correct, wrong, skipped, total, pct, score, maxScore, pos:mk.pos, neg:mk.neg, timeSec};
  S.finished = true; clearInterval(mqTimerHandle);
  /* એક સાથે ઘણી ટેસ્ટ આપી હોય તો દરેક ટેસ્ટમાં તેનું પોતાનું પરિણામ (વાર, સાચા, ગુણ) સેવ થાય */
  if(t.virtual && t.srcs && S.idx.length===t.questions.length){
    const groups = {};
    S.idx.forEach(qi=>{ const sr = t.srcs[qi]; if(sr) (groups[sr.t] = groups[sr.t] || []).push({gi:qi, li:sr.i}); });
    const breakdown = []; let revDone = 0;
    Object.keys(groups).forEach(tid=>{
      const rt = DB.qtests.find(x=>x.id===tid); if(!rt) return;
      const items = groups[tid];
      if(items.length !== rt.questions.length) return;
      let c=0, w=0, sk=0; const ans = {};
      items.forEach(({gi,li})=>{
        const a = S.answers[gi], q = rt.questions[li];
        if(a===undefined) sk++; else { ans[li] = a; if(q.ans!=null && a===q.ans) c++; else if(q.ans!=null) w++; else sk++; }
      });
      const tot = items.length;
      const sc = Math.round((c*mk.pos - w*mk.neg)*100)/100, mx = Math.round(tot*mk.pos*100)/100;
      const pc = mx>0 ? Math.max(0, Math.round(sc/mx*100)) : 0;
      rt.attempts = rt.attempts || [];
      rt.attempts.push({id:uid(), date:todayStr(), mode:S.mode, set:S.setCode||'A', answers:ans, correct:c, wrong:w, skipped:sk, total:tot, pct:pc, score:sc, maxScore:mx, pos:mk.pos, neg:mk.neg, timeSec:Math.round(timeSec*tot/Math.max(1,total)), combined:true});
      const due = (DB.qrevs||[]).filter(r=>r.testId===rt.id && r.status==='pending' && r.dueDate<=todayStr()).sort((a,b)=>a.dueDate.localeCompare(b.dueDate))[0];
      if(due){ due.status='completed'; due.completedDate=todayStr(); revDone++; }
      breakdown.push({name:rt.name, c, tot, sc, mx, pc});
    });
    S.result.breakdown = breakdown;
    if(breakdown.length){ save(); setTimeout(()=>toast(`${breakdown.length} ટેસ્ટનું પરિણામ સેવ થયું ✅${revDone?` · ${revDone} રિવિઝન પૂર્ણ`:''}`),400); }
  }
  if(!t.virtual && S.idx.length===t.questions.length){
    t.attempts = t.attempts||[];
    t.attempts.push({id:uid(), date:todayStr(), mode:S.mode, set:S.setCode||'A', answers:S.answers, ...S.result});
    const due = (DB.qrevs||[]).filter(r=>r.testId===t.id && r.status==='pending' && r.dueDate<=todayStr()).sort((a,b)=>a.dueDate.localeCompare(b.dueDate))[0];
    if(due){ due.status='completed'; due.completedDate=todayStr(); setTimeout(()=>toast('આ ટેસ્ટનું રિવિઝન પૂર્ણ ગણાયું ✅'),400); }
    save();
  }
  renderMain(); mqScrollTop();
}

function confirmQTestRevisionPicker(testId, dates){
  const existing = (DB.qrevs||[]).filter(r=>r.testId===testId);
  const keep = new Set(dates);
  const removeIds = new Set(existing.filter(r=>r.status==='pending' && !keep.has(r.dueDate)).map(r=>r.id));
  DB.qrevs = (DB.qrevs||[]).filter(r=>!removeIds.has(r.id));
  const have = new Set(DB.qrevs.filter(r=>r.testId===testId).map(r=>r.dueDate));
  let stage = existing.reduce((m,r)=>Math.max(m,r.stage||0),0);
  dates.forEach(d=>{ if(have.has(d)) return; stage++; DB.qrevs.push({id:uid(), testId, dueDate:d, status:'pending', stage}); have.add(d); });
  save(); closeSheet(); renderMain(); toast('ટેસ્ટ રિવિઝન તારીખો સેવ થઈ 🔁');
}

function mqFolderChain(folderId){
  const out = []; let cur = folderId, guard = 0;
  while(cur && guard++<20){ const f = DB.qfolders.find(x=>x.id===cur); if(!f) break; out.unshift(f); cur = f.parentId; }
  return out;
}

function qrevCalendarHTML(revs){
  const items = [];
  revs.forEach(r=>{
    const t = DB.qtests.find(x=>x.id===r.testId); if(!t) return;
    items.push({t, pendId: r.status==='pending'?r.id:null, done: r.status==='completed',
      right: r.status==='completed'?'<span class="badge badge-success">✓ પૂર્ણ</span>':`<button class="btn btn-sm btn-primary" onclick="event.stopPropagation(); mqCompleteRev('${r.id}')">✓</button>`});
  });
  return mqFolderGroupedHTML(items);
}
/* ફોલ્ડર મુજબ ગોઠવણી: ટોપ ફોલ્ડર = વિભાગ (ખોલ-બંધ), પેટા ફોલ્ડર = કાર્ડ */
function mqFolderGroupedHTML(items){
  const tops = {}, topOrder = [];
  items.forEach(it=>{
    const t = it.t, chain = mqFolderChain(t.folderId);
    const topId = chain[0] ? chain[0].id : '_none';
    const subId = chain.length>1 ? chain[chain.length-1].id : '_direct';
    if(!tops[topId]){ tops[topId] = {name: chain[0]?chain[0].name:'', subs:{}, subOrder:[]}; topOrder.push(topId); }
    const T = tops[topId];
    if(!T.subs[subId]){ T.subs[subId] = {name: chain.length>1 ? '📁 '+chain.slice(1).map(f=>f.name).join(' › ') : (chain[0]?'':'MCQ ટેસ્ટ'), items:[]}; T.subOrder.push(subId); }
    T.subs[subId].items.push(Object.assign({}, it, {rest:''}));
  });
  const card = (S)=>{
    S.items.sort((a,b)=>a.t.name.localeCompare(b.t.name,'gu',{numeric:true}));
    const pend = S.items.filter(x=>x.pendId).map(x=>x.pendId);
    return `<div class="card">
      ${S.name||pend.length>1?`<div class="item item-static"><b>${esc(S.name)}</b>${pend.length>1?`<button class="btn btn-sm btn-primary" onclick="mqCompleteMany('${pend.join(',')}')">✓ બધા પૂર્ણ કરો</button>`:''}</div>`:''}
      ${S.items.map(x=>`<div class="item"><span style="flex:1;min-width:0;" onclick="mqGoToTest('${x.t.id}')"><b>${esc(x.t.name)}</b>${x.rest?` <span class="ink-dim fs-12">${esc(x.rest)}</span>`:''}${x.extra||''}</span>${x.right||''}</div>`).join('')}
    </div>`;
  };
  return topOrder.map(topId=>{
    const T = tops[topId];
    const cards = T.subOrder.map(k=>card(T.subs[k])).join('');
    if(topId==='_none') return `<div class="mt-14">${cards}</div>`;
    let total=0, pending=0, hasPend=false; T.subOrder.forEach(k=>T.subs[k].items.forEach(x=>{ total++; if(x.pendId) pending++; if('pendId' in x) hasPend=true; }));
    const badge = !hasPend ? `<span class="badge badge-primary">${total}</span>` : (pending===0 ? `<span class="badge badge-success">✓ બધા પૂર્ણ</span>` : (pending===total ? `<span class="badge badge-warning">${total} બાકી</span>` : `<span class="badge badge-warning">${total-pending}/${total} પૂર્ણ</span>`));
    const wrapId = 'qsecacc_'+topId+'_'+calMode;
    return `<div class="mt-14">${renderAccordionBlock(wrapId, `<span class="ink-dim fw-700 fs-125">📂 ${esc(T.name)}</span>`, badge, cards, isAccordionOpen(wrapId), {headerStyle:'border:none; padding:4px 2px;', bodyStyle:'padding-left:0;'})}</div>`;
  }).join('');
}

function mqPrintPdf(testId){
  const t = mqGetTest(testId); if(!t) return;
  const typeEl = document.querySelector('input[name=pdfType]:checked');
  const solved = !!(typeEl && typeEl.value==='solved');
  const withKey = !solved && !!(document.getElementById('pdfKey')||{}).checked;
  const withName = !solved && !!(document.getElementById('pdfName')||{}).checked;
  closeSheet();
  const L = MQ_LET;
  const qHTML = (q,i)=>`<div class="pq"><div><b class="qn">${i+1}.</b>${esc(q.q)}</div>${(q.opts||[]).map((o,k)=>o?(solved && q.ans===k?`<div class="po pok">(${L[k]}) ${esc(o)}</div>`:`<div class="po">(${L[k]}) ${esc(o)}</div>`):'').join('')}</div>`;
  const section = (name, qsArr, first)=>{
    const keyH = withKey ? `<div class="pk"><div class="ph"><h1>જવાબ ચાવી</h1><div>${esc(name)}</div></div><div class="pkg">${qsArr.map((q,i)=>`<div><b>${i+1}.</b> ${q.ans!=null?L[q.ans]:'-'}</div>`).join('')}</div></div>` : '';
    return `<div class="psec ${first?'':'pnew'}"><div class="ph"><h1>${esc(name)}${solved?' — જવાબ સાથે':''}</h1><div>કુલ પ્રશ્નો: ${qsArr.length}</div></div>${withName?`<div class="pm"><span>નામ: ____________________</span><span>તારીખ: __________</span><span>ગુણ: ____ / ${qsArr.length}</span></div>`:''}<div class="pqs">${qsArr.map(qHTML).join('')}</div>${keyH}</div>`;
  };
  let html;
  if(t.virtual && t.srcs){
    /* દરેક ટેસ્ટ નવા પાનેથી, પ્રશ્ન નંબર 1 થી, ટેસ્ટનું નામ હેડિંગમાં, દરેકની પોતાની ચાવી */
    html = mqGroups(t, t.questions.map((_,i)=>i)).map((g,k)=>section(g.name, g.items.map(qi=>t.questions[qi]), k===0)).join('');
  } else html = section(t.name, t.questions, true);
  let pa = document.getElementById('printArea');
  if(!pa){ pa = document.createElement('div'); pa.id='printArea'; document.body.appendChild(pa); }
  pa.innerHTML = html;
  const oldTitle = document.title; document.title = t.name + (solved?' - જવાબ સાથે':'');
  const done = ()=>{ document.title = oldTitle; pa.innerHTML=''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(()=>window.print(), 150);
}

function bookMakeLeaf(bid, dir, target){
  /* dir<0: જમણું અડધું પાનું ડાબી તરફ ફરે; dir>0: ડાબું અડધું પાનું જમણી તરફ ફરે */
  const el = document.getElementById('bk_'+bid);
  const st = BOOKS[bid];
  const cur = st.pages[st.i], other = st.pages[target];
  const leaf = document.createElement('div');
  leaf.className = 'bk-leaf ' + (dir<0 ? 'right' : 'left');
  const frontCls = dir<0 ? 'bk-fr' : 'bk-fl';
  const backCls  = dir<0 ? 'bk-fl' : 'bk-fr';
  leaf.innerHTML =
    '<div class="bk-face front '+frontCls+'"><div class="bk-in">'+cur+'</div><div class="bk-shade"></div></div>'+
    '<div class="bk-face back '+backCls+'"><div class="bk-in">'+other+'</div><div class="bk-shade"></div></div>';
  el.appendChild(leaf);
  bookSetFinal(leaf);
  const under = el.querySelector(dir<0 ? '.bk-R' : '.bk-L');
  under.innerHTML = bookHalfHTML(other); bookSetFinal(under);
  return leaf;
}
function bookSetAngle(leaf, dir, a){
  leaf.style.transform = 'rotateY('+(dir<0?-a:a)+'deg)';
  const f = leaf.querySelector('.front .bk-shade'), b = leaf.querySelector('.back .bk-shade');
  if(f) f.style.opacity = a<90 ? (a/90*0.3).toFixed(3) : 0;
  if(b) b.style.opacity = a>90 ? ((180-a)/90*0.3).toFixed(3) : 0.3;
  leaf.style.boxShadow = (dir<0?'-':'')+'8px 0 18px rgba(0,0,0,'+(Math.sin(a*Math.PI/180)*0.35).toFixed(3)+')';
}
function bookFinish(bid, leaf, dir, target, complete){
  const st = BOOKS[bid];
  leaf.classList.add('anim');
  requestAnimationFrame(()=>bookSetAngle(leaf, dir, complete?180:0));
  st.busy = true;
  setTimeout(()=>{
    if(complete){ st.i = target; bookDotsUpdate(bid); }
    bookSetHalves(bid);
    leaf.remove();
    st.busy = false; st.drag = null;
  }, 480);
}
function bookGo(bid, k){
  const st = BOOKS[bid]; if(!st || k===st.i || st.busy || st.drag) return;
  const dir = k>st.i ? -1 : 1;
  const leaf = bookMakeLeaf(bid, dir, k);
  bookSetAngle(leaf, dir, 0);
  leaf.getBoundingClientRect();
  bookFinish(bid, leaf, dir, k, true);
}
function bookTarget(st, dir){ const n=st.pages.length; return dir<0 ? (st.i+1)%n : (st.i-1+n)%n; }
function bookDown(e){
  const el = e.currentTarget, st = BOOKS[el.dataset.bid];
  if(!st || st.busy || st.pages.length<2 || (e.pointerType==='mouse' && e.button!==0)) return;
  st.drag = {x:e.clientX, y:e.clientY, dir:0, leaf:null, id:e.pointerId, w:el.getBoundingClientRect().width, lastX:e.clientX, lastT:performance.now(), v:0, angle:0, target:0};
}
function bookMove(e){
  const el = e.currentTarget, bid = el.dataset.bid, st = BOOKS[bid]; if(!st) return;
  const d = st.drag; if(!d || d.id!==e.pointerId || st.busy) return;
  const dx = e.clientX - d.x, dy = e.clientY - d.y;
  if(!d.dir){
    if(Math.abs(dx) < 8) return;
    if(Math.abs(dy) > Math.abs(dx)) { st.drag = null; return; }
    d.dir = dx<0 ? -1 : 1;
    d.target = bookTarget(st, d.dir);
    d.leaf = bookMakeLeaf(bid, d.dir, d.target);
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
  }
  const proj = Math.max(0, dx * (d.dir<0 ? -1 : 1));
  d.angle = Math.min(180, proj / (d.w*0.85) * 180);
  const now = performance.now();
  d.v = (e.clientX - d.lastX) / Math.max(1, now - d.lastT) * (d.dir<0 ? -1 : 1);
  d.lastX = e.clientX; d.lastT = now;
  bookSetAngle(d.leaf, d.dir, d.angle);
}
function bookUp(e, cancelled){
  const el = e.currentTarget, bid = el.dataset.bid, st = BOOKS[bid]; if(!st) return;
  const d = st.drag; if(!d || d.id!==e.pointerId) return;
  if(!d.dir){ st.drag = null; return; }
  bookClickBlockUntil = Date.now() + 450;
  const complete = !cancelled && (d.angle > 60 || (d.v > 0.5 && d.angle > 15));
  bookFinish(bid, d.leaf, d.dir, d.target, complete);
}
function animateDashboardHero(){
  const circles = Array.from(document.querySelectorAll('[id^=bk_hero] .bk-half .hr-circle'));
  if(!circles.length) return;
  const texts = Array.from(document.querySelectorAll('[id^=bk_hero] .bk-half .hr-text'));
  const counts = Array.from(document.querySelectorAll('[id^=bk_hero] .bk-half .hero-count'));
  const duration = 1200;
  requestAnimationFrame(()=>{ circles.forEach(c=>{ c.style.strokeDashoffset = c.dataset.offset; }); });
  const startTime = performance.now();
  function tick(now){
    const progress = Math.min(1, (now-startTime)/duration);
    const eased = 1 - Math.pow(1-progress, 3);
    texts.forEach(t=>{ t.textContent = Math.round(Number(t.dataset.target||0)*eased)+'%'; });
    counts.forEach(el=>{ el.textContent = Math.round(Number(el.dataset.target||0)*eased); });
    if(progress<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

let cropState = null;
function openCropSheet(dataUrl){
  const img = new Image();
  img.onload = function(){
    openSheet(`
      <h3>ફોટો ગોઠવો 🖼️</h3>
      <div id="cropViewport" style="width:100%; max-width:280px; aspect-ratio:1; margin:0 auto 14px auto; border-radius:16px; overflow:hidden; position:relative; background:var(--surface2); touch-action:none; cursor:grab;">
        <img id="cropImg" src="${dataUrl}" draggable="false" style="position:absolute; left:0; top:0; transform-origin:top left; user-select:none;">
      </div>
      <div class="field mb-6">
        <label>ઝૂમ 🔍</label>
        <input type="range" id="cropZoom" min="100" max="300" value="100" oninput="onCropZoomChange(this.value)" style="width:100%;">
      </div>
      <div class="ink-dim" style="font-size:12px; text-align:center; margin-bottom:6px;">ફોટો ડ્રેગ કરીને ગોઠવો, ઝૂમ સ્લાઇડરથી મોટું-નાનું કરો</div>
      <div class="sheet-actions">
        <button class="btn btn-secondary" onclick="cropState=null; closeSheet();">રદ કરો</button>
        <button class="btn btn-primary btn-block" onclick="saveCroppedPhoto();">સેવ કરો</button>
      </div>
    `);
    setTimeout(()=>initCropViewport(img), 30);
  };
  img.src = dataUrl;
}
function initCropViewport(img){
  const viewport = document.getElementById('cropViewport');
  if(!viewport) return;
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const baseScale = Math.max(vw/img.naturalWidth, vh/img.naturalHeight);
  cropState = {
    img, viewportEl: viewport, imgEl: document.getElementById('cropImg'),
    vw, vh, naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight,
    baseScale, zoom: 1, offsetX: 0, offsetY: 0, dragging: false,
    startX: 0, startY: 0, startOffsetX: 0, startOffsetY: 0
  };
  const s = cropState;
  const scale = s.baseScale * s.zoom;
  s.offsetX = (s.vw - s.naturalWidth*scale)/2;
  s.offsetY = (s.vh - s.naturalHeight*scale)/2;
  applyCropTransform();
  viewport.addEventListener('pointerdown', cropPointerDown);
  viewport.addEventListener('pointermove', cropPointerMove);
  viewport.addEventListener('pointerup', cropPointerUp);
  viewport.addEventListener('pointercancel', cropPointerUp);
}
function clampCropOffset(){
  const s = cropState;
  const scale = s.baseScale * s.zoom;
  const dw = s.naturalWidth*scale, dh = s.naturalHeight*scale;
  s.offsetX = Math.min(0, Math.max(s.vw-dw, s.offsetX));
  s.offsetY = Math.min(0, Math.max(s.vh-dh, s.offsetY));
}
function applyCropTransform(){
  const s = cropState;
  const scale = s.baseScale * s.zoom;
  s.imgEl.style.width = (s.naturalWidth*scale)+'px';
  s.imgEl.style.height = (s.naturalHeight*scale)+'px';
  s.imgEl.style.transform = `translate(${s.offsetX}px, ${s.offsetY}px)`;
}
function onCropZoomChange(val){
  if(!cropState) return;
  cropState.zoom = Number(val)/100;
  clampCropOffset();
  applyCropTransform();
}
function cropPointerDown(e){
  if(!cropState) return;
  cropState.dragging = true;
  cropState.startX = e.clientX; cropState.startY = e.clientY;
  cropState.startOffsetX = cropState.offsetX; cropState.startOffsetY = cropState.offsetY;
  cropState.viewportEl.setPointerCapture(e.pointerId);
  cropState.viewportEl.style.cursor = 'grabbing';
}
function cropPointerMove(e){
  if(!cropState || !cropState.dragging) return;
  cropState.offsetX = cropState.startOffsetX + (e.clientX - cropState.startX);
  cropState.offsetY = cropState.startOffsetY + (e.clientY - cropState.startY);
  clampCropOffset();
  applyCropTransform();
}
function cropPointerUp(){
  if(!cropState) return;
  cropState.dragging = false;
  cropState.viewportEl.style.cursor = 'grab';
}
function saveCroppedPhoto(){
  if(!cropState) return;
  const s = cropState;
  const OUT = 320;
  const outScale = OUT / s.vw;
  const scale = s.baseScale * s.zoom;
  const canvas = document.createElement('canvas');
  canvas.width = OUT; canvas.height = OUT;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(s.img, s.offsetX*outScale, s.offsetY*outScale, s.naturalWidth*scale*outScale, s.naturalHeight*scale*outScale);
  DB.settings.photoData = canvas.toDataURL('image/jpeg', 0.88);
  cropState = null;
  save(); populateBrand(); closeSheet(); toast('ફોટો સેવ થયો');
}

  delete DB.settings.photoData;

/* ===================== NOTIFICATIONS ===================== */
function notificationStatusText(){
  if(!('Notification' in window)) return '❌ આ બ્રાઉઝર સપોર્ટ નથી કરતું';
  if(Notification.permission==='granted') return '✅ ચાલુ છે';
  if(Notification.permission==='denied') return '❌ બ્રાઉઝર સેટિંગ્સમાંથી બ્લોક છે — ત્યાંથી જ ચાલુ કરવું પડશે';
  return '⚪ બંધ છે';
}
function requestNotificationPermission(){
  if(!('Notification' in window)){ toast('આ બ્રાઉઝર સપોર્ટ નથી કરતું','error'); return; }
  Notification.requestPermission().then(function(perm){
    if(perm==='granted'){
      toast('નોટિફિકેશન ચાલુ થયું 🔔');
      showAppNotification('ExamPath 🎓','નોટિફિકેશન ચાલુ થઈ ગયું!','welcome');
      checkNotifications();
    } else toast('પરવાનગી ના મળી','error');
    renderMain();
  });
}
function showAppNotification(title, body, tag){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  if('serviceWorker' in navigator){
    navigator.serviceWorker.ready.then(function(reg){
      if(reg && reg.showNotification) reg.showNotification(title, {body:body, icon:'icon-192.png', badge:'icon-192.png', tag:tag||undefined});
      else new Notification(title, {body:body, icon:'icon-192.png', tag:tag||undefined});
    }).catch(function(){ try{ new Notification(title, {body:body, icon:'icon-192.png', tag:tag||undefined}); }catch(e){} });
  } else {
    try{ new Notification(title, {body:body, icon:'icon-192.png', tag:tag||undefined}); }catch(e){}
  }
}
function getNotifyLog(){
  try{
    const raw = localStorage.getItem('examPathNotifyLog_v1');
    const log = raw ? JSON.parse(raw) : {};
    if(log.date !== todayStr()) return {date: todayStr()};
    return log;
  }catch(e){ return {date: todayStr()}; }
}
function saveNotifyLog(log){ try{ localStorage.setItem('examPathNotifyLog_v1', JSON.stringify(log)); }catch(e){} }
function checkNotifications(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const exam = getActiveExam();
  if(!exam) return;
  const log = getNotifyLog();
  let changed = false;

  if(!log.revisionsNotified){
    const pending = revisionsForActiveExam().filter(r=>r.dueDate===todayStr() && r.status==='pending').length;
    if(pending>0) showAppNotification('🔁 આજની રિવિઝન', pending+' રિવિઝન બાકી છે', 'due-today');
    log.revisionsNotified = true; changed = true;
  }

  if(!log.overdueNotified){
    const overdue = revisionsForActiveExam().filter(r=>r.status==='pending' && r.dueDate<todayStr()).length;
    if(overdue>0) showAppNotification('⚠️ ઓવરડ્યુ રિવિઝન', overdue+' રિવિઝન ઓવરડ્યુ છે', 'overdue');
    log.overdueNotified = true; changed = true;
  }

  if(!log.streakNotified){
    const st = calcStudyStreak(exam);
    if(st.streak>0 && !st.todayDone) showAppNotification('🔥 સ્ટ્રીક તૂટવાની તૈયારીમાં!', 'તમારી '+st.streak+' દિવસની સ્ટ્રીક છે — આજે કંઈક અભ્યાસ નોંધો!', 'streak');
    log.streakNotified = true; changed = true;
  }

  if(changed) saveNotifyLog(log);
}
function initHideOnScroll(){
  const main = document.getElementById('main'); if(!main) return;
  const tb = document.querySelector('.topbar');
  let last = 0, tbOff = 0, tbH = tb ? tb.offsetHeight : 0, animT = null;
  function applyTb(off){
    if(!tb) return;
    tbOff = off;
    tb.style.marginTop = (-off)+'px';
    tb.style.opacity = tbH ? String(Math.max(0, 1 - off/tbH)) : '1';
  }
  /* ટોચનું હેડર સ્ક્રોલના અંતર પ્રમાણે જ સરકે છે — જેટલું સ્ક્રોલ, એટલું જ અને એટલી જ ઝડપે */
  window.__hdrShow = ()=>{
    last = main.scrollTop;
    if(tb && tbOff){ tb.classList.add('tb-anim'); clearTimeout(animT); animT = setTimeout(()=>tb.classList.remove('tb-anim'), 260); }
    applyTb(0);
    main.querySelectorAll('.hs-sticky').forEach(el=>{el._tr=0; el.style.transform=''; el.style.pointerEvents='';});
  };
  main.addEventListener('scroll', ()=>{
    const y = main.scrollTop, dy = y - last;
    last = y;
    if(mqSession && mqSession.mode==='read') mqUpdateReadTitle();
    if(window.__lastViewKey !== undefined && !mqSession){ (window.__scrollMem = window.__scrollMem || {})[window.__lastViewKey] = y; }
    if(!dy) return;
    const els = main.querySelectorAll('.hs-sticky');
    if(y <= 20){ window.__hdrShow(); return; }
    if(tb && !tbOff){ tbH = tb.offsetHeight; }
    const ae = document.activeElement;
    const typing = !!(ae && ae.closest && ae.closest('.hs-sticky'));
    const mt = main.getBoundingClientRect().top;
    let allShown = true;
    els.forEach(el=>{
      const h = el.offsetHeight + 8;
      let tr = el._tr || 0;
      if(dy > 0){
        if(typing){ return; }
        const u = el.getBoundingClientRect().top - mt - tr;
        const sp=el.style.position, st=el.style.top, sf=el.style.transform;
        el.style.position='relative'; el.style.top='auto'; el.style.transform='none';
        const nt = el.offsetTop;
        el.style.position=sp; el.style.top=st; el.style.transform=sf;
        const ntTr = Math.min(0, (nt - y) - u);
        tr = Math.max(tr - dy, ntTr, -h);
      } else {
        tr = Math.min(0, tr - dy);
      }
      el._tr = tr;
      el.style.transform = tr ? `translateY(${tr}px)` : '';
      el.style.pointerEvents = tr < -h*0.5 ? 'none' : '';
      if(tr < -1) allShown = false;
    });
    if(typing || !tb) return;
    if(dy > 0 && y > 40){
      /* હેડર નાનું થતાં સ્ક્રીન મોટી થાય — સામગ્રી ટૂંકી હોય તો scroll અટકી ન જાય એટલે જગ્યા જેટલું જ */
      const room = main.scrollHeight - main.clientHeight - main.scrollTop;
      const d = Math.min(dy, Math.max(0, room));
      if(d > 0 && tbOff < tbH) applyTb(Math.min(tbH, tbOff + d));
    } else if(dy < 0 && allShown && tbOff > 0){
      applyTb(Math.max(0, tbOff + dy));
    }
  }, {passive:true});
}
async function init(){
  await bootData();
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  initHideOnScroll();
  applyTheme();
  buildNav();
  populateBrand();
  populateExamSwitcher();
  showTab('dashboard');
  checkNotifications();
  setInterval(checkNotifications, 60000);
  try{ storageCheck(JSON.stringify(DB).length); refreshStorageEstimate(); }catch(e){}
  setTimeout(()=>checkForUpdate(false), 4000);
  if(DB.settings.compactOn){ try{ compactHistory(); save(); }catch(e){} } else setTimeout(compactStartupPrompt, 2500);
  setInterval(()=>checkForUpdate(false), 30*60*1000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkForUpdate(false); });
}
window.addEventListener('DOMContentLoaded', init);
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(e){ console.error('SW register failed', e); });
  });
}
