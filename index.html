function cleanOrphanedData(){
  if(!confirm('ડિલીટ થયેલા વિષય/ટોપિક સાથે જોડાયેલો જૂનો, છૂટો પડેલો ડેટા સાફ કરવો છે? (સ્ટડી લોગ, રિવિઝન, ટાઈમટેબલ વગેરેમાંથી)')) return;
  const examIds = new Set(DB.exams.map(e=>e.id));
  const beforeSections = DB.sections.length;
  DB.sections = DB.sections.filter(s=>examIds.has(s.examId));
  const beforeSubjects = DB.subjects.length;
  DB.subjects = DB.subjects.filter(s=>examIds.has(s.examId));
  const sectionIds = new Set(DB.sections.map(s=>s.id));
  DB.subjects.forEach(s=>{ if(s.sectionId && !sectionIds.has(s.sectionId)) s.sectionId = null; });
  const subjectIds = new Set(DB.subjects.map(s=>s.id));
  const beforeTopics = DB.topics.length;
  DB.topics = DB.topics.filter(t=>subjectIds.has(t.subjectId));
  const topicIds = new Set(DB.topics.map(t=>t.id));
  const beforeSubtopics = DB.subtopics.length;
  DB.subtopics = DB.subtopics.filter(st=>topicIds.has(st.topicId));
  const subtopicIds = new Set(DB.subtopics.map(s=>s.id));
  const beforeRevisions = DB.revisions.length;
  DB.revisions = DB.revisions.filter(r=>subjectIds.has(r.subjectId) && topicIds.has(r.topicId) && (!r.subtopicId || subtopicIds.has(r.subtopicId)));
  const beforeLogs = DB.studyLogs.length;
  DB.studyLogs = DB.studyLogs.filter(l=>subjectIds.has(l.subjectId));
  DB.studyLogs.forEach(l=>{
    if(l.topicId && !topicIds.has(l.topicId)) l.topicId = '';
    if(l.topicIds) l.topicIds = l.topicIds.filter(id=>topicIds.has(id));
    if(l.subtopicIds) l.subtopicIds = l.subtopicIds.filter(id=>subtopicIds.has(id));
  });
  const removed = (beforeSections-DB.sections.length) + (beforeSubjects-DB.subjects.length) + (beforeTopics-DB.topics.length) + (beforeSubtopics-DB.subtopics.length) + (beforeRevisions-DB.revisions.length) + (beforeLogs-DB.studyLogs.length);
  save(); renderMain();
  toast(removed>0 ? `સાફ થયું — ${removed} જૂના રેકોર્ડ કાઢ્યા 🧹` : 'બધું પહેલેથી ચોખ્ખું છે ✅');
}
/* ---- 🔒 પાસવર્ડ સુરક્ષા (એક્સપોર્ટ / ઇમ્પોર્ટ / સાફ / રીસેટ) ---- */
const LOCK_KEY = 'examPathLock_v1';
function lockGet(){ try{ return JSON.parse(localStorage.getItem(LOCK_KEY)||'null'); }catch(e){ return null; } }
function lockHasPw(){ const l = lockGet(); return !!(l && l.hash); }
function _hex(buf){ return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function lockHash(pw, saltHex){
  const enc = new TextEncoder();
  if(window.crypto && crypto.subtle){
    const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const salt = new Uint8Array(saltHex.match(/../g).map(h=>parseInt(h,16)));
    return _hex(await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'}, key, 256));
  }
  let h = 5381; const str = saltHex+pw; for(let i=0;i<str.length;i++){ h = ((h<<5)+h) ^ str.charCodeAt(i); } return 'x'+(h>>>0).toString(16);
}
async function lockSetPassword(pw, hint, len, fp){
  const salt = _hex((crypto.getRandomValues ? crypto.getRandomValues(new Uint8Array(16)) : new Uint8Array(16).map(()=>Math.floor(Math.random()*256))));
  const hash = await lockHash(pw, salt);
  localStorage.setItem(LOCK_KEY, JSON.stringify({salt, hash, hint: hint||'', len: len||0, fp: fp||null}));
}
async function lockCheck(pw){ const l = lockGet(); if(!l) return true; return (await lockHash(pw, l.salt)) === l.hash; }

let _lockCb = null, _lockFails = 0, _lockBlockUntil = 0;
function lockIsPin(){ const l = lockGet(); return !!(l && l.len); }

/* ---------- મોબાઈલ જેવી PIN સ્ક્રીન ---------- */
let _pin = null;
function pinClose(){ const el = document.getElementById('pinScreen'); if(el) el.remove(); _pin = null; document.body.style.overflow=''; }
/* opts: {title, sub, len, allowLenPick, fp, onDone(pin)->Promise<true|string>, onCancel} */
function pinOpen(opts){
  pinClose();
  _pin = Object.assign({val:'', busy:false}, opts);
  const el = document.createElement('div'); el.id = 'pinScreen'; el.className = 'pin-screen';
  document.body.appendChild(el); document.body.style.overflow='hidden';
  pinRender();
  if(opts.fp) setTimeout(pinFingerprint, 350);
}
function pinRender(){
  const el = document.getElementById('pinScreen'); if(!el || !_pin) return;
  const P = _pin;
  const dots = Array.from({length:P.len}, (_,i)=>`<i class="${i<P.val.length?'on':''}"></i>`).join('');
  const key = d=>`<button class="pin-key" onclick="pinPress('${d}')">${d}</button>`;
  el.innerHTML = `
    <div class="pin-top">
      <div class="pin-lock">🔒</div>
      <div class="pin-title">${esc(P.title)}</div>
      <div class="pin-sub" id="pinSub">${esc(P.sub||'')}</div>
      <div class="pin-dots" id="pinDots">${dots}</div>
      ${P.allowLenPick?`<div class="pin-len"><button class="${P.len===4?'on':''}" onclick="pinSetLen(4)">4 અંક</button><button class="${P.len===6?'on':''}" onclick="pinSetLen(6)">6 અંક</button></div>`:''}
    </div>
    <div class="pin-pad">
      ${[1,2,3,4,5,6,7,8,9].map(key).join('')}
      <button class="pin-key pin-aux" onclick="pinCancel()">રદ કરો</button>
      ${key(0)}
      ${P.fp ? `<button class="pin-key pin-aux" onclick="pinFingerprint()" aria-label="ફિંગરપ્રિન્ટ">👆</button>` : `<button class="pin-key pin-aux" onclick="pinBack()" aria-label="ભૂંસો">⌫</button>`}
    </div>
    ${P.fp ? `<button class="pin-back2" onclick="pinBack()">⌫ ભૂંસો</button>` : ''}`;
}
function pinSetLen(n){ if(!_pin||_pin.busy) return; _pin.len = n; _pin.val=''; pinRender(); }
function pinBack(){ if(!_pin||_pin.busy) return; _pin.val = _pin.val.slice(0,-1); pinRender(); }
function pinCancel(){ const cb = _pin && _pin.onCancel; pinClose(); _lockCb = null; if(cb) cb(); }
function pinMsg(t){ const e = document.getElementById('pinSub'); if(e) e.textContent = t; }
async function pinPress(d){
  if(!_pin || _pin.busy) return;
  if(_pin.val.length >= _pin.len) return;
  try{ navigator.vibrate && navigator.vibrate(8); }catch(e){}
  _pin.val += d; pinRender();
  if(_pin.val.length === _pin.len){
    _pin.busy = true;
    const pin = _pin.val;
    await new Promise(r=>setTimeout(r,120));
    const res = await _pin.onDone(pin);
    if(!_pin) return;                      /* onDone એ સ્ક્રીન બદલી/બંધ કરી */
    if(res === true){ return; }
    _pin.busy = false; _pin.val = '';
    const dots = document.getElementById('pinDots');
    try{ navigator.vibrate && navigator.vibrate([60,40,60]); }catch(e){}
    if(dots){ dots.classList.add('shake'); setTimeout(()=>{ pinRender(); pinMsg(typeof res==='string'?res:''); }, 420); }
    else { pinRender(); }
  }
}
/* ---------- ફિંગરપ્રિન્ટ (ફોનનું બાયોમેટ્રિક, WebAuthn) ---------- */
function _b64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function _unb64(str){ return Uint8Array.from(atob(str), c=>c.charCodeAt(0)); }
async function fpSupported(){
  try{ return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }catch(e){ return false; }
}
async function fpEnroll(){
  const cred = await navigator.credentials.create({publicKey:{
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    rp:{name:'ExamPath'}, user:{id:crypto.getRandomValues(new Uint8Array(16)), name:'exampath', displayName:'ExamPath'},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required'}, timeout:60000
  }});
  return _b64(cred.rawId);
}
async function fpVerify(){
  const l = lockGet(); if(!l || !l.fp) return false;
  try{
    await navigator.credentials.get({publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{id:_unb64(l.fp), type:'public-key', transports:['internal']}],
      userVerification:'required', timeout:60000
    }});
    return true;
  }catch(e){ return false; }
}
async function pinFingerprint(){
  if(!_pin || !_pin.fp || _pin.busy) return;
  pinMsg('👆 ફિંગરપ્રિન્ટ મૂકો…');
  if(await fpVerify()){ if(_pin && _pin.onFp) _pin.onFp(); }
  else pinMsg('પાસવર્ડ દાખલ કરો');
}

/* ---------- સુરક્ષિત ક્રિયા ---------- */
function guard(label, cb){
  _lockCb = cb;
  if(!lockHasPw()){ lockSetupFlow(label); return; }
  if(!lockIsPin()){ guardLegacy(label); return; }
  const l = lockGet();
  const finish = ()=>{ _lockFails = 0; const c = _lockCb; _lockCb = null; pinClose(); if(c) c(); };
  pinOpen({
    title:'પાસવર્ડ દાખલ કરો', sub:label, len:l.len, fp:!!l.fp, onFp:finish,
    onDone: async (pin)=>{
      const wait = _lockBlockUntil - Date.now();
      if(wait>0) return `ઘણા ખોટા પ્રયાસ. ${Math.ceil(wait/1000)} સેકન્ડ રાહ જુઓ`;
      if(await lockCheck(pin)){ finish(); return true; }
      _lockFails++;
      if(_lockFails>=5){ _lockBlockUntil = Date.now()+30000; _lockFails = 0; return 'ઘણા ખોટા પ્રયાસ. 30 સેકન્ડ રાહ જુઓ'; }
      return '❌ પાસવર્ડ ખોટો છે';
    }
  });
}
/* નવો PIN બનાવવાની પ્રક્રિયા: દાખલ કરો → ફરી દાખલ કરો → સેવ */
function lockSetupFlow(label, keepFp){
  const prevLen = (lockGet()||{}).len || 4;
  const step1 = (len)=>pinOpen({
    title:'નવો પાસવર્ડ બનાવો', sub: label ? label+' પહેલા પાસવર્ડ સેટ કરો' : '4 કે 6 અંકનો પાસવર્ડ', len, allowLenPick:true,
    onDone: async (pin1)=>{
      pinOpen({
        title:'ફરી દાખલ કરો', sub:'એ જ પાસવર્ડ ફરી લખો', len:pin1.length,
        onCancel:()=>{ _lockCb=null; },
        onDone: async (pin2)=>{
          if(pin1!==pin2){ setTimeout(()=>step1(pin1.length),450); return 'બંને પાસવર્ડ સરખા નથી — ફરી શરૂ કરો'; }
          await lockSetPassword(pin1, '', pin1.length, keepFp ? (lockGet()||{}).fp : null);
          const cb = _lockCb; _lockCb = null; pinClose(); toast('પાસવર્ડ સેવ થયો 🔒');
          if(currentTab==='settings') renderMain();
          if(cb) cb();
          return true;
        }
      });
      return true;
    }
  });
  step1(prevLen);
}
function lockChangeFlow(){ guard('પાસવર્ડ બદલવા માટે', ()=>lockSetupFlow('', false)); }
function lockRemoveSheet(){
  guard('પાસવર્ડ દૂર કરવા માટે', ()=>{ localStorage.removeItem(LOCK_KEY); toast('પાસવર્ડ દૂર થયો'); renderMain(); });
}
async function fpToggle(){
  const l = lockGet(); if(!l) return;
  if(l.fp){ l.fp = null; localStorage.setItem(LOCK_KEY, JSON.stringify(l)); toast('ફિંગરપ્રિન્ટ બંધ કર્યું'); renderMain(); return; }
  guard('ફિંગરપ્રિન્ટ ચાલુ કરવા માટે', async ()=>{
    try{
      const id = await fpEnroll();
      const cur = lockGet(); cur.fp = id; localStorage.setItem(LOCK_KEY, JSON.stringify(cur));
      toast('ફિંગરપ્રિન્ટ ચાલુ થયું 👆'); renderMain();
    }catch(e){ toast('ફિંગરપ્રિન્ટ ચાલુ ન થયું (ફોનમાં ફિંગરપ્રિન્ટ/સ્ક્રીન લોક સેટ છે?)','error'); }
  });
}
let _fpOK = false;
fpSupported().then(v=>{ _fpOK = v; if(v && currentTab==='settings') renderMain(); });
function lockCardHTML(){
  if(!lockHasPw()) return `<div class="item cursor-default"><span>🔓 પાસવર્ડ</span><span class="badge badge-warning">સેટ નથી</span></div>
      <button class="btn btn-primary btn-block mt-8" onclick="lockSetupFlow('')">🔒 પાસવર્ડ સેટ કરો (4 / 6 અંક)</button>`;
  const l = lockGet();
  return `<div class="item cursor-default"><span>🔒 પાસવર્ડ ${l.len?`<span class="ink-dim fs-12">(${l.len} અંક)</span>`:'<span class="ink-dim fs-12">(જૂનો)</span>'}</span><span class="badge badge-success">ચાલુ</span></div>
      <div style="display:flex; gap:8px; margin-top:8px;"><button class="btn btn-secondary flex-1" onclick="${lockIsPin()?'lockChangeFlow()':"guard('પાસવર્ડ બદલવા માટે', ()=>lockSetupFlow(''))"}">${lockIsPin()?'બદલો':'4/6 અંકનો કરો'}</button><button class="btn btn-secondary flex-1" onclick="lockRemoveSheet()">દૂર કરો</button></div>
      ${(_fpOK && lockIsPin()) ? `<div class="item cursor-default mt-8"><span>👆 ફિંગરપ્રિન્ટ</span><button class="btn btn-sm ${l.fp?'btn-secondary':'btn-primary'}" onclick="fpToggle()">${l.fp?'બંધ કરો':'ચાલુ કરો'}</button></div>` : ''}`;
}

/* ---- જૂનો (અક્ષરવાળો) પાસવર્ડ: ફક્ત ખોલવા / બદલવા માટે ---- */
function guardLegacy(label){
  const l = lockGet();
  openSheet(`
    <h3>🔒 પાસવર્ડ જરૂરી</h3>
    <div class="ink-dim fs-12 mb-6">${esc(label)}</div>
    <div class="field"><input type="password" id="f_lockPw" placeholder="પાસવર્ડ" autocomplete="off" onkeydown="if(event.key==='Enter') lockSubmit()"></div>
    ${l.hint?`<div class="ink-dim fs-12">💡 સંકેત: ${esc(l.hint)}</div>`:''}
    <div id="lockMsg" class="fs-12" style="color:var(--danger); min-height:18px; margin-top:6px;"></div>
    <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">રદ કરો</button><button class="btn btn-primary btn-block" onclick="lockSubmit()">ચાલુ રાખો</button></div>`);
}
async function lockSubmit(){
  const msg = document.getElementById('lockMsg');
  const wait = _lockBlockUntil - Date.now();
  if(wait>0){ msg.textContent = `ઘણા ખોટા પ્રયાસ. ${Math.ceil(wait/1000)} સેકન્ડ રાહ જુઓ.`; return; }
  const pw = (document.getElementById('f_lockPw')||{}).value || '';
  if(await lockCheck(pw)){ _lockFails = 0; const cb = _lockCb; _lockCb = null; closeSheet(); if(cb) cb(); }
  else{ _lockFails++; if(_lockFails>=5){ _lockBlockUntil = Date.now()+30000; _lockFails = 0; msg.textContent = 'ઘણા ખોટા પ્રયાસ. 30 સેકન્ડ રાહ જુઓ.'; } else msg.textContent = '❌ પાસવર્ડ ખોટો છે'; }
}
/* ---- 📐 ફક્ત માળખું (Template) એક્સપોર્ટ / ઇમ્પોર્ટ ---- */
function openStructExport(){
  if(!DB.exams.length){ toast('પહેલા પરીક્ષા ઉમેરો','error'); return; }

/* ---- ટેક્સ્ટ સુધારો ---- */
function mqFixGujarati(t){
  return t
    .replace(/ર્ુાં/g,'શું')
    .replace(/ર્બ્દ/g,'શબ્દ')
    .replace(/ર્(?=[ાિીુૂેૈોૌંઃ]|\s|$|[,.?:;)])/g,'શ')
    .replace(/ડ્(?=[ાિીુૂેૈોૌંઃ]|\s|$|[,.?:;)])/g,'ડ')
    .replace(/ાં/g,'ં');
}
function mqClean(t, fix){
  t = t.replace(/\s+/g,' ').trim();
  return fix ? mqFixGujarati(t) : t;
}
/* ---- પાર્સર ---- */
function mqParse(text, fix){
  const t = (text||'').replace(/\r/g,'\n').replace(/ /g,' ');
  const re = /(?:^|\n|\s)(\d{1,3})\s*\)\s*/g;
  const marks = []; let exp = 1, limit = t.length, m;
  while((m = re.exec(t))){
    const num = +m[1];
    if(num===exp){ marks.push({num, from:m.index, to:m.index+m[0].length}); exp++; }
    else if(num===1 && exp>1){ limit = m.index; break; }
  }
  const questions = [], warnings = [];
  marks.forEach((mk,i)=>{
    const end = i+1<marks.length ? marks[i+1].from : limit;
    const block = t.slice(mk.to, end);
    const optRe = /\(\s*([A-Da-d])\s*\)/g;
    const pos = []; let want = 0, om;
    while((om = optRe.exec(block))){
      if(om[1].toUpperCase()===MQ_LET[want]){ pos.push({from:om.index, to:om.index+om[0].length}); want++; if(want===4) break; }
    }
    if(pos.length<4){ warnings.push(mk.num); questions.push({q:mqClean(block,fix), opts:['','','',''], ans:null, star:false}); return; }
    const q = mqClean(block.slice(0,pos[0].from), fix);
    const opts = pos.map((p,k)=> mqClean(block.slice(p.to, k+1<4?pos[k+1].from:block.length), fix));
    questions.push({q, opts, ans:null, star:false});
  });
  return {questions, warnings};
}
function mqParseKey(str, n){
  const out = new Array(n).fill(null);
  const s = (str||'').toUpperCase();
  const pairs = [...s.matchAll(/(\d{1,3})\s*[-–.:)=]*\s*([A-D])/g)];
  if(pairs.length && pairs.length >= n/2){
    pairs.forEach(p=>{ const i=+p[1]-1; if(i>=0 && i<n) out[i]=MQ_LET.indexOf(p[2]); });
    return out;
  }
  const chars = s.replace(/[^A-D\-]/g,'').split('');
  chars.slice(0,n).forEach((c,i)=>{ out[i] = c==='-' ? null : MQ_LET.indexOf(c); });
  return out;
}
function mqKeyString(qs){ return qs.map(q=>q.ans==null?'-':MQ_LET[q.ans]).join(''); }
function mqQuestionsText(qs){
  return qs.map((q,i)=>`${i+1}) ${q.q}\n(A) ${q.opts[0]}   (B) ${q.opts[1]}\n(C) ${q.opts[2]}   (D) ${q.opts[3]}`).join('\n\n');
}

function mqCmp(mode, a, b){
  const byName = ()=>a.name.localeCompare(b.name,'gu',{numeric:true});
  const nullLast = (x,y,fn)=> x==null&&y==null ? 0 : (x==null?1:(y==null?-1:fn(x,y)));
  let r = 0;
  if(mode==='name') return byName();
  if(mode==='name_desc') return -byName();
  if(mode==='new') r = b.idx-a.idx;
  else if(mode==='old') r = a.idx-b.idx;
  else if(mode==='unattempted') r = a.att-b.att;
  else if(mode==='attempted') r = b.att-a.att;
  else if(mode==='score_asc') r = nullLast(a.last,b.last,(x,y)=>x-y);
  else if(mode==='score_desc') r = nullLast(a.last,b.last,(x,y)=>y-x);
  else if(mode==='rev_due') r = nullLast(a.due,b.due,(x,y)=>x.localeCompare(y));
  return r || byName();
}

function ringHTML(id, items, active, setCode){

function ringInitAll(){
  document.querySelectorAll('.ring').forEach(el=>{
    const tr = el.querySelector('.ring-track'); const btns=[...tr.children]; const n=+el.dataset.n;
    const centerOf = b=>b.offsetLeft - tr.offsetLeft + b.offsetWidth/2;
    const setW = ()=> btns[n].offsetLeft - btns[0].offsetLeft;
    const fx = ()=>{ const mid=tr.scrollLeft+tr.clientWidth/2, half=tr.clientWidth/2;
      btns.forEach(b=>{ const d=(centerOf(b)-mid)/half; const a=Math.min(Math.abs(d),1.2);
        b.style.opacity=(1-a*0.75).toFixed(2); b.style.transform=`rotateY(${(-d*38).toFixed(1)}deg) scale(${(1-a*0.22).toFixed(2)})`; }); };
    const center = (b,smooth)=>{ tr.scrollTo({left:centerOf(b)-tr.clientWidth/2, behavior:smooth?'smooth':'instant'}); };
    const act = btns.find(b=>b.dataset.act); tr.style.scrollSnapType='none'; center(act,false); fx();
    requestAnimationFrame(()=>{ tr.style.scrollSnapType=''; fx(); });
    let tm=null, ready=false; setTimeout(()=>{ready=true;},250);
    const settle = ()=>{
      const mid=tr.scrollLeft+tr.clientWidth/2; let best=btns[0],bd=1e9;
      btns.forEach(b=>{ const d=Math.abs(centerOf(b)-mid); if(d<bd){bd=d;best=b;} });
      const W=setW(), lo=W*1.5, hi=W*3.5;
      if(tr.scrollLeft<lo||tr.scrollLeft>hi){ const sh = tr.scrollLeft<lo ? W : -W; tr.style.scrollSnapType='none'; tr.scrollLeft+=sh; requestAnimationFrame(()=>{tr.style.scrollSnapType='';}); }
      if(best.dataset.k!==el.dataset.active){ el.dataset.active=best.dataset.k; (new Function(el.dataset.set.replace('%K',best.dataset.k)))(); }
    };
    tr.addEventListener('scroll',()=>{ fx(); if(!ready) return; clearTimeout(tm); tm=setTimeout(settle,150); },{passive:true});
    btns.forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.k!==el.dataset.active) center(b,true); }));
  });
}

const MQ_SETS = ['A','B','C','D','E','F','G'];
let mqSetChoice = 'A';
function mqSeedRng(str){
  let h = 1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = h >>> 0;
  return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function mqShuffled(arr, rnd){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function mqKeepOptOrder(q){
  const o = (q.opts||[]);
  if(o.some(x=>!x)) return true;
  return o.some(x=>/ઉપરના|ઉપરોક્ત|ઉપરોકત|બધા|બંને|બન્ને|એક પણ નહીં|કોઈ પણ નહીં|કોઈ નહીં|none of|all of|both|\(?\b[A-Da-d]\b\)?\s*(અને|તથા|,|&|and|\/)\s*\(?\b[A-Da-d]\b/i.test(String(x)));
}
/* સેટ મુજબ પ્રશ્ન/વિકલ્પોનો ક્રમ — ડેટાબેઝમાં કંઈ સેવ થતું નથી */
function mqBuildSet(t, idx, setCode){
  const perm = {};
  idx.forEach(qi=>{ perm[qi] = [0,1,2,3]; });
  if(!setCode || setCode==='A') return {idx: idx.slice(), perm};
  const rnd = mqSeedRng(t.id+'|'+setCode);
  const order = mqShuffled(idx, rnd);
  order.forEach(qi=>{
    const q = t.questions[qi];
    const r2 = mqShuffled([0,1,2,3], rnd);
    perm[qi] = mqKeepOptOrder(q) ? [0,1,2,3] : r2;
  });
  return {idx: order, perm};
}

  if(typeof id==='string' && id.startsWith('sel:')) return _mqSelHolder;
  if(typeof id==='string' && id.startsWith('folder:')) return DB.qfolders.find(x=>x.id===id.slice(7));
  return DB.qtests.find(x=>x.id===id);
}

  if(mode==='practice' && !t.questions.some(q=>q.ans!=null)){ toast('જવાબ ચાવી ઉમેરો (✎ એડિટ)','error'); return; }
  mqSetChoice = 'A';
  const hold = mqSetHolder(testId);
  const ls = (hold && hold.lastSet) || {};
  const lastNow = ls[mode] || null;
  const lastLine = (ls.test||ls.practice) ? `છેલ્લે આપેલ સેટ: ${ls.test?'⏱ ટેસ્ટ → સેટ '+ls.test:''}${ls.test&&ls.practice?' · ':''}${ls.practice?'✍ પ્રેક્ટિસ → સેટ '+ls.practice:''}` : 'આ ટેસ્ટ હજી સેટ સાથે આપી નથી.';
  openSheet(`
    <div class="sheet-title">${mode==='test'?'⏱ ટેસ્ટ':'✍ પ્રેક્ટિસ'} — પેપર સેટ પસંદ કરો</div>
    <div style="font-weight:800; margin-bottom:4px;">${esc(t.name)}</div>
    <div class="ink-dim fs-12 mb-6">સેટ A = મૂળ પેપર. B થી G માં પ્રશ્નો અને વિકલ્પોનો ક્રમ બદલાયેલો હશે, જેથી દર વખતે પેપર નવું લાગે.</div>
    <div class="ink-dim fs-12" style="margin-top:6px;">${lastLine}</div>
    <div id="mqSetChips" style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0;">
      ${MQ_SETS.map(c=>`<button class="btn ${c==='A'?'btn-primary':'btn-secondary'}" data-set="${c}" onclick="mqPickSet('${c}')" style="flex-direction:column; gap:1px; line-height:1.2;">${c==='A'?'A · મૂળ':'સેટ '+c}${lastNow===c?'<span style="display:block; white-space:nowrap; font-size:10.5px; font-weight:700; color:var(--success);">✓ છેલ્લે</span>':''}</button>`).join('')}
    </div>
    ${mqMarkBoxHTML()}
    <div class="sheet-actions"><button class="btn btn-primary btn-block" onclick="if(!mqSaveMarksFromSheet()) return; closeSheet(); mqStart('${t.id}','${mode}',null,mqSetChoice)">શરૂ કરો ▶</button></div>`);
}
function mqPickSet(c){
  mqSetChoice = c;
  document.querySelectorAll('#mqSetChips button').forEach(b=>{
    const on = b.dataset.set===c;
    b.className = 'btn ' + (on?'btn-primary':'btn-secondary');
  });
}
function mqStart(testId, mode, onlyIdx, setCode){
  const t = mqGetTest(testId); if(!t) return;
  if(mode!=='read' && !t.questions.some(q=>q.ans!=null) && mode==='practice'){ toast('જવાબ ચાવી ઉમેરો (✎ એડિટ)','error'); return; }
  const base = onlyIdx || t.questions.map((_,i)=>i);
  const sc = (mode==='read') ? 'A' : (setCode||'A');
  if(mode!=='read'){ const h = mqSetHolder(testId); if(h){ h.lastSet = Object.assign({}, h.lastSet, {[mode]: sc}); save(); } }
  let built;
  if(t.virtual && t.srcs){
    /* દરેક ટેસ્ટનો પેપર સેટ અલગ — એક ટેસ્ટ પૂરી થયા પછી જ બીજી ટેસ્ટ */
    built = {idx:[], perm:{}};
    mqGroups(t, base).forEach(g=>{
      const b = mqBuildSet({id:g.tid, questions:t.questions}, g.items, sc);
      built.idx = built.idx.concat(b.idx); Object.assign(built.perm, b.perm);
    });
  } else built = mqBuildSet(t, base, sc);
  mqSession = {testId, mode, marks:mqMarks(), idx:built.idx, perm:built.perm, setCode:sc, pos:0, answers:{}, start:Date.now(), finished:false, showAns:true, onlyStar:false};
  mqSession.groups = mqGroups(t, built.idx);
  renderMain(); mqScrollTop(); mqStartTimer();
}
function mqSrcName(tid){ const x=DB.qtests.find(q=>q.id===tid); return x?x.name:''; }
/* સંયુક્ત ટેસ્ટમાં પ્રશ્નોને દરેક મૂળ ટેસ્ટ મુજબ જૂથમાં વહેંચે (ક્રમ જળવાય) */
function mqGroups(t, list){
  if(!(t && t.virtual && t.srcs)) return [{tid:null, name:t?t.name:'', items:list.slice()}];
  const g = [], map = {};
  list.forEach(qi=>{ const sr=t.srcs[qi]; const k=sr?sr.t:'?'; if(!map[k]){ map[k]={tid:k, name:mqSrcName(k), items:[]}; g.push(map[k]); } map[k].items.push(qi); });
  return g;
}
/* સત્રમાં અત્યારના પ્રશ્નની ટેસ્ટ-સ્થિતિ: {name, ti, nT, j, m} */
function mqLoc(S, t, p){
  const gs = S.groups || mqGroups(t, S.idx); let acc = 0;
  for(let i=0;i<gs.length;i++){ const n=gs[i].items.length; if(p < acc+n) return {name:gs[i].name, ti:i+1, nT:gs.length, j:p-acc+1, m:n}; acc+=n; }
  return {name:t.name, ti:1, nT:1, j:p+1, m:S.idx.length};
}
function mqScrollTop(){ document.getElementById('main').scrollIntoView({behavior:'instant',block:'start'}); }
function mqStartTimer(){
  clearInterval(mqTimerHandle);
  mqTimerHandle = setInterval(()=>{
    const el = document.getElementById('mqTimer');
    if(!mqSession || mqSession.finished || !el){ if(!mqSession) clearInterval(mqTimerHandle); return; }
    const sec = Math.floor((Date.now()-mqSession.start)/1000);
    el.textContent = String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  },1000);
}
function mqExit(force){
  if(mqSession && !mqSession.finished && mqSession.mode!=='read' && !force && Object.keys(mqSession.answers).length){
    if(!confirm('બહાર નીકળશો તો આ પ્રયત્ન સેવ નહીં થાય. બહાર નીકળવું છે?')) return;
  }
  mqSession = null; clearInterval(mqTimerHandle); renderMain(); mqScrollTop();
}
let _mqSelHolder = {};
function mqGetTest(id){
  if(typeof id==='string' && id.startsWith('sel:')){
    const ids = id.slice(4).split(',').filter(Boolean);
    const tests = ids.map(i=>DB.qtests.find(x=>x.id===i)).filter(Boolean);
    if(!tests.length) return null;
    const questions = [], srcs = []; tests.forEach(t=>t.questions.forEach((q,i)=>{ questions.push(q); srcs.push({t:t.id, i}); }));
    return {id, name:'પસંદ કરેલી ટેસ્ટ ('+tests.length+')', questions, srcs, attempts:[], virtual:true, folderId:mqFolderId, nTests:tests.length};
  }
  if(typeof id==='string' && id.startsWith('folder:')){
    const fid = id.slice(7);
    const f = DB.qfolders.find(x=>x.id===fid); if(!f) return null;
    const tests = mqFolderTestsDeep(fid).slice().sort((a,b)=>a.name.localeCompare(b.name,'gu',{numeric:true}));
    const questions = [], srcs = []; tests.forEach(t=>t.questions.forEach((q,i)=>{ questions.push(q); srcs.push({t:t.id, i}); }));
    return {id, name:f.name, questions, srcs, attempts:[], virtual:true, folderId:fid, nTests:tests.length};
  }
  return DB.qtests.find(x=>x.id===id);
}
function mqTest(){ return mqGetTest(mqSession.testId); }
function renderMqSession(){
  const S = mqSession;
  if(S.mode==='read') return mqRenderRead();
  if(S.finished) return mqRenderResult();
  return mqRenderQuestion();
}
function mqRenderQuestion(){
  const S = mqSession, t = mqTest(), qi = S.idx[S.pos], q = t.questions[qi];
  const picked = S.answers[qi];
  const practice = S.mode==='practice';
  const locked = practice && picked!==undefined;
  const perm = (S.perm && S.perm[qi]) || [0,1,2,3];
  const opts = perm.map((k,d)=>{
    const o = q.opts[k];
    let cls = '';
    if(locked && q.ans!=null){ if(k===q.ans) cls='ok'; else if(k===picked) cls='bad'; }
    else if(picked===k) cls='sel';
    return `<button class="mq-opt ${cls}" onclick="mqPick(${k})"><span class="ltr">${MQ_LET[d]}</span><span style="flex:1;">${esc(o)}</span></button>`;
  }).join('');
  const total = S.idx.length;
  const answeredN = Object.keys(S.answers).length;
  const loc = mqLoc(S, t, S.pos), multi = loc.nT>1 || !!t.virtual;
  return mqSticky(`
   <div class="mq-topbar mq-center">
     <button class="btn btn-sm btn-secondary" onclick="mqExit()">✕ બહાર</button>
     <span class="mq-title">${esc(multi?loc.name:t.name)}</span>
     <span class="badge badge-primary" id="mqTimer">00:00</span>
   </div>
   <div class="mq-bar"><i style="width:${Math.round((S.pos+1)/total*100)}%"></i></div>
   <div class="ink-dim" style="font-size:12.5px;display:flex;justify-content:space-between;">
     <span>${S.mode==='test'?'⏱ ટેસ્ટ':'✍ પ્રેક્ટિસ'}${S.setCode&&S.setCode!=='A'?' · સેટ '+S.setCode:''} · ${multi?`ટેસ્ટ ${loc.ti}/${loc.nT} · પ્રશ્ન ${loc.j}/${loc.m}`:`પ્રશ્ન ${S.pos+1}/${total}`} · +${fmtMark((S.marks||{pos:1}).pos)}/−${fmtMark((S.marks||{neg:0}).neg)}</span><span>જવાબ આપ્યા: ${answeredN}</span></div>`) + `
   <div class="card" style="margin-top:8px;">
     <div class="mq-q">${multi?loc.j:S.pos+1}. ${esc(q.q)}</div>
     ${opts}
     ${locked && q.ans==null?'<div class="ink-dim" style="font-size:12.5px;">આ પ્રશ્ન માટે જવાબ ચાવી નથી</div>':''}
     ${locked && q.ans!=null?`<div style="font-weight:700;margin-top:4px;color:${picked===q.ans?'var(--success)':'var(--danger)'};">${picked===q.ans?'✅ સાચો જવાબ!':'❌ ખોટો — સાચો: ('+MQ_LET[perm.indexOf(q.ans)]+')'}</div>`:''}
   </div>
   <div class="mq-nav">
     <button class="btn btn-secondary" ${S.pos===0?'disabled':''} onclick="mqMove(-1)">◀ પાછળ</button>
     <button class="btn btn-secondary" onclick="mqOpenPalette()">▦ ${S.pos+1}/${total}</button>
     ${S.pos<total-1?`<button class="btn btn-primary" onclick="mqMove(1)">આગળ ▶</button>`:`<button class="btn btn-primary" onclick="mqFinish()">સમાપ્ત ✔</button>`}
   </div>`;
}
function mqPick(k){
  const S = mqSession, qi = S.idx[S.pos];
  if(S.mode==='practice'){ if(S.answers[qi]!==undefined) return; S.answers[qi]=k; }
  else { if(S.answers[qi]===k) delete S.answers[qi]; else S.answers[qi]=k; }
  renderMain();
  if(S.mode==='test'){ mqStartTimer(); }
}
function mqMove(d){
  const S = mqSession; S.pos = Math.max(0, Math.min(S.idx.length-1, S.pos+d)); renderMain(); mqScrollTop();
}
function mqOpenPalette(){
  const S = mqSession, t = mqTest();
  const cells = S.idx.map((qi,p)=>{
    const a = S.answers[qi]; let cls = a!==undefined?'done':'';
    if(S.mode==='practice' && a!==undefined && t.questions[qi].ans!=null) cls = a===t.questions[qi].ans?'ok':'bad';
    if(p===S.pos) cls += ' cur';
    return `<button class="${cls}" onclick="mqGoto(${p})">${p+1}</button>`;
  }).join('');
  openSheet(`<h3>પ્રશ્નો</h3><div class="ink-dim" style="font-size:12.5px;">જવાબ આપ્યા: ${Object.keys(S.answers).length}/${S.idx.length}</div>
    <div class="mq-pal">${cells}</div>
    <div class="sheet-actions"><button class="btn btn-primary btn-block" onclick="closeSheet(); mqFinish();">સમાપ્ત કરો ✔</button></div>`);
}
function mqGoto(p){ mqSession.pos = p; closeSheet(); renderMain(); mqScrollTop(); }
function mqFinish(){
  const S = mqSession;
  const un = S.idx.length - Object.keys(S.answers).length;
  if(un>0 && !confirm(`${un} પ્રશ્નો બાકી છે. છતાં સમાપ્ત કરવું છે?`)) return;
  const t = mqTest();
  let correct=0, wrong=0, skipped=0;
  S.idx.forEach(qi=>{
    const a = S.answers[qi], q = t.questions[qi];
    if(a===undefined) skipped++; else if(q.ans!=null && a===q.ans) correct++; else if(q.ans!=null) wrong++; else skipped++;
  });
  const total = S.idx.length;
  const timeSec = Math.floor((Date.now()-S.start)/1000);
  const mk = S.marks || {pos:1, neg:0};
  const score = Math.round((correct*mk.pos - wrong*mk.neg)*100)/100;
  const maxScore = Math.round(total*mk.pos*100)/100;
  const pct = maxScore>0 ? Math.max(0, Math.round(score/maxScore*100)) : 0;
  S.result = {correct, wrong, skipped, total, pct, score, maxScore, pos:mk.pos, neg:mk.neg, timeSec};
  S.finished = true; clearInterval(mqTimerHandle);
  /* એક સાથે ઘણી ટેસ્ટ આપી હોય તો દરેક ટેસ્ટમાં તેનું પોતાનું પરિણામ (વાર, સાચા, ગુણ) સેવ થાય */
  if(t.virtual && t.srcs && S.idx.length===t.questions.length){
    const groups = {};
    S.idx.forEach(qi=>{ const sr = t.srcs[qi]; if(sr) (groups[sr.t] = groups[sr.t] || []).push({gi:qi, li:sr.i}); });
    const breakdown = []; let revDone = 0;
    Object.keys(groups).forEach(tid=>{
      const rt = DB.qtests.find(x=>x.id===tid); if(!rt) return;
      const items = groups[tid];
      if(items.length !== rt.questions.length) return;
      let c=0, w=0, sk=0; const ans = {};
      items.forEach(({gi,li})=>{
        const a = S.answers[gi], q = rt.questions[li];
        if(a===undefined) sk++; else { ans[li] = a; if(q.ans!=null && a===q.ans) c++; else if(q.ans!=null) w++; else sk++; }
      });
      const tot = items.length;
      const sc = Math.round((c*mk.pos - w*mk.neg)*100)/100, mx = Math.round(tot*mk.pos*100)/100;
      const pc = mx>0 ? Math.max(0, Math.round(sc/mx*100)) : 0;
      mqRecordAttempt(rt, {id:uid(), date:todayStr(), mode:S.mode, set:S.setCode||'A', correct:c, wrong:w, skipped:sk, total:tot, pct:pc, score:sc, maxScore:mx, pos:mk.pos, neg:mk.neg, timeSec:Math.round(timeSec*tot/Math.max(1,total)), combined:true});
      const due = (DB.qrevs||[]).filter(r=>r.testId===rt.id && r.status==='pending' && r.dueDate<=todayStr()).sort((a,b)=>a.dueDate.localeCompare(b.dueDate))[0];
      if(due){ due.status='completed'; due.completedDate=todayStr(); revDone++; }
      breakdown.push({name:rt.name, c, tot, sc, mx, pc});
    });
    S.result.breakdown = breakdown;
    if(breakdown.length){ save(); setTimeout(()=>toast(`${breakdown.length} ટેસ્ટનું પરિણામ સેવ થયું ✅${revDone?` · ${revDone} રિવિઝન પૂર્ણ`:''}`),400); }
  }
  if(!t.virtual && S.idx.length===t.questions.length){
    mqRecordAttempt(t, {id:uid(), date:todayStr(), mode:S.mode, set:S.setCode||'A', ...S.result});
    const due = (DB.qrevs||[]).filter(r=>r.testId===t.id && r.status==='pending' && r.dueDate<=todayStr()).sort((a,b)=>a.dueDate.localeCompare(b.dueDate))[0];
    if(due){ due.status='completed'; due.completedDate=todayStr(); setTimeout(()=>toast('આ ટેસ્ટનું રિવિઝન પૂર્ણ ગણાયું ✅'),400); }
    save();
  }
  renderMain(); mqScrollTop();
}
function mqRenderResult(){
  const S = mqSession, t = mqTest(), r = S.result;
  const color = pctColor(r.pct);
  const wrongIdx = S.idx.filter(qi=>{ const a=S.answers[qi], q=t.questions[qi]; return a!==undefined && q.ans!=null && a!==q.ans; });
  const skipIdx = S.idx.filter(qi=>S.answers[qi]===undefined);
  const revCard = (qi, num)=>{
    const a = S.answers[qi], q = t.questions[qi];
    const isOk = a!==undefined && q.ans!=null && a===q.ans;
    if(isOk) return '';
    const pm = (S.perm && S.perm[qi]) || [0,1,2,3];
    return `<div class="card mq-readcard"><div class="mq-q">${num}. ${esc(q.q)}</div>
      ${pm.map((k,d)=>`<div class="mq-opt ${k===q.ans?'ok':(k===a?'bad':'')}"><span class="ltr">${MQ_LET[d]}</span><span style="flex:1;">${esc(q.opts[k])}</span></div>`).join('')}
      <div class="ink-dim" style="font-size:12.5px;">${a===undefined?'તમે જવાબ આપ્યો નથી':'તમારો જવાબ: ('+MQ_LET[pm.indexOf(a)]+')'}${q.ans!=null?' · સાચો: ('+MQ_LET[pm.indexOf(q.ans)]+')':''}</div></div>`;
  };
  const review = t.virtual ? '' : S.idx.map((qi,p)=>revCard(qi,p+1)).join('');
  let perTest = '';
  if(t.virtual){
    perTest = `<div class="card"><div class="card-title">ટેસ્ટ મુજબ પરિણામ</div><div class="ink-dim fs-12" style="margin-bottom:6px;">ટેસ્ટ પર ટેપ કરો — તેના ખોટા / બાકી MCQ દેખાશે</div>` + mqGroups(t, S.idx).map(g=>{
      let c=0,w=0,sk=0; const mk=S.marks||{pos:1,neg:0};
      const cards = g.items.map((qi,j)=>{ const a=S.answers[qi], q=t.questions[qi];
        if(a===undefined) sk++; else if(q.ans!=null && a===q.ans) c++; else if(q.ans!=null) w++; else sk++;
        return revCard(qi, j+1); }).join('');
      const tot=g.items.length, sc=Math.round((c*mk.pos-w*mk.neg)*100)/100, mx=Math.round(tot*mk.pos*100)/100, pc=mx>0?Math.max(0,Math.round(sc/mx*100)):0;
      const bad = w+sk;
      return `<details class="mq-det"><summary class="item cursor-default" style="list-style:none;cursor:pointer;"><span style="flex:1;min-width:0;"><b>${esc(g.name)}</b><div class="ink-dim fs-12">${c}/${tot} સાચા · ${w} ખોટા · ${sk} બાકી · ગુણ ${fmtMark(sc)}/${fmtMark(mx)}</div></span><span class="badge ${pc>=70?'badge-success':(pc>=40?'badge-warning':'badge-danger')}">${pc}%</span><span class="ink-dim" style="margin-left:6px;">▾</span></summary>${bad?cards:'<div class="ink-dim" style="text-align:center;padding:10px;">🎉 આ ટેસ્ટમાં બધા સાચા!</div>'}</details>`;
    }).join('') + `</div>`;
  }
  return `
   ${mqSticky(`<div class="mq-topbar mq-center"><button class="btn btn-sm btn-secondary" onclick="mqExit(true)">← પાછા</button><span class="mq-title">${esc(t.name)}</span><span></span></div>`)}
   <div class="card" style="text-align:center;">
     <div style="font-size:44px;font-weight:900;color:${color};">${r.pct}%</div>
     ${r.maxScore!=null?`<div style="font-weight:800; font-size:17px; margin-top:2px;">ગુણ: ${fmtMark(r.score)} / ${fmtMark(r.maxScore)}</div><div class="ink-dim fs-12">(✓ +${fmtMark(r.pos)} · ✗ −${fmtMark(r.neg)})</div>`:''}
     <div class="ink-dim">${r.correct} સાચા / ${r.total} પ્રશ્નો · ⏱ ${String(Math.floor(r.timeSec/60)).padStart(2,'0')}:${String(r.timeSec%60).padStart(2,'0')}</div>
     <div class="mq-stat">
       <div class="subject-mini-stat" style="background:color-mix(in srgb, var(--success) 14%, transparent);"><b style="color:var(--success);">${r.correct}</b><span>સાચા</span></div>
       <div class="subject-mini-stat" style="background:color-mix(in srgb, var(--danger) 14%, transparent);"><b style="color:var(--danger);">${r.wrong}</b><span>ખોટા</span></div>
       <div class="subject-mini-stat"><b>${r.skipped}</b><span>બાકી</span></div>
     </div>
     <div class="mq-actions">
       <button class="btn btn-primary btn-sm" onclick="openMqSet('${t.id}','test')">⏱ ફરી ટેસ્ટ</button>
       ${(wrongIdx.length+skipIdx.length)?`<button class="btn btn-secondary btn-sm" onclick="mqStart('${t.id}','practice',[${wrongIdx.concat(skipIdx).join(',')}],'${S.setCode||'A'}')">🔁 ખોટા પ્રશ્નો ફરી</button>`:''}
       <button class="btn btn-secondary btn-sm" onclick="mqStart('${t.id}','read')">📖 વાંચન</button>
     </div>
   </div>
   ${perTest}
   ${t.virtual?'':(review?`<div class="section-header"><h3>ખોટા / બાકી પ્રશ્નો</h3></div>${review}`:'<div class="card" style="text-align:center;">🎉 બધા જવાબ સાચા!</div>')}`;
}
function mqRenderRead(){
  const S = mqSession, t = mqTest();
  const list = S.idx.filter(qi=>!S.onlyStar || t.questions[qi].star);
  const card = (qi)=>{
    const q = t.questions[qi]; const num = (t.virtual && t.srcs[qi]) ? t.srcs[qi].i+1 : qi+1;
    return `<div class="card mq-readcard">
      <div style="display:flex;gap:8px;"><div class="mq-q" style="flex:1;">${num}. ${esc(q.q)}</div>
        <div style="flex-shrink:0;display:flex;flex-direction:column;gap:6px;">
          <button class="btn btn-sm btn-secondary" onclick="mqToggleStar(${qi})">${q.star?'⭐':'☆'}</button>
          <button class="btn btn-sm btn-secondary" onclick="openQQuestionForm(${qi})">✎</button></div></div>
      ${q.opts.map((o,k)=>`<div class="mq-opt ${(S.showAns && k===q.ans)?'ok':''}"><span class="ltr">${S.showAns && k===q.ans?'✓':MQ_LET[k]}</span><span style="flex:1;">${esc(o)}</span></div>`).join('')}
    </div>`;
  };
  let cards;
  if(t.virtual){
    const gs = mqGroups(t, list);
    cards = gs.map((g,k)=>`<div class="mq-rsec" data-tname="${esc(g.name)}"><div class="mq-rhead">📘 ${esc(g.name)} <span class="ink-dim fs-12">· ટેસ્ટ ${k+1}/${gs.length} · ${g.items.length} પ્રશ્નો</span></div>${g.items.map(card).join('')}</div>`).join('');
  } else cards = list.map(card).join('');
  const firstName = t.virtual ? ((mqGroups(t,list)[0]||{}).name || t.name) : t.name;
  return `
   ${mqSticky(`<div class="mq-topbar mq-center"><button class="btn btn-sm btn-secondary" onclick="mqExit(true)">← પાછા</button><span class="mq-title" id="mqReadTitle">${esc(firstName)}</span><span></span></div>
   <div class="mq-actions" style="margin:0;">
     <button class="btn btn-sm ${S.showAns?'btn-primary':'btn-secondary'}" onclick="mqSession.showAns=!mqSession.showAns; renderMain();">${S.showAns?'🙈 જવાબ છુપાવો':'👁 જવાબ બતાવો'}</button>
     <button class="btn btn-sm ${S.onlyStar?'btn-primary':'btn-secondary'}" onclick="mqSession.onlyStar=!mqSession.onlyStar; renderMain();">⭐ ફક્ત તારાંકિત</button>
   </div>`)}
   ${cards || emptyRow('કોઈ પ્રશ્ન નથી')}`;
}
function mqUpdateReadTitle(){
  if(!mqSession || mqSession.mode!=='read') return;
  const el = document.getElementById('mqReadTitle'); if(!el) return;
  const secs = document.querySelectorAll('.mq-rsec'); if(!secs.length) return;
  const mt = document.getElementById('main').getBoundingClientRect().top + 70;
  let cur = secs[0];
  secs.forEach(x=>{ if(x.getBoundingClientRect().top <= mt) cur = x; });
  const n = cur.dataset.tname; if(el.textContent!==n) el.textContent = n;
}
function mqToggleStar(qi){
  const q = mqTest().questions[qi]; q.star = !q.star; save();
  const y = window.scrollY; renderMain(); window.scrollTo(0,y);
}
function openQQuestionForm(qi){
  const q = mqTest().questions[qi];
  openSheet(`
    <h3>પ્રશ્ન ${qi+1} એડિટ</h3>
    <div class="field"><label>પ્રશ્ન</label><textarea class="mq-ta" style="min-height:90px;" id="f_qq">${esc(q.q)}</textarea></div>
    ${MQ_LET.map((l,k)=>`<div class="field"><label>વિકલ્પ ${l}</label><input type="text" id="f_qo${k}" value="${esc(q.opts[k])}"></div>`).join('')}
    <div class="field"><label>સાચો જવાબ</label><select id="f_qa"><option value="">— નથી —</option>${MQ_LET.map((l,k)=>`<option value="${k}" ${q.ans===k?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="sheet-actions">
      <button class="btn btn-danger" onclick="deleteQQuestion(${qi})">ડિલીટ</button>
      <button class="btn btn-primary btn-block" onclick="saveQQuestion(${qi})">સેવ કરો</button>
    </div>`);
}
function deleteQQuestion(qi){
  const S = mqSession; if(!S) return;
  const t = mqTest(); if(!t) return;
  const q = t.questions[qi]; if(!q) return;
  if(!confirm('આ પ્રશ્ન કાયમ માટે ડિલીટ કરવો છે? (પ્રશ્ન '+(qi+1)+')')) return;
  const owner = DB.qtests.find(x=>x.questions.includes(q));
  if(!owner){ toast('પ્રશ્ન મળ્યો નહીં','error'); return; }
  owner.questions.splice(owner.questions.indexOf(q),1);
  /* સત્રની યાદી ગોઠવો: ડિલીટ થયેલા પછીના નંબર એક ઓછા */
  S.idx = S.idx.filter(i=>i!==qi).map(i=>i>qi?i-1:i);
  const np = {}; Object.keys(S.perm||{}).forEach(k=>{ k=+k; if(k===qi) return; np[k>qi?k-1:k] = S.perm[k]; }); S.perm = np;
  save(); closeSheet(); const y=window.scrollY; renderMain(); window.scrollTo(0,y);
  toast('પ્રશ્ન ડિલીટ થયો 🗑');
}
function saveQQuestion(qi){
  const q = mqTest().questions[qi];
  q.q = val('f_qq'); MQ_LET.forEach((_,k)=>{ q.opts[k] = val('f_qo'+k); });
  const a = val('f_qa'); q.ans = a===''?null:+a;
  save(); closeSheet(); const y=window.scrollY; renderMain(); window.scrollTo(0,y);
}

/* ---- MCQ ટેસ્ટ: રિવિઝન, ફોલ્ડર બુક, ડેશબોર્ડ ---- */
function qrevsForActiveExam(){
  const ids = new Set(DB.qtests.filter(t=>t.examId===mqExamId()).map(t=>t.id));
  return (DB.qrevs||[]).filter(r=>ids.has(r.testId));
}
function mqAttemptsOn(dateStr){
  const out = [];
  DB.qtests.filter(t=>t.examId===mqExamId()).forEach(t=>(t.attempts||[]).forEach(a=>{ if(a.date===dateStr) out.push({t,a}); }));
  return out;
}
function mqAttemptsCardHTML(dateStr){
  const list = mqAttemptsOn(dateStr);
  if(!list.length) return '';
  return `<div class="card mt-14"><div class="item item-static"><b>🧠 MCQ ટેસ્ટ આપી</b></div>${list.map(({t,a})=>`<div class="item" onclick="mqGoToTest('${t.id}')"><span style="flex:1;">${esc(t.name)} <span class="ink-dim fs-12">· ${a.mode==='practice'?'પ્રેક્ટિસ':'ટેસ્ટ'}</span></span><span class="badge ${a.pct>=70?'badge-success':(a.pct>=40?'badge-warning':'badge-danger')}">${a.correct}/${a.total} · ${a.pct}%</span></div>`).join('')}</div>`;
}

}
function mqRevLineHTML(t){
  const revs = (DB.qrevs||[]).filter(r=>r.testId===t.id).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const done = revs.filter(r=>r.status==='completed').length + (t.revCount||0);
  const tot = revs.length + (t.revCount||0);
  const next = revs.find(r=>r.status==='pending');
  const overdue = next && next.dueDate<todayStr();
  let last = t.lastRev || ''; revs.forEach(r=>{ if(r.status==='completed'){ const d=r.completedDate||r.dueDate; if(d>last) last=d; } });
  const bits = [];
  if(last) bits.push(`🔁 છેલ્લું રિવિઝન: ${formatDate(last)}`);
  if(tot) bits.push(`${done}/${tot} પૂર્ણ`);
  return (bits.length||next)?`<div style="display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;"><span class="ink-dim" style="font-size:12px;flex:1;min-width:0;">${bits.join(' · ')}</span>${next?`<span class="badge ${overdue?'badge-danger':'badge-warning'}">${overdue?'મોડું · ':'આગામી · '}${formatDateShort(next.dueDate)}</span>`:''}</div>`:'';
}

function confirmQTestRevisionPicker(testId, dates){
  const existing = (DB.qrevs||[]).filter(r=>r.testId===testId);
  const keep = new Set(dates);
  const removeIds = new Set(existing.filter(r=>r.status==='pending' && !keep.has(r.dueDate)).map(r=>r.id));
  DB.qrevs = (DB.qrevs||[]).filter(r=>!removeIds.has(r.id));
  const have = new Set(DB.qrevs.filter(r=>r.testId===testId).map(r=>r.dueDate));
  let stage = existing.reduce((m,r)=>Math.max(m,r.stage||0),0);
  dates.forEach(d=>{ if(have.has(d)) return; stage++; DB.qrevs.push({id:uid(), testId, dueDate:d, status:'pending', stage}); have.add(d); });
  save(); closeSheet(); renderMain(); toast('ટેસ્ટ રિવિઝન તારીખો સેવ થઈ 🔁');
}

function dashboardQuizPages(exam){
  const tests = DB.qtests.filter(t=>t.examId===mqExamId());
  if(!tests.length) return [];
  const attempted = tests.filter(t=>(t.attempts||[]).length);
  const lastPcts = attempted.map(t=>t.attempts[t.attempts.length-1].pct);
  const avg = lastPcts.length ? Math.round(lastPcts.reduce((a,b)=>a+b,0)/lastPcts.length) : 0;
  const today = todayStr();
  const totalTimesAll = tests.reduce((a,t)=>a+mqTimes(t),0);
  const pct = Math.round(attempted.length/tests.length*100);
  const revs = qrevsForActiveExam();
  const rBaseAll = qrevBase(tests.map(t=>t.id));
  const rDone = revs.filter(r=>r.status==='completed').length + rBaseAll;
  const rTotAll = revs.length + rBaseAll;
  const rPend = revs.filter(r=>r.status==='pending');
  const rOver = rPend.filter(r=>r.dueDate<today).length;
  const rUp = rPend.length - rOver;
  const rPct = rTotAll ? Math.round(rDone/rTotAll*100) : 0;
  const open = `if(bookClickOK()){ if(mqNavReset()) mqFolderId=null; showTab('mock'); }`;
  const top = (title)=>`<div class="hero-top"><div><div class="hero-exam-name">${title}</div><div class="hero-exam-date">${esc(exam.name)} · 📅 ${formatDate(exam.date)}</div></div><button class="btn btn-sm" onclick="${open}">ખોલો</button></div>`;
  const p2 = `<div class="hero-card hero-quiz">${top('🧠 MCQ ટેસ્ટ')}
     <div class="hero-ring-row">${ringSVG(pct, null, 'ટેસ્ટ')}
       <div class="hero-ring-stats">
         <div class="ring-stat"><span>ટેસ્ટ પૂર્ણ</span><b><span class="hero-count" data-target="${attempted.length}">0</span>/${tests.length}</b></div>
         <div class="ring-stat"><span>સરેરાશ સ્કોર</span><b>${lastPcts.length?avg+'%':'-'}</b></div>
         <div class="ring-stat"><span>કુલ વખત આપી</span><b class="hero-count" data-target="${totalTimesAll}">0</b></div>
       </div></div></div>`;
  const p3 = `<div class="hero-card hero-qrev">${top('🔁 ટેસ્ટ રિવિઝન')}
     <div class="hero-ring-row">${ringSVG(rPct, null, 'રિવિઝન')}
       <div class="hero-ring-stats">
         <div class="ring-stat"><span>રિવિઝન પૂર્ણ</span><b><span class="hero-count" data-target="${rDone}">0</span>/${rTotAll}</b></div>
         <div class="ring-stat"><span>બાકી · પાછલા</span><b class="hero-count" data-target="${rOver}" style="color:${rOver?'#FFB4A8':'#fff'};">0</b></div>
         <div class="ring-stat"><span>બાકી · આજ/આવનારા</span><b class="hero-count" data-target="${rUp}">0</b></div>
       </div></div></div>`;
  return [p2, p3];
}

function dashboardQuizList(){

function mqFolderChain(folderId){
  const out = []; let cur = folderId, guard = 0;
  while(cur && guard++<20){ const f = DB.qfolders.find(x=>x.id===cur); if(!f) break; out.unshift(f); cur = f.parentId; }
  return out;
}
function mqCompleteMany(ids){
  if(!confirm('આ બધા ટેસ્ટ રિવિઝન પૂર્ણ કરવા છે?')) return;
  const set = new Set(ids.split(','));
  (DB.qrevs||[]).forEach(r=>{ if(set.has(r.id) && r.status==='pending'){ r.status='completed'; r.completedDate=todayStr(); } });
  save(); renderMain(); toast('રિવિઝન પૂર્ણ ✅');
}
/* કેલેન્ડરમાં MCQ ટેસ્ટ રિવિઝન — ફોલ્ડર મુજબ (ટોપ ફોલ્ડર = વિભાગ, પેટા ફોલ્ડર = કાર્ડ) */
function qrevCalendarHTML(revs){
  const items = [];
  revs.forEach(r=>{
    const t = DB.qtests.find(x=>x.id===r.testId); if(!t) return;
    items.push({t, pendId: r.status==='pending'?r.id:null, done: r.status==='completed',
      right: r.status==='completed'?'<span class="badge badge-success">✓ પૂર્ણ</span>':`<button class="btn btn-sm btn-primary" onclick="event.stopPropagation(); mqCompleteRev('${r.id}')">✓</button>`});
  });
  return mqFolderGroupedHTML(items);
}
/* ફોલ્ડર મુજબ ગોઠવણી: ટોપ ફોલ્ડર = વિભાગ (ખોલ-બંધ), પેટા ફોલ્ડર = કાર્ડ */
function mqFolderGroupedHTML(items){
  const tops = {}, topOrder = [];
  items.forEach(it=>{
    const t = it.t, chain = mqFolderChain(t.folderId);
    const topId = chain[0] ? chain[0].id : '_none';
    const subId = chain.length>1 ? chain[chain.length-1].id : '_direct';
    if(!tops[topId]){ tops[topId] = {name: chain[0]?chain[0].name:'', subs:{}, subOrder:[]}; topOrder.push(topId); }
    const T = tops[topId];
    if(!T.subs[subId]){ T.subs[subId] = {name: chain.length>1 ? '📁 '+chain.slice(1).map(f=>f.name).join(' › ') : (chain[0]?'':'MCQ ટેસ્ટ'), items:[]}; T.subOrder.push(subId); }
    T.subs[subId].items.push(Object.assign({}, it, {rest:''}));
  });
  const card = (S)=>{
    S.items.sort((a,b)=>a.t.name.localeCompare(b.t.name,'gu',{numeric:true}));
    const pend = S.items.filter(x=>x.pendId).map(x=>x.pendId);
    return `<div class="card">
      ${S.name||pend.length>1?`<div class="item item-static"><b>${esc(S.name)}</b>${pend.length>1?`<button class="btn btn-sm btn-primary" onclick="mqCompleteMany('${pend.join(',')}')">✓ બધા પૂર્ણ કરો</button>`:''}</div>`:''}
      ${S.items.map(x=>`<div class="item"><span style="flex:1;min-width:0;" onclick="mqGoToTest('${x.t.id}')"><b>${esc(x.t.name)}</b>${x.rest?` <span class="ink-dim fs-12">${esc(x.rest)}</span>`:''}${x.extra||''}</span>${x.right||''}</div>`).join('')}
    </div>`;
  };
  return topOrder.map(topId=>{
    const T = tops[topId];
    const cards = T.subOrder.map(k=>card(T.subs[k])).join('');
    if(topId==='_none') return `<div class="mt-14">${cards}</div>`;
    let total=0, pending=0, hasPend=false; T.subOrder.forEach(k=>T.subs[k].items.forEach(x=>{ total++; if(x.pendId) pending++; if('pendId' in x) hasPend=true; }));
    const badge = !hasPend ? `<span class="badge badge-primary">${total}</span>` : (pending===0 ? `<span class="badge badge-success">✓ બધા પૂર્ણ</span>` : (pending===total ? `<span class="badge badge-warning">${total} બાકી</span>` : `<span class="badge badge-warning">${total-pending}/${total} પૂર્ણ</span>`));
    const wrapId = 'qsecacc_'+topId+'_'+calMode;
    return `<div class="mt-14">${renderAccordionBlock(wrapId, `<span class="ink-dim fw-700 fs-125">📂 ${esc(T.name)}</span>`, badge, cards, isAccordionOpen(wrapId), {headerStyle:'border:none; padding:4px 2px;', bodyStyle:'padding-left:0;'})}</div>`;
  }).join('');
}

function mqPdfTypeChange(){
  const r = document.querySelector('input[name=pdfType]:checked');

function mqPrintPdf(testId){
  const t = mqGetTest(testId); if(!t) return;
  const typeEl = document.querySelector('input[name=pdfType]:checked');
  const solved = !!(typeEl && typeEl.value==='solved');
  const withKey = !solved && !!(document.getElementById('pdfKey')||{}).checked;
  const withName = !solved && !!(document.getElementById('pdfName')||{}).checked;
  closeSheet();
  const L = MQ_LET;
  const qHTML = (q,i)=>`<div class="pq"><div><b class="qn">${i+1}.</b>${esc(q.q)}</div>${(q.opts||[]).map((o,k)=>o?(solved && q.ans===k?`<div class="po pok">(${L[k]}) ${esc(o)}</div>`:`<div class="po">(${L[k]}) ${esc(o)}</div>`):'').join('')}</div>`;
  const section = (name, qsArr, first)=>{
    const keyH = withKey ? `<div class="pk"><div class="ph"><h1>જવાબ ચાવી</h1><div>${esc(name)}</div></div><div class="pkg">${qsArr.map((q,i)=>`<div><b>${i+1}.</b> ${q.ans!=null?L[q.ans]:'-'}</div>`).join('')}</div></div>` : '';
    return `<div class="psec ${first?'':'pnew'}"><div class="ph"><h1>${esc(name)}${solved?' — જવાબ સાથે':''}</h1><div>કુલ પ્રશ્નો: ${qsArr.length}</div></div>${withName?`<div class="pm"><span>નામ: ____________________</span><span>તારીખ: __________</span><span>ગુણ: ____ / ${qsArr.length}</span></div>`:''}<div class="pqs">${qsArr.map(qHTML).join('')}</div>${keyH}</div>`;
  };
  let html;
  if(t.virtual && t.srcs){
    /* દરેક ટેસ્ટ નવા પાનેથી, પ્રશ્ન નંબર 1 થી, ટેસ્ટનું નામ હેડિંગમાં, દરેકની પોતાની ચાવી */
    html = mqGroups(t, t.questions.map((_,i)=>i)).map((g,k)=>section(g.name, g.items.map(qi=>t.questions[qi]), k===0)).join('');
  } else html = section(t.name, t.questions, true);
  let pa = document.getElementById('printArea');
  if(!pa){ pa = document.createElement('div'); pa.id='printArea'; document.body.appendChild(pa); }
  pa.innerHTML = html;
  const oldTitle = document.title; document.title = t.name + (solved?' - જવાબ સાથે':'');
  const done = ()=>{ document.title = oldTitle; pa.innerHTML=''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(()=>window.print(), 150);
}

  const out = mapKids(mainId).filter(k=>mapLeafVisible(k.id)).map(k=>({id:k.id, name:k.name, n:mapCatScopeCount(k.id)}));

  return out;
}
function mapSubItems(mainId){ const r = mapSubRaw(mainId); if(r.length<2) return []; return [{id:'__all', name:'બધા', n:r.reduce((a,x)=>a+x.n,0)}].concat(r); }

}

function mapApplyView(){

    c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',(9/ppu).toFixed(2)); t.setAttribute('x',x); t.setAttribute('y',y); t.setAttribute('font-size',(10.5/ppu).toFixed(2)); });

function mapAnimate(target){
  const from = {...mapCur()}, t0 = performance.now(), dur = 340; target = mapClamp({...target});
  const step = now=>{ let k = Math.min(1,(now-t0)/dur); k = 1-Math.pow(1-k,3);
    mapView = {x:from.x+(target.x-from.x)*k, y:from.y+(target.y-from.y)*k, w:from.w+(target.w-from.w)*k, h:from.h+(target.h-from.h)*k};
    mapApplyView(); if(now-t0<dur) requestAnimationFrame(step); else { mapView = target; mapApplyView(); } };

/* ---- નકશા-PDF: માહિતી જિલ્લાની અંદર જ, પડોશી જિલ્લામાં ક્રોસ ન થાય ---- */
const MP_MIN = 6.2, MP_MAX = 12;
let _mpCtx = null;
function mpMeasure(txt){ if(!_mpCtx){ _mpCtx = document.createElement('canvas').getContext('2d'); _mpCtx.font = '100px '+(getComputedStyle(document.body).fontFamily||'sans-serif'); } return _mpCtx.measureText(txt).width/100; }
function mpPoly(d){ const rings=[]; d.split('M').forEach(r=>{ const n=r.match(/-?\d+(?:\.\d+)?/g); if(!n||n.length<6) return; const pts=[]; for(let i=0;i+1<n.length;i+=2) pts.push([+n[i],+n[i+1]]); rings.push(pts); }); return rings; }
function mpMask(d, bb){
  const rings = mpPoly(d); const X0=Math.floor(bb.x0), Y0=Math.floor(bb.y0), W=Math.ceil(bb.x1-bb.x0)+1, H=Math.ceil(bb.y1-bb.y0)+1;
  const sat = new Int32Array((W+1)*(H+1));
  for(let y=0;y<H;y++){ let row=0; for(let x=0;x<W;x++){ const px=X0+x+0.5, py=Y0+y+0.5; let ins=false;
      for(const r of rings){ for(let a=0,b=r.length-1;a<r.length;b=a++){ const [xi,yi]=r[a],[xj,yj]=r[b]; if(((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) ins=!ins; } }
      row += ins?0:1; sat[(y+1)*(W+1)+x+1] = sat[y*(W+1)+x+1] + row; } }
  return {X0,Y0,W,H,sat};
}
function mpFree(m,x,y,w,h){ /* લંબચોરસ પૂરેપૂરો જિલ્લાની અંદર? */
  const x0=Math.floor(x-m.X0), y0=Math.floor(y-m.Y0), x1=Math.ceil(x+w-m.X0), y1=Math.ceil(y+h-m.Y0);
  if(x0<0||y0<0||x1>m.W||y1>m.H) return false; const S=m.W+1, a=m.sat;
  return a[y1*S+x1]-a[y0*S+x1]-a[y1*S+x0]+a[y0*S+x0]===0;
}
function mpWrap(txt, f, W){
  const words = txt.split(/\s+/); const lines=[]; let cur='';
  words.forEach(w=>{ const t = cur?cur+' '+w:w; if(cur && mpMeasure(t)*f > W){ lines.push(cur); cur='  '+w; } else cur=t; });
  if(cur) lines.push(cur); return lines.map(l=>({t:l, w:mpMeasure(l)*f}));
}
/* એક જિલ્લા માટે સૌથી મોટા અક્ષરો કે જેમાં બધું અંદર સમાય */
function mpFit(dist, items, fmin){ fmin = fmin||MP_MIN;
  const bb = mapBBox(dist.d, dist.bk||dist.k); const m = mpMask(dist.d, bb);
  const bw = bb.x1-bb.x0;
  for(let f=MP_MAX; f>=fmin-0.001; f-=0.4){
    for(const wf of [1, 0.75, 0.55, 0.42]){

/* ---- ઘણાં સ્થળ એકસાથે (પેસ્ટ → પ્રિવ્યૂ → ઉમેરો) ---- */
function mapNorm(t){ return String(t||'').replace(/[\s​-‍.,()\-–_]/g,'').replace(/ી/g,'િ').replace(/ૂ/g,'ુ').replace(/ઈ/g,'ઇ').replace(/ઊ/g,'ઉ').replace(/ઁ|ં/g,'').replace(/ૅ/g,'').toLowerCase(); }
const MAP_DIST_ALIAS = {'છોટાઉદેપુર':'Chota Udaipur','છોટાઉદયપુર':'Chota Udaipur','કચ્છ':'Kachchh','કચ્છ':'Kachchh','કચ્છ':'Kachchh','ડાંગ':'The Dangs','ડાંગ્સ':'The Dangs','દ્વારકા':'Devbhumi Dwarka','દેવભૂમિદ્વારકા':'Devbhumi Dwarka','પંચમહાલ':'Panch Mahals','દાહોદ':'Dohad','દાહોદ':'Dohad','સોમનાથ':'Gir Somnath','મહીસાગર':'Mahisagar','જુનાગઢ':'Junagadh','બનાસકાંઠા':'Banas Kantha','સાબરકાંઠા':'Sabar Kantha','અમદાવાદ':'Ahmadabad','મહેસાણા':'Mahesana'};
let _mapDistIdx = null;
function mapDistLookup(txt){
  if(!_mapDistIdx){ _mapDistIdx = {}; GJ_MAP.d.forEach(d=>{ _mapDistIdx[mapNorm(d.n)] = d.k; _mapDistIdx[mapNorm(d.k)] = d.k; }); Object.keys(MAP_DIST_ALIAS).forEach(a=>{ _mapDistIdx[mapNorm(a)] = MAP_DIST_ALIAS[a]; }); }
  return _mapDistIdx[mapNorm(txt)] || '';
}
function mapTalLookup(distKey, txt){ const n = mapNorm(txt); if(!n) return ''; const t = mapTalList(distKey).find(x=>mapNorm(x.n)===n || mapNorm(x.n.replace(/\(.*\)/,''))===n); return t ? t.n : ''; }
function mapParseBulkOther(text){
  return String(text||'').split(/\r?\n/).map(r=>r.trim()).filter(Boolean).map(raw=>{ const c=raw.split(/\||\t/).map(x=>x.trim()); return {key:raw, name:c[0]||'', loc:c[1]||'', dist:'', note:c.slice(2).join(' | '), cat:''}; });
}
function mapParseBulk(text){
  if(mapIsOther()) return mapParseBulkOther(text);
  const rows = [];
  String(text||'').replace(/\r/g,'').split('\n').forEach(raw=>{
    let line = raw.replace(/^\s*(?:[-•*▪●]|\d{1,3}\s*[.)])\s*/,'').trim(); if(!line) return;
    let name='', loc='', dist='', note='', cat='';
    if(/\||\t/.test(line)){
      const c = line.split(/\s*\|\s*|\t+/).map(x=>x.trim());
      name = c[0]||''; 
      if(c.length>=3){ loc=c[1]; dist=mapDistLookup(c[2]); note=c[3]||''; cat=c[4]||''; if(!dist && mapDistLookup(c[1])){ dist=mapDistLookup(c[1]); loc=''; note=c.slice(2).join(' | '); } }
      else if(c.length===2){ const d2=mapDistLookup(c[1]); if(d2) dist=d2; else loc=c[1]; }
    } else {
      const tk = line.split(/\s+/); let found = false;
      for(let n=Math.min(3,tk.length-1); n>=1 && !found; n--){ const d=mapDistLookup(tk.slice(tk.length-n).join(' ')); if(d){ dist=d; tk.splice(tk.length-n,n); found=true; } }
      if(found){
        let tFound=false;
        for(let n=Math.min(3,tk.length-1); n>=1 && !tFound; n--){ const t=mapTalLookup(dist, tk.slice(tk.length-n).join(' ')); if(t){ loc=t; tk.splice(tk.length-n,n); tFound=true; } }
        if(!tFound && tk.length>=3){ loc = tk.pop(); }
      }
      name = tk.join(' ');
    }
    if(dist && loc){ const t = mapTalLookup(dist, loc); if(t) loc = t; }
    rows.push({key:raw.trim(), name, loc, dist, note, cat});
  });
  return rows;
}

const BOOKS = {};
let bookClickBlockUntil = 0;
function bookClickOK(){ return Date.now() > bookClickBlockUntil; }
function bookHTML(bid, pages, extraCls){
  const prev = BOOKS[bid];
  const i = prev ? Math.min(prev.i, pages.length-1) : 0;
  BOOKS[bid] = {pages, i, drag:null, busy:false};
  return `<div class="book ${extraCls||''}" id="bk_${bid}" data-bid="${bid}" onpointerdown="bookDown(event)" onpointermove="bookMove(event)" onpointerup="bookUp(event)" onpointercancel="bookUp(event,true)">
     <div class="book-sizer" aria-hidden="true">${pages.join('')}</div>
     <div class="bk-half bk-L"><div class="bk-in">${pages[i]}</div></div>
     <div class="bk-half bk-R"><div class="bk-in">${pages[i]}</div></div>
   </div>
   <div class="hero-dots" id="bkd_${bid}">${pages.map((_,k)=>`<i class="${k===i?'on':''}" onclick="bookGo('${bid}',${k})"></i>`).join('')}</div>`;
}
function bookDotsUpdate(bid){
  const st = BOOKS[bid];
  document.querySelectorAll('#bkd_'+bid+' i').forEach((d,k)=>d.classList.toggle('on', k===st.i));
}
function bookSetFinal(root){ /* સીધી અંતિમ કિંમતો (એનિમેશન વગર) */
  root.querySelectorAll('.hr-circle, .ring-progress').forEach(c=>{ c.style.transition='none'; c.style.strokeDashoffset=c.dataset.offset; });
  root.querySelectorAll('.hr-text').forEach(t=>{ t.textContent = t.dataset.target+'%'; });
  root.querySelectorAll('.hero-count').forEach(e=>{ e.textContent = e.dataset.target; });
}
function bookHalfHTML(card){ return '<div class="bk-in">'+card+'</div>'; }
function bookSetHalves(bid){
  const el = document.getElementById('bk_'+bid); if(!el) return;
  const st = BOOKS[bid];
  const L = el.querySelector('.bk-L'), R = el.querySelector('.bk-R');
  L.innerHTML = bookHalfHTML(st.pages[st.i]); R.innerHTML = bookHalfHTML(st.pages[st.i]);
  bookSetFinal(L); bookSetFinal(R);
}
function bookMakeLeaf(bid, dir, target){
  /* dir<0: જમણું અડધું પાનું ડાબી તરફ ફરે; dir>0: ડાબું અડધું પાનું જમણી તરફ ફરે */
  const el = document.getElementById('bk_'+bid);
  const st = BOOKS[bid];
  const cur = st.pages[st.i], other = st.pages[target];
  const leaf = document.createElement('div');
  leaf.className = 'bk-leaf ' + (dir<0 ? 'right' : 'left');
  const frontCls = dir<0 ? 'bk-fr' : 'bk-fl';
  const backCls  = dir<0 ? 'bk-fl' : 'bk-fr';
  leaf.innerHTML =
    '<div class="bk-face front '+frontCls+'"><div class="bk-in">'+cur+'</div><div class="bk-shade"></div></div>'+
    '<div class="bk-face back '+backCls+'"><div class="bk-in">'+other+'</div><div class="bk-shade"></div></div>';
  el.appendChild(leaf);
  bookSetFinal(leaf);
  const under = el.querySelector(dir<0 ? '.bk-R' : '.bk-L');
  under.innerHTML = bookHalfHTML(other); bookSetFinal(under);
  return leaf;
}
function bookSetAngle(leaf, dir, a){
  leaf.style.transform = 'rotateY('+(dir<0?-a:a)+'deg)';
  const f = leaf.querySelector('.front .bk-shade'), b = leaf.querySelector('.back .bk-shade');
  if(f) f.style.opacity = a<90 ? (a/90*0.3).toFixed(3) : 0;
  if(b) b.style.opacity = a>90 ? ((180-a)/90*0.3).toFixed(3) : 0.3;
  leaf.style.boxShadow = (dir<0?'-':'')+'8px 0 18px rgba(0,0,0,'+(Math.sin(a*Math.PI/180)*0.35).toFixed(3)+')';
}
function bookFinish(bid, leaf, dir, target, complete){
  const st = BOOKS[bid];
  leaf.classList.add('anim');
  requestAnimationFrame(()=>bookSetAngle(leaf, dir, complete?180:0));
  st.busy = true;
  setTimeout(()=>{
    if(complete){ st.i = target; bookDotsUpdate(bid); }
    bookSetHalves(bid);
    leaf.remove();
    st.busy = false; st.drag = null;
  }, 480);
}
function bookGo(bid, k){
  const st = BOOKS[bid]; if(!st || k===st.i || st.busy || st.drag) return;
  const dir = k>st.i ? -1 : 1;
  const leaf = bookMakeLeaf(bid, dir, k);
  bookSetAngle(leaf, dir, 0);
  leaf.getBoundingClientRect();
  bookFinish(bid, leaf, dir, k, true);
}
function bookTarget(st, dir){ const n=st.pages.length; return dir<0 ? (st.i+1)%n : (st.i-1+n)%n; }
function bookDown(e){
  const el = e.currentTarget, st = BOOKS[el.dataset.bid];
  if(!st || st.busy || st.pages.length<2 || (e.pointerType==='mouse' && e.button!==0)) return;
  st.drag = {x:e.clientX, y:e.clientY, dir:0, leaf:null, id:e.pointerId, w:el.getBoundingClientRect().width, lastX:e.clientX, lastT:performance.now(), v:0, angle:0, target:0};
}
function bookMove(e){
  const el = e.currentTarget, bid = el.dataset.bid, st = BOOKS[bid]; if(!st) return;
  const d = st.drag; if(!d || d.id!==e.pointerId || st.busy) return;
  const dx = e.clientX - d.x, dy = e.clientY - d.y;
  if(!d.dir){
    if(Math.abs(dx) < 8) return;
    if(Math.abs(dy) > Math.abs(dx)) { st.drag = null; return; }
    d.dir = dx<0 ? -1 : 1;
    d.target = bookTarget(st, d.dir);
    d.leaf = bookMakeLeaf(bid, d.dir, d.target);
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
  }
  const proj = Math.max(0, dx * (d.dir<0 ? -1 : 1));
  d.angle = Math.min(180, proj / (d.w*0.85) * 180);
  const now = performance.now();
  d.v = (e.clientX - d.lastX) / Math.max(1, now - d.lastT) * (d.dir<0 ? -1 : 1);
  d.lastX = e.clientX; d.lastT = now;
  bookSetAngle(d.leaf, d.dir, d.angle);
}
function bookUp(e, cancelled){
  const el = e.currentTarget, bid = el.dataset.bid, st = BOOKS[bid]; if(!st) return;
  const d = st.drag; if(!d || d.id!==e.pointerId) return;
  if(!d.dir){ st.drag = null; return; }
  bookClickBlockUntil = Date.now() + 450;
  const complete = !cancelled && (d.angle > 60 || (d.v > 0.5 && d.angle > 15));
  bookFinish(bid, d.leaf, d.dir, d.target, complete);
}
function animateDashboardHero(){
  const circles = Array.from(document.querySelectorAll('[id^=bk_hero] .bk-half .hr-circle'));
  if(!circles.length) return;
  const texts = Array.from(document.querySelectorAll('[id^=bk_hero] .bk-half .hr-text'));
  const counts = Array.from(document.querySelectorAll('[id^=bk_hero] .bk-half .hero-count'));
  const duration = 1200;
  requestAnimationFrame(()=>{ circles.forEach(c=>{ c.style.strokeDashoffset = c.dataset.offset; }); });
  const startTime = performance.now();
  function tick(now){
    const progress = Math.min(1, (now-startTime)/duration);
    const eased = 1 - Math.pow(1-progress, 3);
    texts.forEach(t=>{ t.textContent = Math.round(Number(t.dataset.target||0)*eased)+'%'; });
    counts.forEach(el=>{ el.textContent = Math.round(Number(el.dataset.target||0)*eased); });
    if(progress<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

let cropState = null;
function openCropSheet(dataUrl){
  const img = new Image();
  img.onload = function(){

function initCropViewport(img){
  const viewport = document.getElementById('cropViewport');
  if(!viewport) return;
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const baseScale = Math.max(vw/img.naturalWidth, vh/img.naturalHeight);
  cropState = {
    img, viewportEl: viewport, imgEl: document.getElementById('cropImg'),
    vw, vh, naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight,
    baseScale, zoom: 1, offsetX: 0, offsetY: 0, dragging: false,
    startX: 0, startY: 0, startOffsetX: 0, startOffsetY: 0
  };
  const s = cropState;
  const scale = s.baseScale * s.zoom;
  s.offsetX = (s.vw - s.naturalWidth*scale)/2;
  s.offsetY = (s.vh - s.naturalHeight*scale)/2;
  applyCropTransform();
  viewport.addEventListener('pointerdown', cropPointerDown);
  viewport.addEventListener('pointermove', cropPointerMove);
  viewport.addEventListener('pointerup', cropPointerUp);
  viewport.addEventListener('pointercancel', cropPointerUp);
}
function clampCropOffset(){
  const s = cropState;
  const scale = s.baseScale * s.zoom;
  const dw = s.naturalWidth*scale, dh = s.naturalHeight*scale;
  s.offsetX = Math.min(0, Math.max(s.vw-dw, s.offsetX));
  s.offsetY = Math.min(0, Math.max(s.vh-dh, s.offsetY));
}
function applyCropTransform(){
  const s = cropState;
  const scale = s.baseScale * s.zoom;
  s.imgEl.style.width = (s.naturalWidth*scale)+'px';
  s.imgEl.style.height = (s.naturalHeight*scale)+'px';
  s.imgEl.style.transform = `translate(${s.offsetX}px, ${s.offsetY}px)`;
}
function onCropZoomChange(val){
  if(!cropState) return;
  cropState.zoom = Number(val)/100;
  clampCropOffset();
  applyCropTransform();
}
function cropPointerDown(e){
  if(!cropState) return;
  cropState.dragging = true;
  cropState.startX = e.clientX; cropState.startY = e.clientY;
  cropState.startOffsetX = cropState.offsetX; cropState.startOffsetY = cropState.offsetY;
  cropState.viewportEl.setPointerCapture(e.pointerId);
  cropState.viewportEl.style.cursor = 'grabbing';
}
function cropPointerMove(e){
  if(!cropState || !cropState.dragging) return;
  cropState.offsetX = cropState.startOffsetX + (e.clientX - cropState.startX);
  cropState.offsetY = cropState.startOffsetY + (e.clientY - cropState.startY);
  clampCropOffset();
  applyCropTransform();
}
function cropPointerUp(){
  if(!cropState) return;
  cropState.dragging = false;
  cropState.viewportEl.style.cursor = 'grab';
}
function saveCroppedPhoto(){
  if(!cropState) return;
  const s = cropState;
  const OUT = 320;
  const outScale = OUT / s.vw;
  const scale = s.baseScale * s.zoom;
  const canvas = document.createElement('canvas');
  canvas.width = OUT; canvas.height = OUT;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(s.img, s.offsetX*outScale, s.offsetY*outScale, s.naturalWidth*scale*outScale, s.naturalHeight*scale*outScale);
  DB.settings.photoData = canvas.toDataURL('image/jpeg', 0.88);
  cropState = null;
  save(); populateBrand(); closeSheet(); toast('ફોટો સેવ થયો');
}

function notificationStatusText(){
  if(!('Notification' in window)) return '❌ આ બ્રાઉઝર સપોર્ટ નથી કરતું';
  if(Notification.permission==='granted') return '✅ ચાલુ છે';
  if(Notification.permission==='denied') return '❌ બ્રાઉઝર સેટિંગ્સમાંથી બ્લોક છે — ત્યાંથી જ ચાલુ કરવું પડશે';
  return '⚪ બંધ છે';
}
function requestNotificationPermission(){
  if(!('Notification' in window)){ toast('આ બ્રાઉઝર સપોર્ટ નથી કરતું','error'); return; }
  Notification.requestPermission().then(function(perm){
    if(perm==='granted'){
      toast('નોટિફિકેશન ચાલુ થયું 🔔');
      showAppNotification('ExamPath 🎓','નોટિફિકેશન ચાલુ થઈ ગયું!','welcome');
      checkNotifications();
    } else toast('પરવાનગી ના મળી','error');
    renderMain();
  });
}
function showAppNotification(title, body, tag){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  if('serviceWorker' in navigator){
    navigator.serviceWorker.ready.then(function(reg){
      if(reg && reg.showNotification) reg.showNotification(title, {body:body, icon:'icon-192.png', badge:'icon-192.png', tag:tag||undefined});
      else new Notification(title, {body:body, icon:'icon-192.png', tag:tag||undefined});
    }).catch(function(){ try{ new Notification(title, {body:body, icon:'icon-192.png', tag:tag||undefined}); }catch(e){} });
  } else {
    try{ new Notification(title, {body:body, icon:'icon-192.png', tag:tag||undefined}); }catch(e){}
  }
}

function checkNotifications(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const exam = getActiveExam();
  if(!exam) return;
  const log = getNotifyLog();
  let changed = false;

  if(!log.revisionsNotified){
    const pending = revisionsForActiveExam().filter(r=>r.dueDate===todayStr() && r.status==='pending').length;
    if(pending>0) showAppNotification('🔁 આજની રિવિઝન', pending+' રિવિઝન બાકી છે', 'due-today');
    log.revisionsNotified = true; changed = true;
  }

  if(!log.overdueNotified){
    const overdue = revisionsForActiveExam().filter(r=>r.status==='pending' && r.dueDate<todayStr()).length;
    if(overdue>0) showAppNotification('⚠️ ઓવરડ્યુ રિવિઝન', overdue+' રિવિઝન ઓવરડ્યુ છે', 'overdue');
    log.overdueNotified = true; changed = true;
  }

  if(!log.streakNotified){
    const st = calcStudyStreak(exam);
    if(st.streak>0 && !st.todayDone) showAppNotification('🔥 સ્ટ્રીક તૂટવાની તૈયારીમાં!', 'તમારી '+st.streak+' દિવસની સ્ટ્રીક છે — આજે કંઈક અભ્યાસ નોંધો!', 'streak');
    log.streakNotified = true; changed = true;
  }

  if(changed) saveNotifyLog(log);
}
function initHideOnScroll(){
  const main = document.getElementById('main'); if(!main) return;
  const tb = document.querySelector('.topbar');
  let last = 0, tbOff = 0, tbH = tb ? tb.offsetHeight : 0, animT = null;
  function applyTb(off){
    if(!tb) return;
    tbOff = off;
    tb.style.marginTop = (-off)+'px';
    tb.style.opacity = tbH ? String(Math.max(0, 1 - off/tbH)) : '1';
  }
  /* ટોચનું હેડર સ્ક્રોલના અંતર પ્રમાણે જ સરકે છે — જેટલું સ્ક્રોલ, એટલું જ અને એટલી જ ઝડપે */
  window.__hdrShow = ()=>{
    last = main.scrollTop;
    if(tb && tbOff){ tb.classList.add('tb-anim'); clearTimeout(animT); animT = setTimeout(()=>tb.classList.remove('tb-anim'), 260); }
    applyTb(0);
    main.querySelectorAll('.hs-sticky').forEach(el=>{el._tr=0; el.style.transform=''; el.style.pointerEvents='';});
  };
  main.addEventListener('scroll', ()=>{
    const y = main.scrollTop, dy = y - last;
    last = y;
    if(mqSession && mqSession.mode==='read') mqUpdateReadTitle();
    if(window.__lastViewKey !== undefined){ (window.__scrollMem = window.__scrollMem || {})[window.__lastViewKey] = y; }
    if(!dy) return;
    const els = main.querySelectorAll('.hs-sticky');
    if(y <= 20){ window.__hdrShow(); return; }
    if(tb && !tbOff){ tbH = tb.offsetHeight; }
    const ae = document.activeElement;
    const typing = !!(ae && ae.closest && ae.closest('.hs-sticky'));
    const mt = main.getBoundingClientRect().top;
    let allShown = true;
    els.forEach(el=>{
      const h = el.offsetHeight + 8;
      let tr = el._tr || 0;
      if(dy > 0){
        if(typing){ return; }
        const u = el.getBoundingClientRect().top - mt - tr;
        const sp=el.style.position, st=el.style.top, sf=el.style.transform;
        el.style.position='relative'; el.style.top='auto'; el.style.transform='none';
        const nt = el.offsetTop;
        el.style.position=sp; el.style.top=st; el.style.transform=sf;
        const ntTr = Math.min(0, (nt - y) - u);
        tr = Math.max(tr - dy, ntTr, -h);
      } else {
        tr = Math.min(0, tr - dy);
      }
      el._tr = tr;
      el.style.transform = tr ? `translateY(${tr}px)` : '';
      el.style.pointerEvents = tr < -h*0.5 ? 'none' : '';
      if(tr < -1) allShown = false;
    });
    if(typing || !tb) return;
    if(dy > 0 && y > 40){
      /* હેડર નાનું થતાં સ્ક્રીન મોટી થાય — સામગ્રી ટૂંકી હોય તો scroll અટકી ન જાય એટલે જગ્યા જેટલું જ */
      const room = main.scrollHeight - main.clientHeight - main.scrollTop;
      const d = Math.min(dy, Math.max(0, room));
      if(d > 0 && tbOff < tbH) applyTb(Math.min(tbH, tbOff + d));
    } else if(dy < 0 && allShown && tbOff > 0){
      applyTb(Math.max(0, tbOff + dy));
    }
  }, {passive:true});
}
async function init(){
  await bootData();
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  initHideOnScroll();
  applyTheme();
  buildNav();
  populateBrand();
  populateExamSwitcher();
  showTab('dashboard');
  checkNotifications();
  setInterval(checkNotifications, 60000);
  try{ storageCheck(JSON.stringify(DB).length); refreshStorageEstimate(); }catch(e){}
  setTimeout(()=>checkForUpdate(false), 4000);
  if(DB.settings.compactOn){ try{ compactHistory(); save(); }catch(e){} } else setTimeout(compactStartupPrompt, 2500);
  setInterval(()=>checkForUpdate(false), 30*60*1000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkForUpdate(false); });
}
window.addEventListener('DOMContentLoaded', init);
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(e){ console.error('SW register failed', e); });
  });
}
