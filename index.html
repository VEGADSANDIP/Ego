<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ExamPath">
<meta name="theme-color" content="#2E3AA8">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ExamPath — સ્ટડી ટ્રેકર</title>
<script>
(function(){
  try{
    var theme = localStorage.getItem('examPathTheme');
    if(!theme){ var raw = localStorage.getItem('examPathData_v1'); theme = raw ? (JSON.parse(raw).settings || {}).theme : null; }
    theme = theme || 'light';
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelector('meta[name="theme-color"]').setAttribute('content', theme==='dark' ? '#1A1A1A' : '#FFFFFF');
  }catch(e){
    document.documentElement.setAttribute('data-theme','light');
  }
})();
</script>
<style>
:root{
  --bg:#F3F4FA; --surface:#FFFFFF; --surface2:#ECEEF7; --ink:#1B1E2B; --ink-dim:#6A6F87;
  --primary:#2E3AA8; --primary-ink:#FFFFFF; --accent:#F5A623; --success:#1FA971; --danger:#E1484D; --warning:#F5A623;
  --border:rgba(20,22,40,0.10); --shadow:0 1px 2px rgba(20,22,45,.06),0 8px 24px rgba(20,22,45,.07);
  --overlay:rgba(10,12,25,0.5);
  --radius:16px; --radius-sm:10px;
}
[data-theme="dark"]{
  --bg:#000000; --surface:#1A1A1A; --surface2:#262626; --ink:#F5F5F5; --ink-dim:#A8A8A8;
  --primary:#6376F5; --primary-ink:#0E1120; --accent:#FFC24B; --success:#37C98B; --danger:#FF6B6E; --warning:#FFC24B;
  --border:rgba(255,255,255,0.08); --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.5);
  --overlay:rgba(0,0,0,0.6);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0; height:100%; overflow:hidden;}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Gujarati",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
input, textarea{
  -webkit-user-select:text; user-select:text; -webkit-touch-callout:default;
}
.app-shell{max-width:480px;margin:0 auto;position:relative;height:100vh; height:100dvh; background:var(--bg); display:flex; flex-direction:column; overflow:hidden;}
@media (min-width:600px){ .app-shell{box-shadow:var(--shadow);} body{background:var(--surface2);} }
.hidden{display:none !important;}
.mt-8{margin-top:8px;} .mt-10{margin-top:10px;} .mt-12{margin-top:12px;} .mt-14{margin-top:14px;} .mb-6{margin-bottom:6px;} .m-0{margin:0;}
.cursor-default{cursor:default;} .cursor-pointer{cursor:pointer;} .item-static{border:none;padding:0;cursor:default;}
.fs-12{font-size:12px;} .fs-125{font-size:12.5px;} .fw-400{font-weight:400;} .fw-700{font-weight:700;}
.flex-1{flex:1;} .flex-col{display:flex; flex-direction:column;} .flex-gap-4{display:flex; gap:4px;} .flex-gap-6{display:flex; gap:6px;}
h1,h2,h3{margin:0 0 8px 0; letter-spacing:-0.02em; font-weight:800;}
h2{font-size:19px;}
h3{font-size:15px;}
p{margin:0;}
button{font-family:inherit;}
a{color:inherit;}

.topbar{flex:0 0 auto; z-index:20; background:var(--surface); border-bottom:1px solid var(--border); will-change:margin-top, opacity;}
.topbar.tb-anim{transition:margin-top .25s ease, opacity .2s ease;}
.topbar-inner{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; gap:8px;}
.brand{font-weight:800; font-size:17px; letter-spacing:-0.02em;}
.brand-row{display:flex; align-items:center; gap:8px;}
.brand-avatar{width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:22px; cursor:pointer; background:var(--surface2); flex-shrink:0;}
.brand-avatar img{width:100%; height:100%; object-fit:cover; display:block;}
#examSwitcher{max-width:150px; font-size:12px; padding:6px 8px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--ink);}

.main{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 14px 14px 14px; position:relative;}


.section-header{display:flex; align-items:center; justify-content:space-between; margin:18px 2px 8px 2px;}
.section-header h3{margin:0;}
.hs-sticky>.section-header:first-child{margin-top:0;}

.card{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:12px;}
.card-title{font-weight:700; font-size:14px; margin-bottom:8px; color:var(--ink);}

.hero-card{background:linear-gradient(145deg,var(--primary),#1B2680); color:#fff; border-radius:20px; padding:18px; margin-bottom:14px; box-shadow:var(--shadow);}
[data-theme="dark"] .hero-card{background:linear-gradient(145deg,#33408C,#0A0A0A);}
.hero-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
.hero-exam-name{font-size:19px; font-weight:800;}
.hero-exam-date{font-size:12px; opacity:0.85; margin-top:2px;}
.hero-top .btn{background:rgba(255,255,255,0.18); color:#fff;}
.hero-ring-row{display:flex; align-items:center; gap:14px; margin-top:14px;}
.ring-svg{flex-shrink:0;}
.ring-progress-hero{transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1), stroke .3s ease;}
.hero-ring-stats{display:flex; flex-direction:column; gap:8px; flex:1;}
.ring-stat{display:flex; justify-content:space-between; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.15); padding-bottom:6px;}
.ring-stat:last-child{border:none; padding-bottom:0;}
.ring-stat b{font-size:16px;}
.ring-stat span{opacity:0.85;}

.book{position:relative; perspective:1700px; touch-action:pan-y; user-select:none; -webkit-user-select:none; margin-bottom:6px;}
.book-sizer{display:grid; visibility:hidden; pointer-events:none;}
.book-sizer>*{grid-area:1/1; margin:0;}
.bk-half{position:absolute; top:0; bottom:0; width:50%; overflow:hidden;}
.bk-L{left:0;} .bk-R{left:50%;}
.bk-in{position:absolute; top:0; bottom:0; width:200%;}
.bk-L .bk-in, .bk-face.bk-fl .bk-in{left:0;}
.bk-R .bk-in, .bk-face.bk-fr .bk-in{left:-100%;}
.bk-in>.hero-card, .bk-in>.card{height:100%; margin:0; box-sizing:border-box;}
.book-card{margin-bottom:0;}
.sub-book-wrap .hero-dots{margin:4px 0 14px;}
.hero-card.hero-rev{background:linear-gradient(145deg,#6A2C91,#2A1458);}
.hero-card.hero-quiz{background:linear-gradient(145deg,#0F766E,#073B38);}
.hero-card.hero-qrev{background:linear-gradient(145deg,#B45309,#5A2A06);}
[data-theme="dark"] .hero-card.hero-quiz{background:linear-gradient(145deg,#0F766E,#0A0A0A);}
[data-theme="dark"] .hero-card.hero-qrev{background:linear-gradient(145deg,#9A4708,#0A0A0A);}
[data-theme="dark"] .hero-card.hero-rev{background:linear-gradient(145deg,#5B2A86,#0A0A0A);}
.bk-leaf{position:absolute; top:0; bottom:0; width:50%; z-index:3; transform-style:preserve-3d; will-change:transform;}
.bk-leaf.right{left:50%; transform-origin:left center;}
.bk-leaf.left{left:0; transform-origin:right center;}
.bk-leaf.anim{transition:transform .45s cubic-bezier(.3,.7,.3,1);}
.bk-face{position:absolute; inset:0; overflow:hidden; backface-visibility:hidden; -webkit-backface-visibility:hidden;}
.bk-face.back{transform:rotateY(180deg);}
.bk-shade{position:absolute; inset:0; background:#000; opacity:0; pointer-events:none;}
.hero-dots{display:flex; justify-content:center; gap:7px; margin:2px 0 12px;}
.hero-dots i{width:7px; height:7px; border-radius:50%; background:var(--ink); opacity:.25; transition:all .3s;}
.hero-dots i.on{opacity:.9; width:18px; border-radius:4px;}

/* રિંગ જેવી ટેબ પટ્ટી: એક લીટી, ડાબે-જમણે ફરે, વચ્ચેનું ટેબ ચાલુ */
.ring{position:relative; margin:8px 0 12px; background:var(--surface2); border-radius:14px; overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18%,#000 82%,transparent 100%); mask-image:linear-gradient(90deg,transparent 0,#000 18%,#000 82%,transparent 100%);}
.ring::before{content:''; position:absolute; left:32%; width:36%; top:5px; bottom:5px; background:var(--surface); border-radius:10px; box-shadow:var(--shadow); pointer-events:none;}
.ring-track{position:relative; display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain; padding:6px 0; perspective:500px; touch-action:pan-x pan-y;}
.ring-track::-webkit-scrollbar{display:none;}
.ring-track button{flex:0 0 36%; scroll-snap-align:center; scroll-snap-stop:always; border:none; background:transparent; color:var(--ink); font-weight:800; font-size:14.5px; font-family:inherit; padding:11px 4px; white-space:nowrap; transform-origin:center; will-change:transform,opacity;}

/* ગુજરાત નકશો */
.mp-chips{display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none;}
.mp-chips::-webkit-scrollbar{display:none;}
.mp-chip{flex:0 0 auto; border:none; background:var(--surface2); color:var(--ink); padding:8px 13px; border-radius:999px; font-weight:700; font-size:13px; font-family:inherit; cursor:pointer;}
.mp-chip.on{background:var(--primary); color:var(--primary-ink);}
.mp-svg{width:100%; height:auto; display:block;}
.mp-svg path{fill:var(--surface2); stroke:var(--ink-dim); stroke-opacity:.55; stroke-width:.9; stroke-linejoin:round; cursor:pointer; transition:fill-opacity .15s;}
.mp-svg path.has{fill:var(--primary);}
.mp-svg path.sel{stroke:var(--accent); stroke-opacity:1; stroke-width:3.2;}
.mp-badge{fill:var(--accent); pointer-events:none;} .mp-badge-t{fill:#1B1E2B; font-weight:800; font-size:11px; text-anchor:middle; dominant-baseline:central; pointer-events:none;}
.mp-gh{font-weight:800; font-size:13px; color:var(--ink-dim); margin:14px 2px 6px;}
.mp-note{white-space:pre-wrap; line-height:1.65; font-size:14px;}
.seg{display:flex; background:var(--surface2); border-radius:12px; padding:4px; gap:4px; margin-bottom:14px;}
.seg button{flex:1; border:none; background:transparent; color:var(--ink-dim); padding:10px 6px; border-radius:9px; font-weight:700; font-size:13.5px; font-family:inherit;}
.seg-sm button{font-size:12px; padding:9px 2px;}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}
.mq-crumb{font-size:12.5px; color:var(--ink-dim); margin:2px 0 10px; word-break:break-word;}
.mq-row{display:flex; align-items:center; gap:12px;}
.mq-ico{font-size:28px; flex-shrink:0;}
.mq-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
.mq-actions .btn{flex:1; min-width:0; white-space:nowrap;}
.pg-back{margin-bottom:8px;}
.pg-btns{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; margin-bottom:8px;}
.mq-topbar{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
.mq-topbar.mq-center{display:grid; grid-template-columns:1fr minmax(0,2fr) 1fr; gap:6px;}
.mq-topbar.mq-center>:first-child{justify-self:start;} .mq-topbar.mq-center>:last-child{justify-self:end;}
.mq-topbar.mq-center>.mq-title{text-align:center; font-weight:800; font-size:15.5px; line-height:1.35; word-break:break-word;}
.hs-sticky{position:sticky; top:-14px; z-index:6; background:var(--bg); will-change:transform;}
.hs-sticky.hs-hidden{transform:translateY(-125%); opacity:0; pointer-events:none;}
.hs-mid{margin:-6px -14px 8px; padding:14px 14px 6px;}
.mq-sticky{margin:-14px -14px 10px; padding:14px 14px 6px;}
.mq-sticky .seg{margin-bottom:10px;} .mq-sticky .card{margin-bottom:8px;} .mq-sticky .mq-topbar{margin-bottom:8px;} .mq-sticky .mq-bar{margin-bottom:8px;}
.mq-bar{height:6px; background:var(--surface2); border-radius:4px; overflow:hidden; margin-bottom:14px;}
.mq-bar i{display:block; height:100%; background:var(--primary); border-radius:4px; transition:width .3s;}
.mq-q{font-size:17px; font-weight:700; line-height:1.6; margin:4px 0 14px; white-space:pre-wrap;}
.mq-opt{display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; background:var(--surface); color:var(--ink); border:1.5px solid var(--border); border-radius:14px; padding:13px 14px; margin-bottom:10px; font-size:15.5px; font-family:inherit; line-height:1.5;}
.mq-opt .ltr{flex-shrink:0; width:28px; height:28px; border-radius:50%; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;}
.mq-opt.sel{border-color:var(--primary); background:color-mix(in srgb, var(--primary) 12%, transparent);}
.mq-opt.sel .ltr{background:var(--primary); color:#fff;}
.mq-opt.ok{border-color:var(--success); background:color-mix(in srgb, var(--success) 14%, transparent);}
.mq-opt.ok .ltr{background:var(--success); color:#fff;}
.mq-opt.bad{border-color:var(--danger); background:color-mix(in srgb, var(--danger) 14%, transparent);}
.mq-opt.bad .ltr{background:var(--danger); color:#fff;}
.mq-nav{display:flex; gap:10px; margin-top:6px;}
.mq-nav .btn{flex:1;}
.mq-pal{display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin:12px 0;}
.mq-pal button{border:1.5px solid var(--border); background:var(--surface); color:var(--ink); border-radius:10px; padding:10px 0; font-weight:700; font-family:inherit;}
.mq-pal button.done{background:var(--primary); color:#fff; border-color:var(--primary);}
.mq-pal button.cur{outline:2px solid var(--warning);}
.mq-pal button.ok{background:var(--success); color:#fff; border-color:var(--success);}
.mq-pal button.bad{background:var(--danger); color:#fff; border-color:var(--danger);}
.mq-readcard{margin-bottom:12px;}
.mq-readcard .mq-q{font-size:15.5px; margin-bottom:10px;}
.mq-readcard .mq-opt{padding:9px 12px; margin-bottom:6px; font-size:14.5px;}
.mq-stat{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0;}
.mq-ta{width:100%; min-height:190px; padding:10px; border:1px solid var(--border); border-radius:12px; background:var(--surface); color:var(--ink); font-size:14px; font-family:inherit; resize:vertical;}
.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:6px;}
.stat-card{background:var(--surface); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow);}
.stat-icon{font-size:18px;}
.stat-value{font-size:20px; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums;}
.stat-label{font-size:11.5px; color:var(--ink-dim); margin-top:2px;}
.stat-sub{font-size:11px; color:var(--primary); font-weight:700; margin-top:4px;}

.item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); font-size:14px; cursor:pointer;}




.item:last-child{border-bottom:none;}
.ink-dim{color:var(--ink-dim); font-size:12.5px;}
.empty-row{padding:14px 0; text-align:center; color:var(--ink-dim); font-size:13px;}

.topic-row{padding:10px 0; border-bottom:1px solid var(--border);}
.topic-row:last-child{border-bottom:none;}
.topic-row-top{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:14px;}
.btn:disabled{opacity:.3; cursor:default;}
.row-highlight{animation:topicFlash 1.6s ease-out; border-radius:10px;}
@keyframes topicFlash{
  0%{background:rgba(255,193,7,0.28);}
  100%{background:rgba(255,193,7,0);}
}

.badge{padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap;}
.badge-grey{background:var(--surface2); color:var(--ink-dim);}
.badge-warning{background:rgba(245,166,35,0.18); color:#B4740A;}
[data-theme="dark"] .badge-warning{color:var(--warning);}
.badge-success{background:rgba(31,169,113,0.16); color:#178658;}
[data-theme="dark"] .badge-success{color:var(--success);}
.badge-danger{background:rgba(225,72,77,0.15); color:#C13236;}
[data-theme="dark"] .badge-danger{color:var(--danger);}
.badge-primary{background:rgba(46,58,168,0.15); color:#2E3AA8;}
[data-theme="dark"] .badge-primary{color:var(--primary);}

.progress-track{height:8px; border-radius:999px; background:var(--surface2); overflow:hidden;}
.progress-fill{height:100%; background:var(--primary); border-radius:999px; transition:width .3s;}

.btn{padding:10px 16px; border-radius:12px; font-weight:700; font-size:13.5px; border:none; cursor:pointer; background:var(--surface2); color:var(--ink);}
.btn-primary{background:var(--primary); color:var(--primary-ink);}
.btn-secondary{background:var(--surface2); color:var(--ink);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-block{width:100%; text-align:center;}
.btn-sm{padding:6px 11px; font-size:12.5px; border-radius:9px;}

.field{margin-bottom:12px;}
.field label{display:block; margin-bottom:5px; font-size:12.5px; color:var(--ink-dim); font-weight:600;}
.field input, .field select, .field textarea{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg); color:var(--ink); font-size:14.5px; font-family:inherit;
}
.field textarea{min-height:64px; resize:vertical;}

.duration-picker{display:flex; align-items:flex-start; gap:6px;}
.duration-col{display:flex; flex-direction:column; align-items:center; flex:1;}
.duration-col select{width:100%; text-align:center; text-align-last:center; padding:11px 2px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--ink); font-size:16px; font-weight:700; font-family:inherit;}
.duration-label{font-size:10.5px; color:var(--ink-dim); margin-top:5px;}
.duration-sep{font-weight:800; font-size:18px; color:var(--ink-dim); padding-top:9px;}

.sheet-overlay{position:fixed; inset:0; background:var(--overlay); z-index:100; display:flex; align-items:flex-end;}
.sheet-overlay.hidden{display:none;}
.sheet{background:var(--surface); width:100%; max-width:480px; margin:0 auto; border-radius:20px 20px 0 0; padding:10px 18px 22px 18px; max-height:86vh; overflow-y:auto; animation:slideUp .18s ease-out;}
@keyframes slideUp{from{transform:translateY(24px); opacity:0.6;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:38px; height:4px; background:var(--border); border-radius:99px; margin:6px auto 14px auto;}
.sheet-actions{display:flex; gap:8px; margin-top:16px;}
.sheet-actions .btn-block{flex:1;}

.app-banners{position:fixed; left:12px; right:12px; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:150; display:flex; flex-direction:column; gap:8px; pointer-events:none;}
.app-banner{pointer-events:auto; display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; background:var(--ink); color:var(--bg); font-size:13.5px; box-shadow:var(--shadow);}
.app-banner.warn{background:#B45309; color:#fff;} .app-banner.danger{background:#B3261E; color:#fff;}
.app-banner>span{flex:1; line-height:1.4;}
.app-banner .btn{flex-shrink:0;}
.stor-bar{height:10px; border-radius:6px; background:var(--surface2); overflow:hidden; margin:8px 0;}
.stor-bar>i{display:block; height:100%; border-radius:6px; background:var(--success);}

.pin-screen{position:fixed; inset:0; z-index:400; background:var(--bg); display:flex; flex-direction:column; justify-content:space-between; align-items:center; padding:max(28px, env(safe-area-inset-top)) 20px max(22px, env(safe-area-inset-bottom)); animation:pinIn .22s ease;}
@keyframes pinIn{from{opacity:0; transform:scale(1.04);}to{opacity:1; transform:none;}}
.pin-top{text-align:center; margin-top:6vh; width:100%;}
.pin-lock{font-size:30px; margin-bottom:10px;}
.pin-title{font-size:20px; font-weight:800;}
.pin-sub{min-height:20px; margin-top:6px; font-size:13px; color:var(--ink-dim);}
.pin-dots{display:flex; gap:18px; justify-content:center; margin:26px 0 8px;}
.pin-dots i{width:15px; height:15px; border-radius:50%; border:2px solid var(--ink-dim); transition:background .12s, transform .12s;}
.pin-dots i.on{background:var(--ink); border-color:var(--ink); transform:scale(1.08);}
.pin-dots.shake{animation:pinShake .42s;}
@keyframes pinShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-12px);}40%{transform:translateX(10px);}60%{transform:translateX(-8px);}80%{transform:translateX(6px);}}
.pin-len{display:inline-flex; gap:6px; margin-top:12px; background:var(--surface2); padding:4px; border-radius:12px;}
.pin-len button{border:none; background:transparent; color:var(--ink-dim); padding:7px 14px; border-radius:9px; font-weight:700; font-family:inherit; font-size:13px;}
.pin-len button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}
.pin-pad{display:grid; grid-template-columns:repeat(3,76px); gap:16px 22px; justify-content:center; margin-bottom:6px;}

<script>
/* ===================== DATA LAYER ===================== */
const STORAGE_KEY = 'examPathData_v1';

function defaultData(){
  return {
    exams:[], subjects:[], topics:[], revisions:[], sections:[],
    studyLogs:[], activity:{}, mapCats:[], mapPlaces:[], subtopics:[], qfolders:[], sfolders:[], qtests:[], qrevs:[],
    settings:{theme:'light', brandName:'ExamPath', sortPrefs:{sections:'default', subjects:{}, topics:{}}}
  };
}
function normalizeData(parsed){
  const merged = Object.assign(defaultData(), parsed);
  delete merged.timetable; delete merged.chapterTimetable; delete merged.mockTests; /* હવે વપરાતા નથી */
  merged.settings = Object.assign(defaultData().settings, (parsed&&parsed.settings)||{});
  return merged;
}
const APP_VERSION = '2026.11.07-1';
const APP_BUILT = '2026-11-07T11:37:00+05:30'; /* દરેક નવી આવૃત્તિમાં આ સમય પણ બદલવો */
let STORAGE_LIMIT = 5 * 1024 * 1024; /* IndexedDB ન મળે તો localStorage ની આશરે મર્યાદા; નહીંતર ખરી quota */

/* ---- IndexedDB (મોટો ડેટા, GB સુધી) ---- */
const IDB_NAME = 'examPathDB', IDB_STORE = 'kv', IDB_KEY = 'main';
let _idb = null, useIDB = false, _dataLocked = false;
function idbOpen(){
  return new Promise((res, rej)=>{
    if(!window.indexedDB) return rej(new Error('no idb'));
    const rq = indexedDB.open(IDB_NAME, 1);
    rq.onupgradeneeded = ()=>{ rq.result.createObjectStore(IDB_STORE); };
    rq.onsuccess = ()=>res(rq.result);
    rq.onerror = ()=>rej(rq.error);
    rq.onblocked = ()=>rej(new Error('blocked'));
  });
}
function idbGet(key){
  return new Promise((res, rej)=>{
    const tx = _idb.transaction(IDB_STORE,'readonly'); const rq = tx.objectStore(IDB_STORE).get(key);
    rq.onsuccess = ()=>res(rq.result); rq.onerror = ()=>rej(rq.error);
  });
}
function idbSet(key, val){
  return new Promise((res, rej)=>{
    const tx = _idb.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error); tx.onabort = ()=>rej(tx.error||new Error('abort'));
  });
}
/* એપ ખુલતી વખતે ડેટા લોડ: IndexedDB → (પહેલી વાર) localStorage માંથી સુરક્ષિત ટ્રાન્સફર */
async function bootData(){
  try{ _idb = await idbOpen(); useIDB = true; }catch(e){ useIDB = false; console.warn('IndexedDB નથી, localStorage વપરાશે', e); }
  const legacy = (()=>{ try{ return localStorage.getItem(STORAGE_KEY); }catch(e){ return null; } })();
  if(useIDB){
    let raw = null;
    try{ raw = await idbGet(IDB_KEY); }catch(e){ useIDB = false; }
    if(useIDB){
      if(raw){
        try{ DB = normalizeData(JSON.parse(raw)); _lastSaveStr = raw; }
        catch(e){ _dataLocked = true; DB = defaultData(); setTimeout(()=>dataCorruptAlert(), 300); }
        return;
      }
      if(legacy){
        /* ટ્રાન્સફર: લખો → પાછું વાંચીને સરખાવો → પછી જ જૂનો ડેટા દૂર */
        try{
          DB = normalizeData(JSON.parse(legacy));
          await idbSet(IDB_KEY, legacy);
          const back = await idbGet(IDB_KEY);
          if(back === legacy){
            _lastSaveStr = legacy;
            try{ localStorage.setItem('examPathTheme', (DB.settings||{}).theme||'light'); localStorage.removeItem(STORAGE_KEY); }catch(e){}
            setTimeout(()=>toast('ડેટા નવા મોટા સ્ટોરેજમાં સુરક્ષિત ખસેડાયો ✓'), 800);
          } else { useIDB = false; }
        }catch(e){ console.error('ટ્રાન્સફર નિષ્ફળ', e); useIDB = false; }
        return;
      }
      DB = defaultData(); return;
    }
  }
  /* localStorage fallback */
  try{ DB = legacy ? normalizeData(JSON.parse(legacy)) : defaultData(); }
  catch(e){ _dataLocked = true; DB = defaultData(); setTimeout(()=>dataCorruptAlert(), 300); }
}
function dataCorruptAlert(){
  openSheet(`<h3>⚠️ ડેટા વાંચી શકાયો નથી</h3><div class="ink-dim" style="line-height:1.6;">સાચવેલો ડેટા ખરાબ મળ્યો. જૂનો ડેટા બચાવવા માટે નવી સેવ બંધ રાખી છે. બેકઅપ ફાઈલ ઇમ્પોર્ટ કરો.</div>`);
}

let _saveTimer = null, _savePending = false, _lastSaveStr = '';
function save(){
  if(_dataLocked) return;
  try{ if(DB.settings && DB.settings.compactOn) compactHistory(); }catch(e){ console.error('compact failed', e); }
  _savePending = true;
  try{ localStorage.setItem('examPathTheme', (DB.settings||{}).theme||'light'); }catch(e){}
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(flushSave, 120);
}
async function flushSave(){
  if(!_savePending) return;
  _savePending = false; clearTimeout(_saveTimer);
  let str;
  try{ str = JSON.stringify(DB); }catch(e){ storageFailed(e); return; }
  try{
    if(useIDB) await idbSet(IDB_KEY, str); else localStorage.setItem(STORAGE_KEY, str);
    _lastSaveStr = str;
    storageCheck(str.length);
  }catch(e){ storageFailed(e); }
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushSave(); });
window.addEventListener('pagehide', ()=>{ flushSave(); });
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

let DB = defaultData();
let currentTab = 'dashboard';
let examDetailId = null;
let topicDetailId = null;
let sectionDetailId = null;
let subjFolderId = null; /* વિભાગની અંદર ખુલેલું વિષય-ફોલ્ડર (ફાઈલ મેનેજરની જેમ) */
let lastMainTab = 'dashboard';
let highlightTopicId = null;
let highlightRevisionId = null;
let highlightQTestId = null;
let calSelectedDate = null;
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();
let calMode = 'study';
let calKind = 'topic';
let dashStatTab = 'study';
let calGridExpanded = false;
let revCalSelectedDate = null;

/* ===================== HELPERS ===================== */
function esc(str){ if(str===undefined||str===null) return ''; return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* બધા પેજનો ઉપરનો ભાગ સરખો: ઉપર "પાછા", નીચે બીજા બટન, પછી ક્રમ (breadcrumb) */
function pageTopHTML(backCode, btnsHTML, crumbHTML){
  return `${backCode?`<div class="pg-back">${backButtonHTML(backCode)}</div>`:''}${btnsHTML?`<div class="pg-btns">${btnsHTML}</div>`:''}${crumbHTML||''}`;
}
function backButtonHTML(onclickCode){
  return `<button class="btn btn-sm btn-secondary" onclick="${onclickCode}">← પાછા</button>`;
}
function val(id){ const el=document.getElementById(id); return el ? el.value.trim() : ''; }
function todayStr(){ const d=new Date(); const off=d.getTimezoneOffset(); const local=new Date(d.getTime()-off*60000); return local.toISOString().slice(0,10); }
function formatDate(dateStr){ if(!dateStr) return '-'; const d=new Date(dateStr+'T00:00:00'); return d.toLocaleDateString('gu-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function formatDateShort(dateStr){ const d=new Date(dateStr+'T00:00:00'); return d.getDate()+'/'+(d.getMonth()+1); }
function examDaysLeft(dateStr){ if(!dateStr) return 0; const d1=new Date(todayStr()+'T00:00:00'); const d2=new Date(dateStr+'T00:00:00'); return Math.ceil((d2-d1)/86400000); }
function daysLeftColor(d){
  if(d<0) return getVar('--success');
  if(d>=30) return getVar('--success');
  if(d>=10) return getVar('--warning');
  return getVar('--danger');
}
/* ===== ઇતિહાસ ટૂંકો (compact) — જૂનો ડેટા સાચવાતો નથી, ફક્ત છેલ્લી તારીખ + કેટલી વાર ===== */
/* ટેસ્ટનો પ્રયત્ન સેવ: ફક્ત છેલ્લો પ્રયત્ન રહે, જૂનો અપડેટ થઈ જાય (કેટલી વાર + શ્રેષ્ઠ % ચાલુ રહે) */
function mqRecordAttempt(t, att){
  try{ streakRecordAll(); }catch(e){}
  const old = t.attempts || [];
  if(old.length){
    t.timesBase = (t.timesBase||0) + old.length;
    t.bestPct = Math.max(t.bestPct||0, ...old.map(a=>a.pct||0));
  }
  delete att.answers;
  t.attempts = [att];
}
function mqTimes(t){ return (t.timesBase||0) + (t.attempts||[]).length; }
function mqBest(t){ return Math.max(t.bestPct||0, ...(t.attempts||[]).map(a=>a.pct||0)); }
function revBase(subjectIds){
  const set = new Set(subjectIds); let n = 0;
  DB.topics.forEach(t=>{ if(set.has(t.subjectId)) n += (t.revCount||0); });
  DB.subtopics.forEach(x=>{ if(set.has(x.subjectId)) n += (x.revCount||0); });
  return n;
}
function qrevBase(testIds){ const set = new Set(testIds); let n = 0; DB.qtests.forEach(t=>{ if(set.has(t.id)) n += (t.revCount||0); }); return n; }
function topicStudyInfo(t){
  const today = todayStr(); let n = t.studyCount||0, last = t.lastStudy||'';
  const subIds = new Set(DB.subtopics.filter(x=>x.topicId===t.id).map(x=>x.id));
  DB.studyLogs.forEach(l=>{
    if(!l.date || l.date>today) return;
    const hit = (l.topicIds && l.topicIds.includes(t.id)) || l.topicId===t.id || (l.subtopicIds && l.subtopicIds.some(i=>subIds.has(i)));
    if(hit){ n++; if(l.date>last) last = l.date; }
  });
  return {n, last};
}
function topicRevInfo(t){
  let n = t.revCount||0, last = t.lastRev||'';
  DB.subtopics.forEach(x=>{ if(x.topicId===t.id){ n += (x.revCount||0); if((x.lastRev||'')>last) last = x.lastRev; } });
  DB.revisions.forEach(r=>{ if(r.topicId===t.id && r.status==='completed'){ n++; const d=r.completedDate||r.dueDate; if(d>last) last = d; } });
  return {n, last};
}
/* સ્ટ્રીક માટે ફક્ત એક લીટી: {છેલ્લી તારીખ, સળંગ દિવસ} — રોજનો જૂનો ડેટા સાચવવાની જરૂર નથી */
function streakRecordAll(){
  DB.activity = DB.activity || {};
  DB.exams.forEach(e=>{
    const set = new Set(); const ex = e;
    /* આ પરીક્ષાના દિવસો (activityDates હાલની active પરીક્ષા પર ચાલે છે, એટલે અહીં સીધું ગણીએ) */
    const subIds = new Set(DB.subjects.filter(x=>x.examId===ex.id).map(x=>x.id));
    const rec = DB.activity[ex.id];
    if(Array.isArray(rec)) rec.forEach(d=>set.add(d));
    else if(rec && rec.last && rec.count>0){ const c = new Date(rec.last+'T00:00:00'); for(let i=0;i<rec.count;i++){ set.add(toLocalISODate(c)); c.setDate(c.getDate()-1); } }
    DB.studyLogs.forEach(l=>{ if(subIds.has(l.subjectId) && l.date) set.add(l.date); });
    DB.revisions.forEach(r=>{ if(subIds.has(r.subjectId) && r.status==='completed' && r.completedDate) set.add(r.completedDate); });
    const tIds = new Set();
    DB.qtests.forEach(t=>{ if(t.examId===ex.id){ tIds.add(t.id); (t.attempts||[]).forEach(a=>{ if(a.date) set.add(a.date); }); } });
    (DB.qrevs||[]).forEach(r=>{ if(tIds.has(r.testId) && r.status==='completed' && r.completedDate) set.add(r.completedDate); });
    const today = todayStr();
    const days = [...set].filter(d=>d<=today).sort();
    if(!days.length){ delete DB.activity[ex.id]; return; }
    const last = days[days.length-1];
    let count = 0; const c = new Date(last+'T00:00:00');
    while(set.has(toLocalISODate(c))){ count++; c.setDate(c.getDate()-1); }
    DB.activity[ex.id] = {last, count};
  });
}
function compactHistory(){
  const today = todayStr();
  const stat = {rev:0, qrev:0, logs:0, att:0};
  const topicBy = {}; DB.topics.forEach(x=>topicBy[x.id]=x);
  const subBy = {}; DB.subtopics.forEach(x=>subBy[x.id]=x);
  const subjBy = {}; DB.subjects.forEach(x=>subjBy[x.id]=x);
  const testBy = {}; DB.qtests.forEach(x=>testBy[x.id]=x);
  const act = ()=>{};
  streakRecordAll(); /* ભૂંસતા પહેલા સ્ટ્રીક (છેલ્લી તારીખ + કેટલા દિવસ) નોંધી લો */
  const bump = (e, cnt, last, d)=>{ e[cnt] = (e[cnt]||0)+1; if(d && d>(e[last]||'')) e[last] = d; };
  DB.revisions = DB.revisions.filter(r=>{
    if(r.status!=='completed') return true;
    const d = r.completedDate || r.dueDate || '';
    if(d >= today) return true;
    const e = r.subtopicId ? subBy[r.subtopicId] : topicBy[r.topicId];
    if(e){ bump(e,'revCount','lastRev',d); const sj = subjBy[r.subjectId||e.subjectId]; act(sj && sj.examId, d); }
    stat.rev++; return false;
  });
  DB.qrevs = (DB.qrevs||[]).filter(r=>{
    if(r.status!=='completed') return true;
    const d = r.completedDate || r.dueDate || '';
    if(d >= today) return true;
    const t = testBy[r.testId];
    if(t){ bump(t,'revCount','lastRev',d); act(t.examId, d); }
    stat.qrev++; return false;
  });
  DB.studyLogs = DB.studyLogs.filter(l=>{
    if(!l.date || l.date >= today) return true;
    const ents = [];
    (l.topicIds && l.topicIds.length ? l.topicIds : (l.topicId?[l.topicId]:[])).forEach(id=>{ if(topicBy[id]) ents.push(topicBy[id]); });
    (l.subtopicIds||[]).forEach(id=>{ if(subBy[id]) ents.push(subBy[id]); });
    if(!ents.length && subjBy[l.subjectId]) ents.push(subjBy[l.subjectId]);
    ents.forEach(e=>bump(e,'studyCount','lastStudy',l.date));
    const sj = subjBy[l.subjectId]; act(sj && sj.examId, l.date);
    stat.logs++; return false;
  });
  DB.qtests.forEach(t=>{
    const a = t.attempts || [];
    if(a.length<=1 && !a.some(x=>x.answers)) { return; }
    const keepIdx = a.length-1;
    const kept = [];
    a.forEach((x,i)=>{
      if(i===keepIdx || x.date===today){ kept.push(x); }
      else { t.timesBase = (t.timesBase||0)+1; t.bestPct = Math.max(t.bestPct||0, x.pct||0); act(t.examId, x.date); stat.att++; }
    });
    kept.forEach(x=>{ if(x.date<today){ act(t.examId, x.date); } delete x.answers; });
    t.attempts = kept;
  });
  return stat;
}
function compactPreview(){

function activityDates(exam){
  const out = new Set();
  if(!exam) return out;
  const rec = DB.activity && DB.activity[exam.id];
  if(Array.isArray(rec)) rec.forEach(d=>out.add(d));
  else if(rec && rec.last && rec.count>0){ const c = new Date(rec.last+'T00:00:00'); for(let i=0;i<rec.count;i++){ out.add(toLocalISODate(c)); c.setDate(c.getDate()-1); } }
  const activeIds = activeExamSubjectIds();
  DB.studyLogs.forEach(l=>{ if(activeIds.includes(l.subjectId) && l.date) out.add(l.date); });
  DB.revisions.forEach(r=>{ if(activeIds.includes(r.subjectId) && r.status==='completed' && r.completedDate) out.add(r.completedDate); });
  const tIds = new Set();
  DB.qtests.forEach(t=>{ if(t.examId===exam.id){ tIds.add(t.id); (t.attempts||[]).forEach(a=>{ if(a.date) out.add(a.date); }); } });
  (DB.qrevs||[]).forEach(r=>{ if(tIds.has(r.testId) && r.status==='completed' && r.completedDate) out.add(r.completedDate); });
  return out;
}
function calcStudyStreak(exam){
  if(!exam) return {streak:0, todayDone:false};
  const dates = activityDates(exam);
  const today = todayStr();
  const todayDone = dates.has(today);
  let cursor = new Date(today+'T00:00:00');
  if(!todayDone) cursor.setDate(cursor.getDate()-1);
  let streak = 0;
  while(true){
    const ds = toLocalISODate(cursor);
    if(dates.has(ds)){ streak++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  return {streak, todayDone};
}
function studyWeek(exam){
  const out = [];
  if(!exam) return out;
  const dates = activityDates(exam);
  const names = ['રવિ','સોમ','મંગ','બુધ','ગુરુ','શુક્ર','શનિ'];
  const today = todayStr();
  for(let i=6;i>=0;i--){
    const d = new Date(today+'T00:00:00'); d.setDate(d.getDate()-i);
    const ds = toLocalISODate(d);
    out.push({ds, name:names[d.getDay()], done:dates.has(ds), today:ds===today});
  }
  return out;
}

function formatDuration(hoursDecimal){
  if(!hoursDecimal || hoursDecimal<=0) return '0 મિનિટ';
  let totalSeconds = Math.round(hoursDecimal*3600);
  const h = Math.floor(totalSeconds/3600);
  totalSeconds %= 3600;
  const m = Math.floor(totalSeconds/60);
  const s = totalSeconds%60;
  const parts = [];
  if(h>0) parts.push(h+' કલાક');
  if(m>0) parts.push(m+' મિનિટ');
  if(s>0) parts.push(s+' સેકન્ડ');
  return parts.length ? parts.join(' ') : '0 મિનિટ';
}

let _lastUpdateCheck = 0;
async function checkForUpdate(manual){
  if(!navigator.onLine){ if(manual) toast('ઈન્ટરનેટ ચાલુ કરો','error'); return; }
  const now = Date.now();
  if(!manual && now - _lastUpdateCheck < 10*60*1000) return;
  _lastUpdateCheck = now;
  try{
    const r = await fetch('index.html?cb='+now, {cache:'no-store'});
    if(!r.ok) throw new Error('bad');
    const txt = await r.text();
    const m = txt.match(/APP_VERSION\s*=\s*'([^']+)'/);
    if(m && m[1] !== APP_VERSION){
      appBanner('update', `<span>🔄 નવું વર્ઝન તૈયાર છે.</span><button class="btn btn-sm btn-primary" onclick="applyUpdate()">અપડેટ કરો</button><button class="btn btn-sm btn-secondary" onclick="bannerClose('update')">પછી</button>`, '');
    } else if(manual){ toast('તમે નવીનતમ વર્ઝન પર છો ✓'); }
  }catch(e){ if(manual) toast('અપડેટ તપાસી શકાયું નહીં','error'); }
}
async function applyUpdate(){
  try{
    save();
    if('caches' in window){ const keys = await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); }
    if('serviceWorker' in navigator){ const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.update())); }
  }catch(e){}
  location.reload();
}

function heroRingColor(pct){
  if(pct>60) return getVar('--success');

function ringSVG(pct, ids, label){
  label = label || 'પૂર્ણ';
  const r=54, c=2*Math.PI*r;
  const offset = c - (pct/100)*c;
  const color = heroRingColor(pct);
  return `<svg width="130" height="130" viewBox="0 0 130 130" class="ring-svg">
    <circle cx="65" cy="65" r="${r}" stroke="rgba(255,255,255,0.2)" stroke-width="10" fill="none"/>
    <circle class="ring-progress-hero hr-circle" cx="65" cy="65" r="${r}" stroke="${color}" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-offset="${offset}" data-target="${pct}" transform="rotate(-90 65 65)"/>
    <text class="hr-text" data-target="${pct}" x="65" y="60" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">0%</text>
    <text x="65" y="80" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">${label}</text>
  </svg>`;
}

/* ===================== CHARTS (canvas, no external libs) ===================== */
function roundRectPath(ctx,x,y,w,h,r){
  if(h<1) h=1;
  if(r>h/2) r=h/2;
  if(r>w/2) r=w/2;
  ctx.beginPath();
  ctx.moveTo(x,y+r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.closePath();
}
function drawBarChart(id, labels, values, color, valueFormatter){
  const canvas=document.getElementById(id);
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 300;
  const h = 150;
  canvas.style.height = h+'px';
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const max = Math.max(1, ...values);
  const padBottom=20, padTop=18;
  const gap = w/values.length;
  const barW = Math.min(34, gap*0.55);
  const dimColor = getVar('--ink-dim') || '#888';
  const inkColor = getVar('--ink') || '#222';
  values.forEach((v,i)=>{
    const barH = (h-padBottom-padTop) * (v/max);
    const x = gap*i + (gap-barW)/2;
    const y = h-padBottom-barH;
    ctx.fillStyle = color;
    roundRectPath(ctx, x, y, barW, barH, 5);
    ctx.fill();
    ctx.font = '9.5px sans-serif';
    ctx.fillStyle = inkColor;
    ctx.textAlign = 'center';
    const label = valueFormatter ? valueFormatter(v) : (v>0?String(v):'');
    if(label) ctx.fillText(label, x+barW/2, Math.max(y-5,10));
    ctx.font = '10.5px sans-serif';
    ctx.fillStyle = dimColor;
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x+barW/2, h-6);
  });
}

function showTab(id){
  if(id==='exams' && currentTab!==id){ lastMainTab = currentTab; }
  currentTab = id;

function renderMain(){
  const map = {dashboard:renderDashboard, exams:renderExams, mock:renderMock, map:renderGujMap, calendar:renderCalendar, settings:renderSettings};
  const mainEl = document.getElementById('main');
  const _oldTr = [...mainEl.querySelectorAll('.hs-sticky')].map(e=>e._tr||0);
  mainEl.innerHTML = map[currentTab]();
  /* બીજા પેજ/સ્ક્રીન પર જતાં સ્ક્રોલ ઉપરથી શરૂ થાય; એ જ સ્ક્રીનમાં ફરી દોરતાં જગ્યા જળવાય */
  const viewKey = [currentTab, topicDetailId, sectionDetailId, subjFolderId, mqFolderId, mqSession?(mqSession.mode+(mqSession.finished?'F':'')):'', mqSession?1:0, mqSession?(mqSession.start+'/'+(mqSession.pos||0)):''].join('|');
  /* એ જ પેજમાં ફરી દોરતાં (ટેબ બદલતાં) સરકી ગયેલું હેડર પાછું નીચે ન આવે */
  if(viewKey === window.__lastViewKey && _oldTr.some(v=>v<0)){ mainEl.querySelectorAll('.hs-sticky').forEach((el,i)=>{ const tr=Math.max(_oldTr[i]||0, -(el.offsetHeight+8)); if(tr<0){ el._tr=tr; el.style.transform=`translateY(${tr}px)`; el.style.pointerEvents = tr < -(el.offsetHeight+8)*0.5 ? 'none':''; } }); }
  if(viewKey !== window.__lastViewKey){
    window.__lastViewKey = viewKey;
    /* પહેલાં જે પેજ પર જ્યાં અટક્યા હતા, પાછા આવતાં ત્યાં જ ખૂલે (ટેસ્ટ ચાલુ હોય ત્યારે નહીં) */
    const mem = window.__scrollMem || {};
    mainEl.scrollTop = mem[viewKey] ? mem[viewKey] : 0;
    window.__lastScrollSet = mem[viewKey] ? mem[viewKey] : 0;
    if(window.__hdrShow) window.__hdrShow();
  }
  afterRender(currentTab); ringInitAll();
  /* સામગ્રી (બુક/કાર્ડ) પછીથી ગોઠવાય તો પણ યાદ રાખેલી સ્થિતિએ જ પહોંચે */
  const want = window.__lastScrollSet || 0;
  if(want > 0){ [60,200,450].forEach(ms=>setTimeout(()=>{ const m=document.getElementById('main'); if(m && window.__lastViewKey===viewKey && m.scrollTop < want-1 && m.scrollHeight-m.clientHeight >= want){ m.scrollTop = want; } }, ms)); }
  const _m=document.getElementById('main'); if(_m.scrollTop<=20 && window.__hdrShow) window.__hdrShow();
}

function renderDashboard(){
  const exam = getActiveExam();
  if(!exam){
    return emptyState('🎓','હજુ કોઈ પરીક્ષા ઉમેરી નથી','શરૂઆત કરવા માટે એક પરીક્ષા ઉમેરો — જેમ કે GPSC, Talati, Police, GSSSB વગેરે.','પરીક્ષા ઉમેરો',"showTab('exams'); setTimeout(()=>openExamForm(null),50);");
  }
  const subs = examSubjects(exam.id);
  const subIds = subs.map(s=>s.id);
  const topics = DB.topics.filter(t=>subIds.includes(t.subjectId));
  const completed = topics.filter(t=>t.status==='completed').length;
  const total = topics.length;
  const sections = examSections(exam.id);
  let weightedTotal=0, weightedCompleted=0;
  const priorityList = [];
  const sectionedSubjectIds = new Set();
  sections.forEach(sec=>{
    const secSubs = subs.filter(s=>s.sectionId===sec.id);
    secSubs.forEach(s=>sectionedSubjectIds.add(s.id));
    const secTopics = topics.filter(t=>secSubs.some(s=>s.id===t.subjectId));
    const secTotal = secTopics.length;
    if(!secTotal) return;
    const secCompleted = secTopics.filter(t=>t.status==='completed').length;
    const hasMarks = sec.totalMarks && sec.totalMarks>0;
    const unitWeight = hasMarks ? (sec.totalMarks/secTotal) : 1;
    weightedTotal += secTotal*unitWeight;
    weightedCompleted += secCompleted*unitWeight;
    if(hasMarks && secCompleted<secTotal){
      priorityList.push({section:sec, remaining:secTotal-secCompleted, priorityScore:sec.totalMarks*(1-secCompleted/secTotal)});
    }
  });
  const unsectionedTopics = topics.filter(t=>{
    const s = subs.find(x=>x.id===t.subjectId);
    return s && !sectionedSubjectIds.has(s.id);
  });
  weightedTotal += unsectionedTopics.length;
  weightedCompleted += unsectionedTopics.filter(t=>t.status==='completed').length;
  priorityList.sort((a,b)=>b.priorityScore-a.priorityScore);
  const pct = weightedTotal ? Math.round(weightedCompleted/weightedTotal*100) : 0;
  const daysLeft = examDaysLeft(exam.date);
  const streakInfo = calcStudyStreak(exam);
  const today = todayStr();
  const topicsDoneTodaySet = new Set();
  studyLogsForActiveExam().filter(l=>l.date===today).forEach(l=>{
    if(l.topicIds && l.topicIds.length){ l.topicIds.forEach(id=>topicsDoneTodaySet.add(id)); }
    else if(l.topicId){ topicsDoneTodaySet.add(l.topicId); }
  });
  const topicsDoneTodayCount = topicsDoneTodaySet.size;
  const revisionsDueToday = revisionsForActiveExam().filter(r=>r.dueDate===today);
  const revisionsDoneTodayCount = revisionsDueToday.filter(r=>r.status==='completed').length;
  const overdueRevisions = revisionsForActiveExam().filter(r=>r.status==='pending' && r.dueDate<today).length;
  const overdueRevisionList = revisionsForActiveExam().filter(r=>r.status==='pending' && r.dueDate<today).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const todayRevisionList = revisionsForActiveExam().filter(r=>r.status==='pending' && r.dueDate===today);
  const todayStudyList = studyLogsForActiveExam().filter(l=>l.date===today);
  const inProgressTopics = topics.filter(t=>t.status==='studying');

  const allRevs = revisionsForActiveExam();
  const revBaseAll = revBase(activeExamSubjectIds());
  const revTotal = allRevs.length + revBaseAll;
  const revDone = allRevs.filter(r=>r.status==='completed').length + revBaseAll;
  const revPct = revTotal ? Math.round(revDone/revTotal*100) : 0;
  const revPending = revTotal-revDone;
  const revUpcoming = allRevs.filter(r=>r.status==='pending' && r.dueDate>=today).length;

  const heroCard0 = `<div class="hero-card">
     <div class="hero-top">
       <div>
         <div class="hero-exam-name">${esc(exam.name)}</div>
         <div class="hero-exam-date">📅 ${formatDate(exam.date)}</div>
       </div>
       <span style="display:flex; gap:6px; align-items:center;">
         <button class="btn btn-sm" onclick="showTab('exams');">વિગત</button>
         <button class="btn btn-sm" onclick="openExamForm('${exam.id}')">✎</button>
       </span>
     </div>
     <div class="hero-ring-row">
       ${ringSVG(pct)}
       <div class="hero-ring-stats">
         <div class="ring-stat"><span>દિવસ બાકી</span><b class="${daysLeft>=0?'hero-count':''}" data-target="${daysLeft}" style="color:${daysLeft>=0?daysLeftColor(daysLeft):'#fff'};">${daysLeft>=0?0:'પૂર્ણ'}</b></div>
         <div class="ring-stat"><span>ટોપિક પૂર્ણ</span><b><span class="hero-count" data-target="${completed}">0</span>/${total}</b></div>
         <div class="ring-stat"><span>વિષયો</span><b class="hero-count" data-target="${subs.length}">0</b></div>
       </div>
     </div>
   </div>`;
  const heroCard1 = `<div class="hero-card hero-rev">
     <div class="hero-top">
       <div>
         <div class="hero-exam-name">🔁 રિવિઝન</div>
         <div class="hero-exam-date">${esc(exam.name)} · 📅 ${formatDate(exam.date)}</div>
       </div>
       <button class="btn btn-sm" onclick="showTab('calendar');">કેલેન્ડર</button>

     ${statCard('📖', topicsDoneTodayCount, 'આજે અભ્યાસ ટોપિક', "calSelectedDate=todayStr(); calMode='study'; calKind='topic'; showTab('calendar');", '')}
     ${statCard('🔁', `${revisionsDoneTodayCount}/${revisionsDueToday.length}`, 'આજની રિવિઝન', "calSelectedDate=todayStr(); calKind='topic'; showTab('calendar'); calMode='revision'; renderMain();", '')}
     ${statCard('⏰', overdueRevisions, 'ઓવરડ્યુ રિવિઝન')}

   }, `${priorityList.length ? card('વેઈટેજ પ્રમાણે અગ્રતા 🎯', priorityList.slice(0,5).map(p=>`<div class="item" onclick="navigateToSection('${p.section.id}')"><span>📂 ${esc(p.section.name)} <span class="ink-dim">(${p.section.totalMarks} ગુણ)</span></span><span class="badge badge-warning">${p.remaining} બાકી</span></div>`).join('')) : ''}`)}

  const l = id ? DB.studyLogs.find(x=>x.id===id) : null;

  if(!subs.length){ toast('પહેલા આ પરીક્ષામાં વિષય ઉમેરો','error'); return; }
  const sections = examSections(exam.id);
  const hasUngrouped = subs.some(s=>!s.sectionId);
  const prefillSubjectId = l ? l.subjectId : (prefill ? prefill.subjectId : null);
  const currentSubject = prefillSubjectId ? subs.find(s=>s.id===prefillSubjectId) : null;
  const currentSectionId = currentSubject ? (currentSubject.sectionId || '') : '';
  openSheet(`

    <div class="field"><label>તારીખ</label><input type="date" id="f_date" value="${l?l.date:(defDate||todayStr())}"></div>
    ${sections.length ? `<div class="field"><label>વિભાગ</label><select id="f_section" onchange="populateStudySubjectOptions()">
      ${sections.map(sec=>`<option value="${sec.id}" ${currentSectionId===sec.id?'selected':''}>📂 ${esc(sec.name)}</option>`).join('')}
      ${hasUngrouped?`<option value="" ${currentSectionId===''?'selected':''}>કોઈ વિભાગ નહીં</option>`:''}
    </select></div>` : ''}

const SORT_OPTIONS = {
  sections: [['default','ક્રમ પ્રમાણે'],['name','નામ પ્રમાણે'],['pct_desc','% પૂર્ણ ↓'],['pct_asc','% પૂર્ણ ↑']],
  subjects: [['default','ક્રમ પ્રમાણે'],['name','નામ પ્રમાણે'],['topics_desc','% ટોપિક ↓'],['topics_asc','% ટોપિક ↑'],['revision_desc','% રિવિઝન ↓'],['revision_asc','% રિવિઝન ↑']],
  topics: [['default','ક્રમ પ્રમાણે'],['name','નામ પ્રમાણે'],['status_done_first','પૂર્ણ પહેલા'],['status_pending_first','બાકી પહેલા']]
};
function getSortPref(level, key){
  const sp = DB.settings.sortPrefs;
  if(!sp) return 'default';
  if(level==='sections') return sp.sections || 'default';
  if(level==='subjects') return (sp.subjects && typeof sp.subjects==='object' && sp.subjects[key||'none']) || 'default';
  if(level==='topics') return (sp.topics && typeof sp.topics==='object' && sp.topics[key]) || 'default';
  return 'default';
}
function filterSortToolbarHTML(level, searchInputId, filterFnName, key){
  const current = getSortPref(level, key);
  const opts = SORT_OPTIONS[level];
  return `<div class="flex-gap-6 mb-6">
    <input type="text" id="${searchInputId}" placeholder="🔍 શોધો..." oninput="${filterFnName}()" style="flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--ink); font-size:13.5px;">
    <select onchange="setSortPref('${level}', this.value, ${key?`'${key}'`:'null'})" style="flex-shrink:0; max-width:135px; padding:8px 6px; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--ink); font-size:13px; font-family:inherit;">
      ${opts.map(([v,l])=>`<option value="${v}" ${current===v?'selected':''}>${l}</option>`).join('')}
    </select>
  </div>`;
}
function setSortPref(level, value, key){
  if(!DB.settings.sortPrefs) DB.settings.sortPrefs = {sections:'default', subjects:{}, topics:{}};
  const sp = DB.settings.sortPrefs;
  if(level==='sections'){ sp.sections = value; }
  else if(level==='subjects'){ if(!sp.subjects || typeof sp.subjects!=='object') sp.subjects = {}; sp.subjects[key||'none'] = value; }
  else if(level==='topics'){ if(!sp.topics || typeof sp.topics!=='object') sp.topics = {}; sp.topics[key] = value; }
  save(); renderMain();
}
function sortSectionsList(sections){
  const mode = getSortPref('sections');
  if(mode==='default') return sections;
  if(mode==='name') return [...sections].sort((a,b)=>a.name.localeCompare(b.name,'gu',{numeric:true}));
  const withPct = sections.map(sec=>{
    const subs = sectionSubjects(sec.id);
    let total=0, done=0;
    subs.forEach(s=>{ const topics=subjectTopics(s.id); total+=topics.length; done+=topics.filter(t=>t.status==='completed').length; });
    return {sec, pct: total?done/total*100:0};
  });
  if(mode==='pct_desc') return withPct.sort((a,b)=>b.pct-a.pct).map(x=>x.sec);
  if(mode==='pct_asc') return withPct.sort((a,b)=>a.pct-b.pct).map(x=>x.sec);
  return sections;
}
function sortSubjectsList(subs, sectionKey){
  const mode = getSortPref('subjects', sectionKey);
  if(mode==='default') return subs;
  if(mode==='name') return [...subs].sort((a,b)=>a.name.localeCompare(b.name,'gu',{numeric:true}));
  const withStats = subs.map(s=>{
    const topics = subjectTopics(s.id);
    const topicsPct = topics.length ? topics.filter(t=>t.status==='completed').length/topics.length*100 : 0;
    const revs = DB.revisions.filter(r=>r.subjectId===s.id);
    const rb = revBase([s.id]); const revPct = (revs.length+rb) ? (revs.filter(r=>r.status==='completed').length+rb)/(revs.length+rb)*100 : 0;
    return {s, topicsPct, revPct};
  });
  if(mode==='topics_desc') return withStats.sort((a,b)=>b.topicsPct-a.topicsPct).map(x=>x.s);
  if(mode==='topics_asc') return withStats.sort((a,b)=>a.topicsPct-b.topicsPct).map(x=>x.s);
  if(mode==='revision_desc') return withStats.sort((a,b)=>b.revPct-a.revPct).map(x=>x.s);
  if(mode==='revision_asc') return withStats.sort((a,b)=>a.revPct-b.revPct).map(x=>x.s);
  return subs;
}
function sortTopicsList(topics, subjectKey){
  const mode = getSortPref('topics', subjectKey);
  if(mode==='default') return topics;
  if(mode==='name') return [...topics].sort((a,b)=>a.name.localeCompare(b.name,'gu',{numeric:true}));
  const rank = {completed:0, studying:1, not_started:2};
  const rankRev = {completed:2, studying:1, not_started:0};
  if(mode==='status_done_first') return [...topics].sort((a,b)=>rank[a.status]-rank[b.status]);
  if(mode==='status_pending_first') return [...topics].sort((a,b)=>rankRev[a.status]-rankRev[b.status]);
  return topics;
}

function sfPath(id){ const out=[]; let f=sfAll().find(x=>x.id===id), g=0; while(f && g++<30){ out.unshift(f); f=sfAll().find(x=>x.id===f.parentId); } return out; }
function sfDescIds(id){ let ids=[id]; sfAll().filter(f=>f.parentId===id).forEach(f=>{ ids=ids.concat(sfDescIds(f.id)); }); return ids; }

function sfFolderOptions(sectionId, selId, excludeId){
  const ban = excludeId ? new Set(sfDescIds(excludeId)) : new Set();
  const out = [`<option value="">📂 (મુખ્ય — ફોલ્ડર વગર)</option>`];
  const walk = (pid, depth)=>{ sfChildren(sectionId, pid).forEach(f=>{ if(ban.has(f.id)) return;
    out.push(`<option value="${f.id}" ${selId===f.id?'selected':''}>${'  '.repeat(depth)}📁 ${esc(f.name)}</option>`); walk(f.id, depth+1); }); };
  walk(null,0);
  return out.join('');
}

function setTopicStatus(id, next){
  const t = DB.topics.find(x=>x.id===id);
  if(!t) return;
  if(t.status===next){ closeSheet(); return; }
  const subs = subtopicsForTopic(id);
  const hasSubtopics = subs.length>0;
  const labels = {not_started:'શરૂ નથી 🔴', studying:'ચાલુ 🟡', completed:'પૂર્ણ 🟢'};
  if(hasSubtopics && next==='completed'){
    const pending = subs.filter(s=>!s.completed);
    if(pending.length){
      alert(`⚠️ આ ચેપ્ટર હજુ પૂર્ણ ન કરી શકાય — ${pending.length} સબ-ટોપિક બાકી છે:\n\n${pending.map(s=>'• '+s.name).join('\n')}\n\nપહેલા બધા સબ-ટોપિક પૂર્ણ કરો, પછી જ ચેપ્ટર પૂર્ણ થશે.`);
      return;
    }
  }
  if(!hasSubtopics && next==='completed'){
    closeSheet();
    openRevisionCalendarSheet('topic', id);
    return;
  }
  let msg = `સ્ટેટસ "${labels[t.status]}" માંથી "${labels[next]}" કરવું છે?`;
  if(hasSubtopics){
    if(next==='completed') msg += '\n\nℹ️ બધા સબ-ટોપિક પૂર્ણ છે. રિવિઝન દરેક સબ-ટોપિક પ્રમાણે પહેલેથી જ જનરેટ થયેલું છે.';
  } else {
    if(t.status==='completed' && next==='not_started'){
      msg += '\n\n⚠️ ધ્યાન રાખો: આ ટોપિકનું બધું રિવિઝન (પૂર્ણ થયેલું પણ) કેન્સલ થઈ જશે.';
    }
  }
  if(!confirm(msg)) return;
  closeSheet();
  t.status = next;
  if(next==='completed'){
    t.completedDate = todayStr();
    toast('ટોપિક પૂર્ણ!');
  } else {
    if(!hasSubtopics) DB.revisions = DB.revisions.filter(r=>r.topicId!==t.id);
    toast('સ્ટેટસ બદલાયું');
  }
  save(); renderMain();
}

function renderRevisionPickerCalendar(){
  const firstDay = new Date(revisionPickerYear, revisionPickerMonth, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(revisionPickerYear, revisionPickerMonth+1, 0).getDate();
  const monthName = firstDay.toLocaleDateString('gu-IN', {month:'long', year:'numeric'});
  const now = new Date();
  const isCurrentMonth = (revisionPickerMonth===now.getMonth() && revisionPickerYear===now.getFullYear());
  const exam = getActiveExam();
  const examDate = (exam && exam.date) ? exam.date : null;
  const subjectId = revisionPickerSubjectId();
  const ownIds = revisionPickerOwnRevisionIds();
  const pendingRevs = DB.revisions.filter(r=>r.status==='pending' && !ownIds.has(r.id)).concat((DB.qrevs||[]).filter(r=>r.status==='pending' && !ownIds.has(r.id)));
  let atOrBeyondExamMonth = false;
  if(examDate){
    const [examYear, examMonthRaw] = examDate.split('-').map(Number);
    const examMonth = examMonthRaw-1;
    atOrBeyondExamMonth = (revisionPickerYear>examYear) || (revisionPickerYear===examYear && revisionPickerMonth>=examMonth);
  }
  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${revisionPickerYear}-${String(revisionPickerMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isPast = ds < todayStr();
    const isAfterExam = examDate ? (ds > examDate) : false;
    const isCompleted = revisionPickerCompletedDates.has(ds);
    const isDisabled = (isPast || isAfterExam) && !isCompleted;
    const isToday = ds === todayStr();
    const isSelected = revisionPickerDates.has(ds);
    const cls = ['cal-cell'];
    if(isToday) cls.push('today');
    if(isCompleted) cls.push('locked');
    else if(isSelected) cls.push('selected');
    if(isDisabled) cls.push('past-disabled');
    const clickable = !isDisabled && !isCompleted;
    const dayRevs = pendingRevs.filter(r=>r.dueDate===ds);
    const totalCount = dayRevs.length;
    const subjCount = subjectId ? dayRevs.filter(r=>r.subjectId===subjectId).length : 0;
    const countHTML = totalCount>0 ? `<span class="cal-rev-count${totalCount>8?' high':''}">${subjCount}·${totalCount}</span>` : '';
    cells += `<div class="${cls.join(' ')}" ${clickable?`onclick="toggleRevisionPickerDate('${ds}')"`:''}><span>${d}</span>${countHTML}</div>`;
  }
  return `
   <div class="ink-dim fs-12 mb-6">તારીખ નીચે: [આ સબ્જેક્ટના] · [કુલ] બાકી રિવિઝન</div>
   <div class="cal-header">
     <button class="btn btn-sm btn-secondary" ${isCurrentMonth?'disabled':''} onclick="revisionPickerMonth--; if(revisionPickerMonth<0){revisionPickerMonth=11;revisionPickerYear--;} refreshRevisionPickerCalendar();">‹</button>
     <b>${monthName}</b>
     <button class="btn btn-sm btn-secondary" ${atOrBeyondExamMonth?'disabled':''} onclick="revisionPickerMonth++; if(revisionPickerMonth>11){revisionPickerMonth=0;revisionPickerYear++;} refreshRevisionPickerCalendar();">›</button>
   </div>
   <div class="cal-weekdays"><div>ર</div><div>સો</div><div>મં</div><div>બુ</div><div>ગુ</div><div>શુ</div><div>શ</div></div>
   <div class="cal-grid">${cells}</div>
  `;
}
function refreshRevisionPickerCalendar(){
  const el = document.getElementById('revisionPickerCal');
  if(el) el.innerHTML = renderRevisionPickerCalendar();

function updateRevisionPickerCount(){
  const el = document.getElementById('revisionPickerCount');

function toggleRevisionPickerDate(ds){
  if(revisionPickerCompletedDates.has(ds)) return;
  if(revisionPickerDates.has(ds)) revisionPickerDates.delete(ds);
  else revisionPickerDates.add(ds);
  refreshRevisionPickerCalendar();
  updateRevisionPickerCount();
}
function generateRevisionsFromDates(topicId, subjectId, subtopicId, dates){
  if(subtopicId) DB.revisions = DB.revisions.filter(r=>r.subtopicId!==subtopicId);
  else DB.revisions = DB.revisions.filter(r=>r.topicId!==topicId);
  dates.forEach((due,idx)=>{
    const entry = {id:uid(), topicId, subjectId, dueDate: due, status:'pending', stage: idx+1};
    if(subtopicId) entry.subtopicId = subtopicId;
    DB.revisions.push(entry);
  });
}
function addAutoStudyLog(subjectId, topicId, subtopicId){
  DB.studyLogs.push({
    id: uid(),
    date: todayStr(),
    subjectId,
    chapters: '',
    notes: '',
    topicId: topicId || '',
    topicIds: topicId ? [topicId] : [],
    subtopicIds: subtopicId ? [subtopicId] : []
  });
}
function confirmRevisionPicker(){
  if(!revisionPickerEntity) return;
  const {entityType, id, mode} = revisionPickerEntity;
  const dates = Array.from(revisionPickerDates).sort();
  if(entityType==='qtest') return confirmQTestRevisionPicker(id, dates);
  if(mode==='manage'){
    let topicId, subjectId, subtopicId=null;
    if(entityType==='topic'){
      const t = DB.topics.find(x=>x.id===id);
      if(!t) return;
      topicId=t.id; subjectId=t.subjectId;
    } else {
      const st = DB.subtopics.find(x=>x.id===id);
      if(!st) return;
      topicId=st.topicId; subjectId=st.subjectId; subtopicId=st.id;
    }
    const existing = subtopicId ? DB.revisions.filter(r=>r.subtopicId===subtopicId) : DB.revisions.filter(r=>r.topicId===topicId && !r.subtopicId);
    const existingPending = existing.filter(r=>r.status==='pending');
    const keepDates = new Set(dates);
    const toRemoveIds = existingPending.filter(r=>!keepDates.has(r.dueDate)).map(r=>r.id);
    DB.revisions = DB.revisions.filter(r=>!toRemoveIds.includes(r.id));
    const stillExistingDates = new Set(DB.revisions.filter(r=> subtopicId ? r.subtopicId===subtopicId : (r.topicId===topicId && !r.subtopicId)).map(r=>r.dueDate));
    let maxStage = existing.reduce((m,r)=>Math.max(m, r.stage||0), 0);
    dates.forEach(due=>{
      if(stillExistingDates.has(due)) return;
      maxStage++;
      const entry = {id:uid(), topicId, subjectId, dueDate:due, status:'pending', stage:maxStage};
      if(subtopicId) entry.subtopicId = subtopicId;
      DB.revisions.push(entry);
      stillExistingDates.add(due);
    });
    save(); closeSheet();
    openTopicRevisionForm(topicId);
    toast('રિવિઝન તારીખો અપડેટ થઈ 🔁');
    return;
  }
  /* રિવિઝન તારીખ વગર પણ પૂર્ણ કરી શકાય */
  if(entityType==='topic'){
    const t = DB.topics.find(x=>x.id===id);
    if(!t) return;
    t.status = 'completed';
    t.completedDate = todayStr();
    generateRevisionsFromDates(t.id, t.subjectId, null, dates);
    addAutoStudyLog(t.subjectId, t.id, null);
    save(); closeSheet(); renderMain();
    const nextLabel = nextRevisionLabel(t.id, null);
    toast(!dates.length ? 'ટોપિક પૂર્ણ! ✓ (રિવિઝન વગર)' : nextLabel ? `ટોપિક પૂર્ણ! ${dates.length} રિવિઝન તારીખ સેટ કરી 🔁 · આગામી: ${nextLabel}` : `ટોપિક પૂર્ણ! ${dates.length} રિવિઝન તારીખ સેટ કરી 🔁`);
  } else {
    const st = DB.subtopics.find(x=>x.id===id);
    if(!st) return;
    st.completed = true;
    st.completedDate = todayStr();
    generateRevisionsFromDates(st.topicId, st.subjectId, st.id, dates);
    addAutoStudyLog(st.subjectId, st.topicId, st.id);
    save(); renderMain();
    openTopicRevisionForm(st.topicId);
    const nextLabel = nextRevisionLabel(st.topicId, st.id);
    toast(!dates.length ? 'સબ-ટોપિક પૂર્ણ! ✓ (રિવિઝન વગર)' : nextLabel ? `સબ-ટોપિક પૂર્ણ! ${dates.length} રિવિઝન તારીખ સેટ કરી 🔁 · આગામી: ${nextLabel}` : `સબ-ટોપિક પૂર્ણ! ${dates.length} રિવિઝન તારીખ સેટ કરી 🔁`);
  }
}

function revisionStageLabel(stage){
  return `રિવિઝન #${stage}`;
}
function nextRevisionLabel(topicId, subtopicId, excludeId){
  const list = DB.revisions.filter(r=>{
    if(r.status!=='pending') return false;
    if(excludeId && r.id===excludeId) return false;
    return subtopicId ? r.subtopicId===subtopicId : (r.topicId===topicId && !r.subtopicId);
  });
  if(!list.length) return '';
  const next = [...list].sort((a,b)=>a.dueDate.localeCompare(b.dueDate))[0];
  return `${revisionStageLabel(next.stage)} — ${formatDate(next.dueDate)}`;
}

function revisionRow(r, compact){
  const isOverdue = r.status==='pending' && r.dueDate<todayStr();
  const highlight = (highlightRevisionId===r.id) ? ' row-highlight' : '';
  let label = revisionEntityLabel(r);
  if(compact){
    const st = r.subtopicId ? DB.subtopics.find(x=>x.id===r.subtopicId) : null;
    label = st ? st.name : 'સંપૂર્ણ ચેપ્ટર';
  }
  return `<div class="item${highlight} cursor-default" id="revision-${r.id}">
    <span>${esc(label)}</span>
    <span style="display:flex;align-items:center;gap:6px;">
      <span class="badge ${r.status==='completed'?'badge-success':(isOverdue?'badge-danger':'badge-warning')}" onclick="toggleRevisionStatus('${r.id}')">${r.status==='completed'?'પૂર્ણ ✓':(isOverdue?'બાકી ⚠️':'બાકી')}</span>
      <button class="btn btn-sm btn-danger" onclick="deleteRevision('${r.id}')">🗑️</button>
    </span>
  </div>`;
}
function toggleRevisionStatus(id){
  const r = DB.revisions.find(x=>x.id===id);
  if(!r) return;
  if(r.status==='completed'){
    if(!confirm('આ રિવિઝન "પૂર્ણ" માંથી "બાકી" કરવું છે?')) return;
    r.status='pending'; delete r.completedDate;
    save(); renderMain(); toast('રિવિઝન બાકી તરીકે માર્ક થયું');
  } else {
    if(!confirm('આ રિવિઝન પૂર્ણ કરવું છે?')) return;
    r.status='completed'; r.completedDate=todayStr();
    save(); renderMain();
    const doneLabel = `✓ ${revisionStageLabel(r.stage)} રિવિઝન પૂર્ણ — ${formatDate(r.dueDate)}`;
    const nextLabel = nextRevisionLabel(r.topicId, r.subtopicId);
    toast(nextLabel ? `${doneLabel} · આગામી: ${nextLabel}` : doneLabel);
  }
}

  if(!confirm('આ રિવિઝન ડિલીટ કરવું છે?'))return;

function renderCalendar(){
  const firstDay = new Date(calYear, calMonth, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const monthName = firstDay.toLocaleDateString('gu-IN', {month:'long', year:'numeric'});
  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  const calSelDate = calSelectedDate || todayStr();
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dots = dotsForDate(dateStr);
    const isToday = dateStr===todayStr();
    const isSelected = dateStr===calSelDate && !isToday;
    cells += `<div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" onclick="calSelectedDate='${dateStr}'; renderMain();">
      <span>${d}</span>
      <div class="cal-nums-row">
        ${dots.studyCount>0?`<span class="cal-num-blue">${dots.studyCount}</span>`:''}
        ${dots.studyCount>0 && dots.pendingCount>0?'<span class="cal-num-sep">·</span>':''}
        ${dots.pendingCount>0?`<span class="${dots.isOverdue?'cal-num-red':'cal-num-yellow'}">${dots.pendingCount}</span>`:''}
      </div>
    </div>`;
  }
  const sel = calSelectedDate || todayStr();
  const dateRow = `<div class="cal-date-row" onclick="calGridExpanded=!calGridExpanded; renderMain();">
     <span>📅 ${formatDate(sel)}</span>
     <span class="ink-dim">${calGridExpanded?'▲':'▼'}</span>
   </div>`;
  const grid = `<div class="cal-header">
     <button class="btn btn-sm btn-secondary" onclick="event.stopPropagation(); calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderMain();">‹</button>
     <b>${monthName}</b>
     <button class="btn btn-sm btn-secondary" onclick="event.stopPropagation(); calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderMain();">›</button>
   </div>
   <div class="cal-weekdays"><div>ર</div><div>સો</div><div>મં</div><div>બુ</div><div>ગુ</div><div>શુ</div><div>શ</div></div>
   <div class="cal-grid">${cells}</div>`;
  const head = `<div class="section-header" style="margin-top:0;"><h3>${formatDate(sel)}</h3></div>
     <div style="display:flex; gap:8px; margin-bottom:4px;">
       <button class="btn btn-sm ${calMode==='study'?'btn-primary':'btn-secondary'} flex-1" onclick="calMode='study'; renderMain();">અભ્યાસ 📖</button>
       <button class="btn btn-sm ${calMode==='revision'?'btn-primary':'btn-secondary'} flex-1" onclick="calMode='revision'; renderMain();">રિવિઝન 🔁</button>
     </div>
     <div class="seg" style="margin:8px 0 0;">
       <button class="${calKind==='topic'?'on':''}" onclick="calKind='topic'; renderMain();">📚 ટોપિક${calKindCount(sel,'topic')}</button>
       <button class="${calKind==='mcq'?'on':''}" onclick="calKind='mcq'; renderMain();">MCQ ટેસ્ટ${calKindCount(sel,'mcq')}</button>
     </div>`;
  if(calGridExpanded){

  }

function dotsForDate(dateStr){
  const studyCount = studyLogsForActiveExam().filter(l=>l.date===dateStr).length + mqAttemptsOn(dateStr).length;
  const dueRevisions = revisionsForActiveExam().filter(r=>r.dueDate===dateStr);
  const qDue = qrevsForActiveExam().filter(r=>r.dueDate===dateStr && r.status==='pending').length;
  const pendingCount = dueRevisions.filter(r=>r.status==='pending').length + qDue;
  const today = todayStr();
  const isOverdue = dateStr<today && pendingCount>0;
  return {studyCount, pendingCount, isOverdue};
}
function groupSubjectIdsBySection(subjectIds){
  const exam = getActiveExam();
  const sections = exam ? examSections(exam.id) : [];
  const bySection = {};
  const ungrouped = [];
  subjectIds.forEach(sid=>{
    const subj = DB.subjects.find(x=>x.id===sid);
    const secId = subj && subj.sectionId ? subj.sectionId : null;
    if(secId){ (bySection[secId] = bySection[secId]||[]).push(sid); }
    else ungrouped.push(sid);
  });
  const groups = [];
  sections.forEach(sec=>{
    if(bySection[sec.id] && bySection[sec.id].length) groups.push({sec, subjectIds: bySection[sec.id]});
  });
  if(ungrouped.length) groups.push({sec:null, subjectIds: ungrouped});
  return groups;
}
function renderSectionGroups(groups, subjectCardHTML, sectionBadgeHTML){
  return groups.map(g=>{
    const cards = g.subjectIds.map(sid=>subjectCardHTML(sid)).join('');
    if(!g.sec) return cards;
    const wrapId = 'secacc_'+g.sec.id+'_'+calMode;
    const shouldExpand = isAccordionOpen(wrapId);
    const headerHTML = `<span class="ink-dim fw-700 fs-125">📂 ${esc(g.sec.name)}</span>`;
    const badgeHTML = sectionBadgeHTML ? sectionBadgeHTML(g.subjectIds) : `<span class="badge badge-primary">${g.subjectIds.length}</span>`;
    return `<div class="mt-14">${renderAccordionBlock(wrapId, headerHTML, badgeHTML, cards, shouldExpand, {headerStyle:'border:none; padding:4px 2px;', bodyStyle:'padding-left:0;'})}</div>`;
  }).join('');
}
function calKindCount(dateStr, kind){
  let n = 0;
  if(kind==='mcq'){
    n = calMode==='study' ? mqAttemptsOn(dateStr).length : qrevsForActiveExam().filter(r=>r.dueDate===dateStr).length;
  } else if(calMode==='study'){
    n = DB.studyLogs.filter(l=>l.date===dateStr && activeExamSubjectIds().includes(l.subjectId)).length;
  } else {
    n = revisionsForActiveExam().filter(r=>r.dueDate===dateStr).length;
  }

}
function calendarDayDetailHTML(dateStr){
  if(calKind==='mcq'){
    if(calMode==='study'){
      const items = mqAttemptsOn(dateStr).map(({t,a})=>({t, extra:` <span class="ink-dim fs-12">· ${a.mode==='practice'?'પ્રેક્ટિસ':'ટેસ્ટ'}${a.set&&a.set!=='A'?' · સેટ '+a.set:''}</span>`, right:`<span class="badge ${a.pct>=70?'badge-success':(a.pct>=40?'badge-warning':'badge-danger')}">${a.correct}/${a.total} · ${a.pct}%</span>`}));
      return items.length ? mqFolderGroupedHTML(items) : emptyRow('આ દિવસે કોઈ MCQ ટેસ્ટ આપી નથી');
    }
    const rv = qrevsForActiveExam().filter(r=>r.dueDate===dateStr);
    return rv.length ? qrevCalendarHTML(rv) : emptyRow('આ દિવસે કોઈ MCQ ટેસ્ટ રિવિઝન નથી');
  }
  const activeIds = activeExamSubjectIds();
  if(calMode==='study'){
    const logs = DB.studyLogs.filter(l=>l.date===dateStr && activeIds.includes(l.subjectId));
    const bySubject = {};
    logs.forEach(l=>{
      if(!bySubject[l.subjectId]) bySubject[l.subjectId] = {entries:[]};
      bySubject[l.subjectId].entries.push(l);
    });
    const subjectIds = Object.keys(bySubject);
    if(!subjectIds.length) return emptyRow('આ દિવસે કોઈ અભ્યાસ નથી');
    const subjectCardHTML = (sid)=>{
      const grouped = groupStudyLogsByChapter(bySubject[sid].entries);
      return `<div class="card">
        <div class="item item-static">
          ${subjTitleHTML(sid)}
        </div>
        ${grouped.chapterGroups.map(g=>studyChapterAccordion(g.topicId, g.items)).join('')}
        <div class="mt-8">${grouped.freeform.map(it=>`<div class="item" onclick="openStudyForm('${it.logId}')"><span>${esc(it.label)}</span></div>`).join('')}</div>
      </div>`;
    };
    return renderSectionGroups(groupSubjectIdsBySection(subjectIds), subjectCardHTML);
  }
  const revs = revisionsForActiveExam().filter(r=>r.dueDate===dateStr);
  const bySubject = {};
  revs.forEach(r=>{
    const sid = r.subjectId || 'unknown';
    (bySubject[sid] = bySubject[sid]||[]).push(r);
  });
  const subjectIds = Object.keys(bySubject);
  let topicCards;
  if(!subjectIds.length){
    topicCards = emptyRow('આ દિવસે કોઈ ટોપિક રિવિઝન નથી');
  } else {
    const subjectCardHTML = (sid)=>{
      const chapterGroups = groupRevisionsByChapter(bySubject[sid]);
      const pendingCount = bySubject[sid].filter(r=>r.status==='pending').length;
      return `<div class="card">
        <div class="item item-static">
          ${subjTitleHTML(sid)}
          ${pendingCount>0 ? `<button class="btn btn-sm btn-primary" onclick="completeAllRevisionsForSubject('${sid}','${dateStr}')">✓ બધા પૂર્ણ કરો</button>` : ''}
        </div>
        ${chapterGroups.map(g=>revisionChapterAccordion(g.topicId, g.items)).join('')}
      </div>`;
    };
    const sectionBadgeHTML = (sids)=>{
      let total=0, done=0;
      sids.forEach(sid=>{
        (bySubject[sid]||[]).forEach(r=>{ total++; if(r.status==='completed') done++; });
      });
      if(total===0) return '';
      if(done===total) return `<span class="badge badge-success">✓ બધા પૂર્ણ</span>`;
      if(done===0) return `<span class="badge badge-warning">${total} બાકી</span>`;
      return `<span class="badge badge-warning">${done}/${total} પૂર્ણ</span>`;
    };
    topicCards = renderSectionGroups(groupSubjectIdsBySection(subjectIds), subjectCardHTML, sectionBadgeHTML);
  }
  return topicCards;
}
function groupStudyLogsByChapter(entries){
  const byChapter = {};
  const order = [];
  const freeform = [];
  entries.forEach(l=>{
    const topicIds = (l.topicIds && l.topicIds.length) ? l.topicIds : (l.topicId ? [l.topicId] : []);
    if(!topicIds.length){
      freeform.push({label: l.chapters || 'સામાન્ય', logId: l.id});
      return;
    }
    topicIds.forEach(tid=>{
      const subNames = (l.subtopicIds||[]).map(sid=>{ const st=DB.subtopics.find(x=>x.id===sid); return (st && st.topicId===tid) ? st.name : null; }).filter(Boolean);
      if(!byChapter[tid]){ byChapter[tid]=[]; order.push(tid); }
      if(subNames.length) subNames.forEach(sn=>byChapter[tid].push({label:sn, logId:l.id}));
      else byChapter[tid].push({label:'સંપૂર્ણ ચેપ્ટર', logId:l.id});
    });
  });
  const tn = id=>{ const t = DB.topics.find(x=>x.id===id); return t ? t.name : ''; };
  order.sort((x,y)=>tn(x).localeCompare(tn(y),'gu',{numeric:true}));
  return {chapterGroups: order.map(tid=>({topicId:tid, items:byChapter[tid]})), freeform};
}
function renderAccordionBlock(wrapId, headerHTML, badgeHTML, bodyHTML, expand, opts){
  opts = opts || {};
  const wrapperClass = opts.wrapperClass !== undefined ? opts.wrapperClass : 'mt-8';
  const headerStyle = opts.headerStyle !== undefined ? opts.headerStyle : 'border:1px solid var(--border); border-radius:10px; padding:8px 10px;';
  const bodyClass = opts.bodyClass !== undefined ? opts.bodyClass : '';
  const bodyStyle = opts.bodyStyle !== undefined ? opts.bodyStyle : 'padding-left:6px;';
  const gap = opts.gap || 8;
  return `<div class="${wrapperClass}">
    <div class="item cursor-pointer" onclick="toggleAccordion('${wrapId}', this.querySelector('.accordion-caret'))" style="${headerStyle}">
      ${headerHTML}
      <span style="display:flex; align-items:center; gap:${gap}px;">
        ${badgeHTML||''}
        <span class="accordion-caret ink-dim">${expand?'▲':'▼'}</span>
      </span>
    </div>
    <div id="${wrapId}" class="${bodyClass}${bodyClass?' ':''}${expand?'':'hidden'}" style="${bodyStyle}">
      ${bodyHTML}
    </div>
  </div>`;
}
function studyChapterAccordion(topicId, items){
  const t = DB.topics.find(x=>x.id===topicId);
  const wrapId = 'stch_'+topicId+'_'+items[0].logId;
  const shouldExpand = isAccordionOpen(wrapId);
  const headerHTML = t ? `<span onclick="event.stopPropagation(); navigateToSubjectTopics('${t.subjectId}','${t.id}')" style="cursor:pointer;">${esc(t.name)}</span>` : `<span>ટોપિક</span>`;
  const badgeHTML = `<span class="badge badge-primary">${items.length}</span>`;
  const bodyHTML = items.map(it=>`<div class="item" onclick="openStudyForm('${it.logId}')"><span>${esc(it.label)}</span></div>`).join('');
  return renderAccordionBlock(wrapId, headerHTML, badgeHTML, bodyHTML, shouldExpand);
}
function groupRevisionsByChapter(list){
  const byChapter = {};
  const order = [];
  list.forEach(r=>{
    const key = r.topicId || 'unknown';
    if(!byChapter[key]){ byChapter[key]=[]; order.push(key); }
    byChapter[key].push(r);
  });
  const groups = order.map(topicId=>({topicId, items:byChapter[topicId]}));
  /* નંબર પ્રમાણે (1, 2, 3 … 10) ગોઠવો */
  const gname = g=>{ const t = DB.topics.find(x=>x.id===g.topicId); return t ? t.name : ''; };
  groups.sort((a,b)=>gname(a).localeCompare(gname(b),'gu',{numeric:true}));
  return groups;
}
function revisionChapterAccordion(topicId, items){
  const t = DB.topics.find(x=>x.id===topicId);
  const doneCount = items.filter(r=>r.status==='completed').length;
  const wrapId = 'revch_'+topicId+'_'+items[0].id;
  const shouldExpand = isAccordionOpen(wrapId) || items.some(r=>r.id===highlightRevisionId);
  if(shouldExpand) openAccordionIds.add(wrapId);
  const headerHTML = t ? `<span onclick="event.stopPropagation(); navigateToSubjectTopics('${t.subjectId}','${t.id}')" style="cursor:pointer;">${esc(t.name)}</span>` : `<span>ટોપિક</span>`;
  const badgeHTML = `<span class="badge ${doneCount===items.length?'badge-success':'badge-warning'}">${doneCount}/${items.length}</span>`;
  const bodyHTML = items.map(r=>revisionRow(r,true)).join('');
  return renderAccordionBlock(wrapId, headerHTML, badgeHTML, bodyHTML, shouldExpand);
}
let openAccordionIds = new Set();
function isAccordionOpen(wrapId){ return openAccordionIds.has(wrapId); }
function toggleAccordion(wrapId, caretEl){
  const el = document.getElementById(wrapId);
  if(!el) return;
  const willOpen = el.classList.contains('hidden');
  if(willOpen){
    Array.from(openAccordionIds).forEach(otherId=>{
      if(otherId===wrapId) return;
      const otherEl = document.getElementById(otherId);
      if(otherEl && !otherEl.contains(el)){
        otherEl.classList.add('hidden');
        const otherHeader = otherEl.previousElementSibling;
        const otherCaret = otherHeader ? otherHeader.querySelector('.accordion-caret') : null;
        if(otherCaret) otherCaret.textContent = '▼';
        openAccordionIds.delete(otherId);
      }
    });
  }
  const nowHidden = el.classList.toggle('hidden');
  if(nowHidden) openAccordionIds.delete(wrapId); else openAccordionIds.add(wrapId);
  if(caretEl) caretEl.textContent = nowHidden ? '▼' : '▲';
}
