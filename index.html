<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ExamPath">
<meta name="theme-color" content="#2E3AA8">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ExamPath — સ્ટડી ટ્રેકર</title>
<script>
(function(){
  try{
    var raw = localStorage.getItem('examPathData_v1');
    var theme = raw ? (JSON.parse(raw).settings || {}).theme : null;
    theme = theme || 'light';
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelector('meta[name="theme-color"]').setAttribute('content', theme==='dark' ? '#1A1A1A' : '#FFFFFF');
  }catch(e){
    document.documentElement.setAttribute('data-theme','light');
  }
})();
</script>
<style>
:root{
  --bg:#F3F4FA; --surface:#FFFFFF; --surface2:#ECEEF7; --ink:#1B1E2B; --ink-dim:#6A6F87;
  --primary:#2E3AA8; --primary-ink:#FFFFFF; --accent:#F5A623; --success:#1FA971; --danger:#E1484D; --warning:#F5A623;
  --border:rgba(20,22,40,0.10); --shadow:0 1px 2px rgba(20,22,45,.06),0 8px 24px rgba(20,22,45,.07);
  --overlay:rgba(10,12,25,0.5);
  --radius:16px; --radius-sm:10px;
}
[data-theme="dark"]{
  --bg:#000000; --surface:#1A1A1A; --surface2:#262626; --ink:#F5F5F5; --ink-dim:#A8A8A8;
  --primary:#6376F5; --primary-ink:#0E1120; --accent:#FFC24B; --success:#37C98B; --danger:#FF6B6E; --warning:#FFC24B;
  --border:rgba(255,255,255,0.08); --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.5);
  --overlay:rgba(0,0,0,0.6);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0; height:100%; overflow:hidden;}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Gujarati",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
input, textarea{
  -webkit-user-select:text; user-select:text; -webkit-touch-callout:default;
}
.app-shell{max-width:480px;margin:0 auto;position:relative;height:100vh; height:100dvh; background:var(--bg); display:flex; flex-direction:column; overflow:hidden;}
@media (min-width:600px){ .app-shell{box-shadow:var(--shadow);} body{background:var(--surface2);} }
.hidden{display:none !important;}
.mt-8{margin-top:8px;} .mt-10{margin-top:10px;} .mt-12{margin-top:12px;} .mt-14{margin-top:14px;} .mb-6{margin-bottom:6px;} .m-0{margin:0;}
.cursor-default{cursor:default;} .cursor-pointer{cursor:pointer;} .item-static{border:none;padding:0;cursor:default;}
.fs-12{font-size:12px;} .fs-125{font-size:12.5px;} .fw-400{font-weight:400;} .fw-700{font-weight:700;}
.flex-1{flex:1;} .flex-col{display:flex; flex-direction:column;} .flex-gap-4{display:flex; gap:4px;} .flex-gap-6{display:flex; gap:6px;}
.section-group-label{margin:0 2px 6px 2px;}
h1,h2,h3{margin:0 0 8px 0; letter-spacing:-0.02em; font-weight:800;}
h2{font-size:19px;}
h3{font-size:15px;}
p{margin:0;}
button{font-family:inherit;}
a{color:inherit;}

.topbar{flex:0 0 auto; z-index:20; background:var(--surface); border-bottom:1px solid var(--border);}
.topbar-inner{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; gap:8px;}
.brand{font-weight:800; font-size:17px; letter-spacing:-0.02em;}
.brand-row{display:flex; align-items:center; gap:8px;}
.brand-avatar{width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:22px; cursor:pointer; background:var(--surface2); flex-shrink:0;}
.brand-avatar img{width:100%; height:100%; object-fit:cover; display:block;}
#examSwitcher{max-width:150px; font-size:12px; padding:6px 8px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--ink);}

.main{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 14px 14px 14px; position:relative;}


.section-header{display:flex; align-items:center; justify-content:space-between; margin:18px 2px 8px 2px;}
.section-header h3{margin:0;}

.card{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:12px;}
.card-title{font-weight:700; font-size:14px; margin-bottom:8px; color:var(--ink);}

.hero-card{background:linear-gradient(145deg,var(--primary),#1B2680); color:#fff; border-radius:20px; padding:18px; margin-bottom:14px; box-shadow:var(--shadow);}
[data-theme="dark"] .hero-card{background:linear-gradient(145deg,#33408C,#0A0A0A);}
.hero-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
.hero-exam-name{font-size:19px; font-weight:800;}
.hero-exam-date{font-size:12px; opacity:0.85; margin-top:2px;}
.hero-top .btn{background:rgba(255,255,255,0.18); color:#fff;}
.hero-ring-row{display:flex; align-items:center; gap:14px; margin-top:14px;}
.ring-svg{flex-shrink:0;}
.ring-progress-hero{transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1), stroke .3s ease;}
.hero-ring-stats{display:flex; flex-direction:column; gap:8px; flex:1;}
.ring-stat{display:flex; justify-content:space-between; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.15); padding-bottom:6px;}
.ring-stat:last-child{border:none; padding-bottom:0;}
.ring-stat b{font-size:16px;}
.ring-stat span{opacity:0.85;}

.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:6px;}
.stat-card{background:var(--surface); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow);}
.stat-icon{font-size:18px;}
.stat-value{font-size:20px; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums;}
.stat-label{font-size:11.5px; color:var(--ink-dim); margin-top:2px;}
.stat-sub{font-size:11px; color:var(--primary); font-weight:700; margin-top:4px;}

.item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); font-size:14px; cursor:pointer;}




.item:last-child{border-bottom:none;}
.ink-dim{color:var(--ink-dim); font-size:12.5px;}
.empty-row{padding:14px 0; text-align:center; color:var(--ink-dim); font-size:13px;}

.topic-row{padding:10px 0; border-bottom:1px solid var(--border);}
.topic-row:last-child{border-bottom:none;}
.topic-row-top{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:14px;}
.btn:disabled{opacity:.3; cursor:default;}
.row-highlight{animation:topicFlash 1.6s ease-out; border-radius:10px;}
@keyframes topicFlash{
  0%{background:rgba(255,193,7,0.28);}
  100%{background:rgba(255,193,7,0);}
}

.badge{padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap;}
.badge-grey{background:var(--surface2); color:var(--ink-dim);}
.badge-warning{background:rgba(245,166,35,0.18); color:#B4740A;}
[data-theme="dark"] .badge-warning{color:var(--warning);}
.badge-success{background:rgba(31,169,113,0.16); color:#178658;}
[data-theme="dark"] .badge-success{color:var(--success);}
.badge-danger{background:rgba(225,72,77,0.15); color:#C13236;}
[data-theme="dark"] .badge-danger{color:var(--danger);}
.badge-primary{background:rgba(46,58,168,0.15); color:#2E3AA8;}
[data-theme="dark"] .badge-primary{color:var(--primary);}
.tt-day-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch;}
.tt-day-btn{flex:0 0 auto; padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink-dim); font-size:13px; font-weight:700; cursor:pointer;}
.tt-day-btn.active{background:var(--primary); color:#fff; border-color:var(--primary);}

.progress-track{height:8px; border-radius:999px; background:var(--surface2); overflow:hidden;}
.progress-fill{height:100%; background:var(--primary); border-radius:999px; transition:width .3s;}

.btn{padding:10px 16px; border-radius:12px; font-weight:700; font-size:13.5px; border:none; cursor:pointer; background:var(--surface2); color:var(--ink);}
.btn-primary{background:var(--primary); color:var(--primary-ink);}
.btn-secondary{background:var(--surface2); color:var(--ink);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-block{width:100%; text-align:center;}
.btn-sm{padding:6px 11px; font-size:12.5px; border-radius:9px;}

.field{margin-bottom:12px;}
.field label{display:block; margin-bottom:5px; font-size:12.5px; color:var(--ink-dim); font-weight:600;}
.field input, .field select, .field textarea{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg); color:var(--ink); font-size:14.5px; font-family:inherit;
}
.field textarea{min-height:64px; resize:vertical;}

.duration-picker{display:flex; align-items:flex-start; gap:6px;}
.duration-col{display:flex; flex-direction:column; align-items:center; flex:1;}
.duration-col select{width:100%; text-align:center; text-align-last:center; padding:11px 2px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--ink); font-size:16px; font-weight:700; font-family:inherit;}
.duration-label{font-size:10.5px; color:var(--ink-dim); margin-top:5px;}
.duration-sep{font-weight:800; font-size:18px; color:var(--ink-dim); padding-top:9px;}

.sheet-overlay{position:fixed; inset:0; background:var(--overlay); z-index:100; display:flex; align-items:flex-end;}
.sheet-overlay.hidden{display:none;}
.sheet{background:var(--surface); width:100%; max-width:480px; margin:0 auto; border-radius:20px 20px 0 0; padding:10px 18px 22px 18px; max-height:86vh; overflow-y:auto; animation:slideUp .18s ease-out;}
@keyframes slideUp{from{transform:translateY(24px); opacity:0.6;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:38px; height:4px; background:var(--border); border-radius:99px; margin:6px auto 14px auto;}
.sheet-actions{display:flex; gap:8px; margin-top:16px;}
.sheet-actions .btn-block{flex:1;}

.toast{position:fixed; bottom:92px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:10px; font-size:13.5px; z-index:200; box-shadow:var(--shadow); max-width:85%; text-align:center;}
.toast.hidden{display:none;}
.toast-error{background:var(--danger); color:#fff;}

.bottomnav{flex:0 0 auto; z-index:20; background:var(--surface); border-top:1px solid var(--border); display:flex; overflow-x:auto;}
.navbtn{flex:1 0 auto; min-width:62px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 4px 8px 4px; background:none; border:none; color:var(--ink-dim); cursor:pointer; transition:color .15s, transform .15s;}
.navbtn.active{color:var(--primary);}
.navbtn.active .navicon{transform:scale(1.12);}
.navicon{font-size:18px; display:inline-block; transition:transform .15s;}
.navlabel{font-size:9.5px; font-weight:700;}

.empty-state{text-align:center; padding:40px 16px; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);}
.empty-icon{font-size:38px; margin-bottom:8px;}
.empty-state h3{margin-bottom:4px;}
.empty-state p{color:var(--ink-dim); font-size:13px; margin-bottom:16px;}

.chart-card{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:14px;}
.chart-title{font-weight:700; font-size:13.5px; margin-bottom:8px;}
canvas{width:100%; display:block;}

.cal-date-row{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:var(--surface); border-radius:12px; box-shadow:var(--shadow); cursor:pointer; margin-bottom:10px; font-weight:700; font-size:14px;}
.cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--ink-dim); margin-bottom:4px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.cal-cell{aspect-ratio:1; border-radius:10px; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12.5px; cursor:pointer; box-shadow:var(--shadow); position:relative;}
.cal-cell.empty{background:transparent; box-shadow:none; cursor:default;}
.cal-cell.today{border:2px solid var(--primary);}
.cal-cell.selected{background:var(--success); color:#fff;}
.cal-cell.selected .cal-dot{background:#fff !important;}
.cal-dot{width:5px; height:5px; border-radius:99px; background:var(--accent); margin-top:2px;}
.cal-dots-row{display:flex; gap:3px; margin-top:2px; justify-content:center;}
.cal-dots-row .cal-dot{margin-top:0;}
.cal-dot-blue{background:#3B82F6 !important;}
.cal-dot-yellow{background:var(--accent) !important;}
.cal-dot-red{background:var(--danger) !important;}

.scroll-list{max-height:340px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.scroll-list-sm{max-height:230px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.scroll-list::-webkit-scrollbar, .scroll-list-sm::-webkit-scrollbar{width:5px;}
.scroll-list::-webkit-scrollbar-thumb, .scroll-list-sm::-webkit-scrollbar-thumb{background:var(--border); border-radius:99px;}
.scroll-list > .card:last-child, .scroll-list-sm > .card:last-child{margin-bottom:2px;}

.subject-list{display:flex; flex-direction:column; gap:10px; padding:2px 0 8px 0;}
.subject-mini-stat{text-align:center; background:var(--surface2); border-radius:10px; padding:10px 4px; min-width:0; min-height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;}
.subject-mini-stat b{display:block; font-size:16px; font-weight:800; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
.subject-mini-stat span{font-size:10px; color:var(--ink-dim); white-space:nowrap; line-height:1;}

.switch{position:relative; display:inline-block; width:44px; height:25px;}
.switch input{opacity:0; width:0; height:0;}
.slider{position:absolute; cursor:pointer; inset:0; background:var(--surface2); border-radius:999px; transition:.2s;}
.slider:before{position:absolute; content:""; height:19px; width:19px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
input:checked + .slider{background:var(--primary);}
input:checked + .slider:before{transform:translateX(19px);}
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand-row">
        <span class="brand-avatar" id="brandAvatar" onclick="openBrandForm()">📚</span>
        <span class="brand" id="brandText" onclick="openBrandForm()"></span>
      </span>
      <select id="examSwitcher" onchange="handleExamSwitcherChange(this)"></select>
    </div>
  </header>
  <input type="file" id="brandPhotoInput" accept="image/*" style="display:none" onchange="handleBrandPhoto(event)">
  <main class="main" id="main"></main>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<div class="sheet-overlay hidden" id="sheetOverlay" onclick="closeSheetOutside(event)">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div id="sheetContent"></div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
/* ===================== DATA LAYER ===================== */
const STORAGE_KEY = 'examPathData_v1';

function defaultData(){
  return {
    exams:[], subjects:[], topics:[], revisions:[], sections:[],
    studyLogs:[], mockTests:[], timetable:[], chapterTimetable:[], subtopics:[],
    settings:{theme:'light', brandName:'ExamPath', revisionRule:{startDays:[1,3,7], weekDay:'sun', weeklyCount:8}}
  };
}
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const parsed = JSON.parse(raw);
    const merged = Object.assign(defaultData(), parsed);
    merged.settings = Object.assign(defaultData().settings, parsed.settings||{});
    return merged;
  }catch(e){
    console.error('ડેટા ખરાબ થયેલો મળ્યો, નવેસરથી શરૂ કરવામાં આવે છે', e);
    return defaultData();
  }
}
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){ toast('સેવ કરવામાં તકલીફ થઈ','error'); } }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

let DB = loadData();
let currentTab = 'dashboard';
let examDetailId = null;
let topicDetailId = null;
let sectionDetailId = null;
let lastMainTab = 'dashboard';
let highlightTopicId = null;
let highlightRevisionId = null;
let calSelectedDate = null;
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();
let calMode = 'study';
let calGridExpanded = false;
let revCalSelectedDate = null;

/* ===================== HELPERS ===================== */
function esc(str){ if(str===undefined||str===null) return ''; return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function backButtonHTML(onclickCode){
  return `<button class="btn btn-sm btn-secondary" onclick="${onclickCode}">← પાછા</button>`;
}
function val(id){ const el=document.getElementById(id); return el ? el.value.trim() : ''; }
function todayStr(){ const d=new Date(); const off=d.getTimezoneOffset(); const local=new Date(d.getTime()-off*60000); return local.toISOString().slice(0,10); }
function formatDate(dateStr){ if(!dateStr) return '-'; const d=new Date(dateStr+'T00:00:00'); return d.toLocaleDateString('gu-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function formatDateShort(dateStr){ const d=new Date(dateStr+'T00:00:00'); return d.getDate()+'/'+(d.getMonth()+1); }
function examDaysLeft(dateStr){ if(!dateStr) return 0; const d1=new Date(todayStr()+'T00:00:00'); const d2=new Date(dateStr+'T00:00:00'); return Math.ceil((d2-d1)/86400000); }
function daysLeftColor(d){
  if(d<0) return getVar('--success');
  if(d>=30) return getVar('--success');
  if(d>=10) return getVar('--warning');
  return getVar('--danger');
}
function calcStudyStreak(exam){
  if(!exam) return {streak:0, todayDone:false};
  const activeIds = activeExamSubjectIds();
  const studyDates = new Set(DB.studyLogs.filter(l=>activeIds.includes(l.subjectId)).map(l=>l.date));
  const revDates = new Set(DB.revisions.filter(r=>activeIds.includes(r.subjectId) && r.status==='completed' && r.completedDate).map(r=>r.completedDate));
  const hasEntry = (ds)=> studyDates.has(ds) || revDates.has(ds);
  const today = todayStr();
  const todayDone = hasEntry(today);
  let cursor = new Date(today+'T00:00:00');
  if(!todayDone) cursor.setDate(cursor.getDate()-1);
  let streak = 0;
  while(true){
    const ds = cursor.toISOString().slice(0,10);
    if(hasEntry(ds)){ streak++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  return {streak, todayDone};
}
function getVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function getActiveExam(){ return DB.exams.find(e=>e.active); }
function examSubjects(examId){ return DB.subjects.filter(s=>s.examId===examId); }
function subjectTopics(subjectId){ return DB.topics.filter(t=>t.subjectId===subjectId); }
function subtopicsForTopic(topicId){ return DB.subtopics.filter(s=>s.topicId===topicId); }
function examSections(examId){ return DB.sections.filter(x=>x.examId===examId); }
function sectionSubjects(sectionId){ return DB.subjects.filter(s=>s.sectionId===sectionId); }
function activeExamSubjectIds(){ const exam=getActiveExam(); if(!exam) return []; return examSubjects(exam.id).map(s=>s.id); }
function studyLogsForActiveExam(){ const ids=activeExamSubjectIds(); return DB.studyLogs.filter(l=>ids.includes(l.subjectId)); }
function revisionsForActiveExam(){ const ids=activeExamSubjectIds(); return DB.revisions.filter(r=>ids.includes(r.subjectId)); }
function mockTestsForActiveExam(){ const exam=getActiveExam(); if(!exam) return []; return DB.mockTests.filter(m=>m.examId===exam.id); }
function subjectName(id){ const s=DB.subjects.find(x=>x.id===id); return s? s.name : '-'; }

function durationPickerHTML(prefix, totalSeconds){
  totalSeconds = totalSeconds || 0;
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = Math.floor(totalSeconds%60);
  const opts = (count, selected)=>Array.from({length:count},(_,i)=>i).map(i=>`<option value="${i}" ${i===selected?'selected':''}>${String(i).padStart(2,'0')}</option>`).join('');
  return `<div class="duration-picker">
    <div class="duration-col"><select id="${prefix}_h">${opts(24,h)}</select><span class="duration-label">કલાક</span></div>
    <div class="duration-sep">:</div>
    <div class="duration-col"><select id="${prefix}_m">${opts(60,m)}</select><span class="duration-label">મિનિટ</span></div>
    <div class="duration-sep">:</div>
    <div class="duration-col"><select id="${prefix}_s">${opts(60,s)}</select><span class="duration-label">સેકન્ડ</span></div>
  </div>`;
}
function durationPickerSeconds(prefix){
  const h = parseInt(val(prefix+'_h'),10)||0;
  const m = parseInt(val(prefix+'_m'),10)||0;
  const s = parseInt(val(prefix+'_s'),10)||0;
  return (h*3600)+(m*60)+s;
}
function formatDuration(hoursDecimal){
  if(!hoursDecimal || hoursDecimal<=0) return '0 મિનિટ';
  let totalSeconds = Math.round(hoursDecimal*3600);
  const h = Math.floor(totalSeconds/3600);
  totalSeconds %= 3600;
  const m = Math.floor(totalSeconds/60);
  const s = totalSeconds%60;
  const parts = [];
  if(h>0) parts.push(h+' કલાક');
  if(m>0) parts.push(m+' મિનિટ');
  if(s>0) parts.push(s+' સેકન્ડ');
  return parts.length ? parts.join(' ') : '0 મિનિટ';
}

/* ===================== CHARTS (canvas, no external libs) ===================== */
function roundRectPath(ctx,x,y,w,h,r){
  if(h<1) h=1;
  if(r>h/2) r=h/2;
  if(r>w/2) r=w/2;
  ctx.beginPath();
  ctx.moveTo(x,y+r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.closePath();
}
function drawBarChart(id, labels, values, color, valueFormatter){
  const canvas=document.getElementById(id);
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 300;
  const h = 150;
  canvas.style.height = h+'px';
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const max = Math.max(1, ...values);
  const padBottom=20, padTop=18;
  const gap = w/values.length;
  const barW = Math.min(34, gap*0.55);
  const dimColor = getVar('--ink-dim') || '#888';
  const inkColor = getVar('--ink') || '#222';
  values.forEach((v,i)=>{
    const barH = (h-padBottom-padTop) * (v/max);
    const x = gap*i + (gap-barW)/2;
    const y = h-padBottom-barH;
    ctx.fillStyle = color;
    roundRectPath(ctx, x, y, barW, barH, 5);
    ctx.fill();
    ctx.font = '9.5px sans-serif';
    ctx.fillStyle = inkColor;
    ctx.textAlign = 'center';
    const label = valueFormatter ? valueFormatter(v) : (v>0?String(v):'');
    if(label) ctx.fillText(label, x+barW/2, Math.max(y-5,10));
    ctx.font = '10.5px sans-serif';
    ctx.fillStyle = dimColor;
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x+barW/2, h-6);
  });
}

     ${statCard('🔁', `${revisionsDoneTodayCount}/${revisionsDueToday.length}`, 'આજની રિવિઝન', "calSelectedDate=todayStr(); showTab('calendar'); calMode='revision'; renderMain();", '')}

function computeWeakSubjects(examId){
  const subs = examSubjects(examId);
  const result = [];
  subs.forEach(s=>{
    let sum=0, count=0;
    DB.mockTests.filter(m=>m.examId===examId).forEach(m=>{
      const sm = (m.subjectMarks||[]).find(x=>x.subjectId===s.id);
      if(sm && sm.total){ sum += (sm.obtained/sm.total)*100; count++; }
    });
    if(count){ result.push({name:s.name, avg:Math.round(sum/count)}); }
  });
  return result.filter(r=>r.avg<60).sort((a,b)=>a.avg-b.avg).slice(0,4);
}

function studyLogTopicLabels(l){

      const t = DB.topics.find(x=>x.id===id);
      if(!t) return;
      const subNames = (l.subtopicIds||[]).map(sid=>{ const st=DB.subtopics.find(x=>x.id===sid); return (st && st.topicId===id) ? st.name : null; }).filter(Boolean);
      if(subNames.length) subNames.forEach(sn=>labels.push(`${t.name} — ${sn}`));

    });

function cycleTopicStatus(id){
  const t = DB.topics.find(x=>x.id===id);
  if(!t) return;
  const subs = subtopicsForTopic(id);
  const hasSubtopics = subs.length>0;
  const order = ['not_started','studying','completed'];
  const next = order[(order.indexOf(t.status)+1) % order.length];
  const labels = {not_started:'શરૂ નથી 🔴', studying:'ચાલુ 🟡', completed:'પૂર્ણ 🟢'};
  if(hasSubtopics && next==='completed'){
    const pending = subs.filter(s=>!s.completed);
    if(pending.length){
      alert(`⚠️ આ ચેપ્ટર હજુ પૂર્ણ ન કરી શકાય — ${pending.length} સબ-ટોપિક બાકી છે:\n\n${pending.map(s=>'• '+s.name).join('\n')}\n\nપહેલા બધા સબ-ટોપિક પૂર્ણ કરો, પછી જ ચેપ્ટર પૂર્ણ થશે.`);
      return;
    }
  }
  let msg = `સ્ટેટસ "${labels[t.status]}" માંથી "${labels[next]}" કરવું છે?`;
  if(hasSubtopics){
    if(next==='completed') msg += '\n\nℹ️ બધા સબ-ટોપિક પૂર્ણ છે. રિવિઝન દરેક સબ-ટોપિક પ્રમાણે પહેલેથી જ જનરેટ થયેલું છે.';
  } else {
    if(t.status==='completed' && next==='not_started'){
      msg += '\n\n⚠️ ધ્યાન રાખો: આ ટોપિકનું બાકી રિવિઝન શેડ્યુલ પણ કેન્સલ થઈ જશે.';
    } else if(next==='completed'){
      msg += '\n\n🔁 રિવિઝન શેડ્યુલ ઓટો-જનરેટ થશે.';
    }
  }
  if(!confirm(msg)) return;
  t.status = next;
  if(next==='completed'){
    t.completedDate = todayStr();
    if(!hasSubtopics){ generateRevisions(t); toast('ટોપિક પૂર્ણ! રિવિઝન ઓટો-જનરેટ થઈ 🔁'); }
    else toast('ટોપિક પૂર્ણ!');
  } else {
    if(!hasSubtopics) DB.revisions = DB.revisions.filter(r=>!(r.topicId===t.id && r.status==='pending'));
    toast('સ્ટેટસ બદલાયું');
  }
  save(); renderMain();
}
function generateRevisionsForEntity(topicId, subjectId, subtopicId){
  if(subtopicId) DB.revisions = DB.revisions.filter(r=>r.subtopicId!==subtopicId);
  else DB.revisions = DB.revisions.filter(r=>r.topicId!==topicId);
  const base = new Date(todayStr()+'T00:00:00');
  const rule = DB.settings.revisionRule || {startDays:[1,3,7], weekDay:'sun', weeklyCount:8};
  const startDays = (rule.startDays && rule.startDays.length) ? rule.startDays : [1,3,7];
  const weekDayNum = {sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6}[rule.weekDay] ?? 0;
  const weeklyCount = rule.weeklyCount>=0 ? rule.weeklyCount : 8;
  const dates = [];
  startDays.forEach(d=>{
    const due = new Date(base); due.setDate(due.getDate()+Number(d));
    dates.push(due);
  });
  const lastStartDay = Math.max(...startDays);
  let cursor = new Date(base); cursor.setDate(cursor.getDate()+lastStartDay+1);
  while(cursor.getDay()!==weekDayNum){ cursor.setDate(cursor.getDate()+1); }
  for(let i=0;i<weeklyCount;i++){
    dates.push(new Date(cursor));
    cursor = new Date(cursor); cursor.setDate(cursor.getDate()+7);
  }
  dates.forEach((due,idx)=>{
    const off = due.getTimezoneOffset();
    const local = new Date(due.getTime()-off*60000);
    const entry = {id:uid(), topicId, subjectId, dueDate: local.toISOString().slice(0,10), status:'pending', stage: idx+1};
    if(subtopicId) entry.subtopicId = subtopicId;
    DB.revisions.push(entry);
  });
}

function renderMockFormSheet(id, mode, m, subs){
  openSheet(`

function mockFormRowHTML(r, i, subs, mode){

function syncMockFormRowsFromDOM(){
  mockFormRows.forEach((r,i)=>{
    const subjEl=document.getElementById('mrow_subj_'+i);
    const totEl=document.getElementById('mrow_total_'+i);
    const obtEl=document.getElementById('mrow_obt_'+i);
    if(subjEl) r.subjectId=subjEl.value;
    if(totEl) r.total=totEl.value;
    if(obtEl) r.obtained=obtEl.value;
  });
}
function addMockFormRow(){
  syncMockFormRowsFromDOM();
  const exam = getActiveExam(); const subs = examSubjects(exam.id);
  mockFormRows.push({subjectId:(subs[0]?subs[0].id:''), total:'', obtained:''});
  renderMockFormSheet(mockFormEditId, mockFormMode, mockFormEditId?DB.mockTests.find(x=>x.id===mockFormEditId):null, subs);
}
function removeMockFormRow(i){
  syncMockFormRowsFromDOM();
  mockFormRows.splice(i,1);
  const exam = getActiveExam(); const subs = examSubjects(exam.id);
  renderMockFormSheet(mockFormEditId, mockFormMode, mockFormEditId?DB.mockTests.find(x=>x.id===mockFormEditId):null, subs);
}
function saveMock(id){
  const exam = getActiveExam();
  const date = val('f_date'), time = Math.round(durationPickerSeconds('f_time')/60);
  if(!date){ toast('તારીખ ભરો','error'); return; }
  const rows = [];
  for(let i=0;i<mockFormRows.length;i++){
    const subjEl=document.getElementById('mrow_subj_'+i), totEl=document.getElementById('mrow_total_'+i), obtEl=document.getElementById('mrow_obt_'+i);
    const total = parseFloat(totEl.value), obtained = parseFloat(obtEl.value);
    if(!subjEl.value || !total || total<=0 || isNaN(obtained) || obtained<0 || obtained>total){ toast('દરેક વિષયના માન્ય ગુણ ભરો','error'); return; }
    rows.push({subjectId:subjEl.value, total, obtained});
  }
  if(!rows.length){ toast('ઓછામાં ઓછો એક વિષય ઉમેરો','error'); return; }
  const totalMarks = rows.reduce((a,b)=>a+b.total,0);
  const obtainedMarks = rows.reduce((a,b)=>a+b.obtained,0);
  let newId = id;
  if(id){ const m=DB.mockTests.find(x=>x.id===id); Object.assign(m,{date,totalMarks,obtainedMarks,timeTaken:time,subjectMarks:rows,mode:mockFormMode}); }
  else { newId = uid(); DB.mockTests.push({id:newId,examId:exam.id,date,totalMarks,obtainedMarks,timeTaken:time,subjectMarks:rows,mode:mockFormMode}); }
  save(); renderMain(); toast('સેવ થયું');
  openMockAnalysis(newId);
}
function deleteMock(id){ if(!confirm('ડિલીટ કરવું છે?'))return; DB.mockTests=DB.mockTests.filter(x=>x.id!==id); save(); closeSheet(); renderMain(); toast('ડિલીટ થયું'); }

    ${rows || emptyRow('વિષય-વાઈઝ ડેટા નથી')}

function renderCalendar(){
  const firstDay = new Date(calYear, calMonth, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const monthName = firstDay.toLocaleDateString('gu-IN', {month:'long', year:'numeric'});
  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  const calSelDate = calSelectedDate || todayStr();
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dots = dotsForDate(dateStr);
    const isToday = dateStr===todayStr();
    const isSelected = dateStr===calSelDate && !isToday;
    cells += `<div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" onclick="calSelectedDate='${dateStr}'; renderMain();">
      <span>${d}</span>
      <div class="cal-dots-row">
        ${dots.hasStudy?'<div class="cal-dot cal-dot-blue"></div>':''}
        ${dots.hasRevisionDue?'<div class="cal-dot cal-dot-yellow"></div>':''}
        ${dots.hasOverdueRevision?'<div class="cal-dot cal-dot-red"></div>':''}
      </div>
    </div>`;
  }
  const sel = calSelectedDate || todayStr();
  return `
   <div class="cal-date-row" onclick="calGridExpanded=!calGridExpanded; renderMain();">
     <span>📅 ${formatDate(sel)}</span>
     <span class="ink-dim">${calGridExpanded?'▲':'▼'}</span>
   </div>
   ${calGridExpanded ? `
   <div class="cal-header">
     <button class="btn btn-sm btn-secondary" onclick="event.stopPropagation(); calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderMain();">‹</button>
     <b>${monthName}</b>
     <button class="btn btn-sm btn-secondary" onclick="event.stopPropagation(); calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderMain();">›</button>
   </div>
   <div class="cal-weekdays"><div>ર</div><div>સો</div><div>મં</div><div>બુ</div><div>ગુ</div><div>શુ</div><div>શ</div></div>
   <div class="cal-grid">${cells}</div>
   ` : ''}
   <div style="margin-top:16px;">
     <div class="section-header" style="margin-top:0;">
       <h3>${formatDate(sel)}</h3>
       ${calMode==='study'?`<button class="btn btn-sm btn-primary" onclick="openStudyForm(null,'${sel}')">+ ઉમેરો</button>`:''}
     </div>
     <div style="display:flex; gap:8px; margin-bottom:10px;">
       <button class="btn btn-sm ${calMode==='study'?'btn-primary':'btn-secondary'} flex-1" onclick="calMode='study'; renderMain();">અભ્યાસ 📖</button>
       <button class="btn btn-sm ${calMode==='revision'?'btn-primary':'btn-secondary'} flex-1" onclick="calMode='revision'; renderMain();">રિવિઝન 🔁</button>
     </div>
     ${calendarDayDetailHTML(sel)}
   </div>
  `;
}
function dotsForDate(dateStr){
  const hasStudy = studyLogsForActiveExam().some(l=>l.date===dateStr);
  const dueRevisions = revisionsForActiveExam().filter(r=>r.dueDate===dateStr);
  const hasRevisionDue = dueRevisions.length>0;
  const today = todayStr();
  const hasOverdueRevision = dateStr<today && dueRevisions.some(r=>r.status==='pending');
  return {hasStudy, hasRevisionDue, hasOverdueRevision};
}
function groupSubjectIdsBySection(subjectIds){
  const groups = [];
  const groupIndex = {};
  subjectIds.forEach(sid=>{
    const subj = DB.subjects.find(x=>x.id===sid);
    const secId = subj && subj.sectionId ? subj.sectionId : null;
    const key = secId || '__none__';
    if(!(key in groupIndex)){
      groupIndex[key] = groups.length;
      groups.push({sec: secId?DB.sections.find(x=>x.id===secId):null, subjectIds:[]});
    }
    groups[groupIndex[key]].subjectIds.push(sid);
  });
  return groups;
}
function renderSectionGroups(groups, subjectCardHTML){
  return groups.map(g=>{
    const cards = g.subjectIds.map(sid=>subjectCardHTML(sid)).join('');
    if(g.sec) return `<div class="mt-14"><div class="ink-dim fw-700 fs-125 section-group-label">📂 ${esc(g.sec.name)}</div>${cards}</div>`;
    return cards;
  }).join('');
}
function calendarDayDetailHTML(dateStr){
  const activeIds = activeExamSubjectIds();
  if(calMode==='study'){
    const logs = DB.studyLogs.filter(l=>l.date===dateStr && activeIds.includes(l.subjectId));
    const loggedSubIds = new Set(logs.map(l=>l.subjectId));
    const exam = getActiveExam();
    const suggestions = exam ? timetableSuggestionsForDate(exam.id, dateStr).filter(sg=>!loggedSubIds.has(sg.subjectId)) : [];
    const suggWrapId = 'ttsugg_'+dateStr;
    const suggExpand = isAccordionOpen(suggWrapId);
    const suggestionsHTML = suggestions.length ? `<div class="card">
      <div class="item cursor-pointer" onclick="toggleAccordion('${suggWrapId}', this.querySelector('.accordion-caret'))" style="border:none; padding:0;">
        <span class="ink-dim fw-700 fs-125">📋 ટાઈમટેબલ પ્રમાણે (${suggestions.length})</span>
        <span class="accordion-caret ink-dim">${suggExpand?'▲':'▼'}</span>
      </div>
      <div id="${suggWrapId}" class="mt-8 ${suggExpand?'':'hidden'}">
        ${suggestions.map(sg=>`<div class="item" onclick="openStudyForm(null,'${dateStr}',{subjectId:'${sg.subjectId}',topicId:${sg.current?`'${sg.current.id}'`:'null'}})">
          <span style="flex:1; min-width:0; padding-right:10px;">${esc(sg.subjectName)}${sg.current?` <span class="ink-dim">· ${esc(sg.current.name)}</span>`:''}</span>
          <span class="btn btn-sm btn-primary" style="flex-shrink:0; white-space:nowrap;">▶️ શરૂ કરો</span>
        </div>`).join('')}
      </div>
    </div>` : '';
    const bySubject = {};
    logs.forEach(l=>{
      if(!bySubject[l.subjectId]) bySubject[l.subjectId] = {entries:[]};
      bySubject[l.subjectId].entries.push(l);
    });
    const subjectIds = Object.keys(bySubject);
    if(!subjectIds.length) return suggestionsHTML + emptyRow('આ દિવસે કોઈ અભ્યાસ નથી');
    const subjectCardHTML = (sid)=>{
      const grouped = groupStudyLogsByChapter(bySubject[sid].entries);
      return `<div class="card">
        <div class="item item-static">
          <b>${esc(subjectName(sid))}</b>
        </div>
        ${grouped.chapterGroups.map(g=>studyChapterAccordion(g.topicId, g.items)).join('')}
        <div class="mt-8">${grouped.freeform.map(it=>`<div class="item" onclick="openStudyForm('${it.logId}')"><span>${esc(it.label)}</span></div>`).join('')}</div>
      </div>`;
    };
    return suggestionsHTML + renderSectionGroups(groupSubjectIdsBySection(subjectIds), subjectCardHTML);
  }
  const revs = revisionsForActiveExam().filter(r=>r.dueDate===dateStr);
  const bySubject = {};
  revs.forEach(r=>{
    const sid = r.subjectId || 'unknown';
    (bySubject[sid] = bySubject[sid]||[]).push(r);
  });
  const subjectIds = Object.keys(bySubject);
  let topicCards;
  if(!subjectIds.length){
    topicCards = emptyRow('આ દિવસે કોઈ ટોપિક રિવિઝન નથી');
  } else {
    const subjectCardHTML = (sid)=>{
      const chapterGroups = groupRevisionsByChapter(bySubject[sid]);
      return `<div class="card">
        <div class="item item-static">
          <b>${esc(subjectName(sid))}</b>
        </div>
        ${chapterGroups.map(g=>revisionChapterAccordion(g.topicId, g.items)).join('')}
      </div>`;
    };
    topicCards = renderSectionGroups(groupSubjectIdsBySection(subjectIds), subjectCardHTML);
  }
  return topicCards;
}
function groupStudyLogsByChapter(entries){
  const byChapter = {};
  const order = [];
  const freeform = [];
  entries.forEach(l=>{
    const topicIds = (l.topicIds && l.topicIds.length) ? l.topicIds : (l.topicId ? [l.topicId] : []);
    if(!topicIds.length){
      freeform.push({label: l.chapters || 'સામાન્ય', logId: l.id});
      return;
    }
    topicIds.forEach(tid=>{

const DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_LABELS = {mon:'સોમ',tue:'મંગળ',wed:'બુધ',thu:'ગુરુ',fri:'શુક્ર',sat:'શનિ',sun:'રવિ'};
let ttSelectedDay = null;
let ttMode = 'time';
function todayDayKey(){
  const map = ['sun','mon','tue','wed','thu','fri','sat'];
  return map[new Date().getDay()];
}
function formatTime12(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const period = h>=12 ? 'PM' : 'AM';
  let h12 = h%12; if(h12===0) h12=12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}
function timeDurationLabel(start, end){
  const [sh,sm] = start.split(':').map(Number);
  const [eh,em] = end.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if(mins<0) mins += 24*60;
  const h = Math.floor(mins/60), m = mins%60;
  return `${h} કલાક ${m} મિનિટ`;
}
function timetableForDay(examId, day){
  const subIds = examSubjects(examId).map(s=>s.id);
  return DB.timetable.filter(t=>t.day===day && subIds.includes(t.subjectId)).sort((a,b)=>a.startTime.localeCompare(b.startTime));
}
function currentOrNextTopic(subjectId){
  const topics = subjectTopics(subjectId);
  let t = topics.find(x=>x.status==='studying');
  if(t) return t;
  return topics.find(x=>x.status!=='completed') || null;
}
function subjectRevisionDueToday(subjectId){
  const today = todayStr();
  const revs = DB.revisions.filter(r=>r.subjectId===subjectId && r.status==='pending' && r.dueDate<=today);
  if(!revs.length) return null;
  revs.sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const t = DB.topics.find(x=>x.id===revs[0].topicId);
  return t ? t.name : null;
}
function timetableBlockNow(){
  const exam = getActiveExam();
  if(!exam) return null;
  const day = todayDayKey();
  const now = new Date();
  const nowStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const blocks = timetableForDay(exam.id, day);
  return blocks.find(b=>b.startTime<=nowStr && nowStr<b.endTime) || null;
}

  </div>`;
}
function timetableSuggestionsForDate(examId, dateStr){
  const diffDays = Math.round((new Date(dateStr+'T00:00:00') - new Date(todayStr()+'T00:00:00')) / 86400000);
  if(diffDays > 6) return [];
  const day = dayKeyForDate(dateStr);
  const subIds = new Set();
  timetableForDay(examId, day).forEach(b=>subIds.add(b.subjectId));
  chapterTimetableForDay(examId, day).forEach(e=>subIds.add(e.subjectId));
  return Array.from(subIds).map(sid=>{
    const s = DB.subjects.find(x=>x.id===sid);
    if(!s) return null;
    const current = currentOrNextTopic(sid);
    return {subjectId:sid, subjectName:s.name, current};
  }).filter(Boolean);
}
function dayKeyForDate(dateStr){
  const map = ['sun','mon','tue','wed','thu','fri','sat'];
  const d = new Date(dateStr+'T00:00:00');
  return map[d.getDay()];
}

function moveChapterTimetableEntry(id, dir){
  const list = DB.chapterTimetable;
  const e = list.find(x=>x.id===id);
  if(!e) return;
  const groupIdx = [];
  list.forEach((x,i)=>{ if(x.day===e.day) groupIdx.push(i); });
  const pos = groupIdx.findIndex(i=>list[i].id===id);
  const swapPos = pos + dir;
  if(swapPos<0 || swapPos>=groupIdx.length) return;
  const i1 = groupIdx[pos], i2 = groupIdx[swapPos];
  const tmp = list[i1]; list[i1] = list[i2]; list[i2] = tmp;
  save(); renderMain();
}

function openTimetableForm(id){

function updateTimetableSubjectOptions(preselectSubjectId){
  const exam = getActiveExam();
  const sectionEl = document.getElementById('f_tt_section');
  const subjectEl = document.getElementById('f_tt_subject');
  if(!exam || !sectionEl || !subjectEl) return;
  const sectionId = sectionEl.value;
  const allSubs = examSubjects(exam.id);
  const subs = allSubs.filter(s=>s.sectionId===sectionId);
  subjectEl.innerHTML = subs.length ? subs.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('') : `<option value="">આ વિભાગમાં કોઈ વિષય નથી</option>`;
  if(preselectSubjectId && subs.some(s=>s.id===preselectSubjectId)){
    subjectEl.value = preselectSubjectId;
  }
}
function saveTimetableBlock(id){

function animateDashboardHero(){
  const ringCircle = document.getElementById('heroRingCircle');
  if(!ringCircle) return;
  const ringText = document.getElementById('heroRingPercentText');
  const daysEl = document.getElementById('heroDaysLeft');
  const topicsEl = document.getElementById('heroTopicsCompleted');
  const subsEl = document.getElementById('heroSubjectsCount');
  const pctTarget = Number(ringCircle.dataset.target||0);
  const daysTarget = daysEl ? Number(daysEl.dataset.target) : null;
  const topicsTarget = topicsEl ? Number(topicsEl.dataset.target||0) : 0;
  const subsTarget = subsEl ? Number(subsEl.dataset.target||0) : 0;
  const duration = 1200;
  requestAnimationFrame(()=>{ ringCircle.style.strokeDashoffset = ringCircle.dataset.offset; });
  const startTime = performance.now();
  function tick(now){
    const progress = Math.min(1, (now-startTime)/duration);
    const eased = 1 - Math.pow(1-progress, 3);
    if(ringText) ringText.textContent = Math.round(pctTarget*eased) + '%';
    if(topicsEl) topicsEl.textContent = Math.round(topicsTarget*eased);
    if(subsEl) subsEl.textContent = Math.round(subsTarget*eased);
    if(daysEl && daysTarget!==null && daysTarget>=0) daysEl.textContent = Math.round(daysTarget*eased);
    if(progress<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

let cropState = null;
function openCropSheet(dataUrl){
  const img = new Image();
  img.onload = function(){
    openSheet(`
      <h3>ફોટો ગોઠવો 🖼️</h3>
      <div id="cropViewport" style="width:100%; max-width:280px; aspect-ratio:1; margin:0 auto 14px auto; border-radius:16px; overflow:hidden; position:relative; background:var(--surface2); touch-action:none; cursor:grab;">
        <img id="cropImg" src="${dataUrl}" draggable="false" style="position:absolute; left:0; top:0; transform-origin:top left; user-select:none;">
      </div>
      <div class="field mb-6">
        <label>ઝૂમ 🔍</label>
        <input type="range" id="cropZoom" min="100" max="300" value="100" oninput="onCropZoomChange(this.value)" style="width:100%;">
      </div>
      <div class="ink-dim" style="font-size:12px; text-align:center; margin-bottom:6px;">ફોટો ડ્રેગ કરીને ગોઠવો, ઝૂમ સ્લાઇડરથી મોટું-નાનું કરો</div>
      <div class="sheet-actions">
        <button class="btn btn-secondary" onclick="cropState=null; closeSheet();">રદ કરો</button>
        <button class="btn btn-primary btn-block" onclick="saveCroppedPhoto();">સેવ કરો</button>
      </div>
    `);
    setTimeout(()=>initCropViewport(img), 30);
  };
  img.src = dataUrl;
}
function initCropViewport(img){
  const viewport = document.getElementById('cropViewport');
  if(!viewport) return;
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const baseScale = Math.max(vw/img.naturalWidth, vh/img.naturalHeight);
  cropState = {
    img, viewportEl: viewport, imgEl: document.getElementById('cropImg'),
    vw, vh, naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight,
    baseScale, zoom: 1, offsetX: 0, offsetY: 0, dragging: false,
    startX: 0, startY: 0, startOffsetX: 0, startOffsetY: 0
  };
  const s = cropState;
  const scale = s.baseScale * s.zoom;
  s.offsetX = (s.vw - s.naturalWidth*scale)/2;
  s.offsetY = (s.vh - s.naturalHeight*scale)/2;
  applyCropTransform();
  viewport.addEventListener('pointerdown', cropPointerDown);
  viewport.addEventListener('pointermove', cropPointerMove);
  viewport.addEventListener('pointerup', cropPointerUp);
  viewport.addEventListener('pointercancel', cropPointerUp);
}
function clampCropOffset(){
  const s = cropState;
  const scale = s.baseScale * s.zoom;
  const dw = s.naturalWidth*scale, dh = s.naturalHeight*scale;
  s.offsetX = Math.min(0, Math.max(s.vw-dw, s.offsetX));
  s.offsetY = Math.min(0, Math.max(s.vh-dh, s.offsetY));
}
function applyCropTransform(){
  const s = cropState;
  const scale = s.baseScale * s.zoom;
  s.imgEl.style.width = (s.naturalWidth*scale)+'px';
  s.imgEl.style.height = (s.naturalHeight*scale)+'px';
  s.imgEl.style.transform = `translate(${s.offsetX}px, ${s.offsetY}px)`;
}
function onCropZoomChange(val){
  if(!cropState) return;
  cropState.zoom = Number(val)/100;
  clampCropOffset();
  applyCropTransform();
}
function cropPointerDown(e){
  if(!cropState) return;
  cropState.dragging = true;
  cropState.startX = e.clientX; cropState.startY = e.clientY;
  cropState.startOffsetX = cropState.offsetX; cropState.startOffsetY = cropState.offsetY;
  cropState.viewportEl.setPointerCapture(e.pointerId);
  cropState.viewportEl.style.cursor = 'grabbing';
}
function cropPointerMove(e){
  if(!cropState || !cropState.dragging) return;
  cropState.offsetX = cropState.startOffsetX + (e.clientX - cropState.startX);
  cropState.offsetY = cropState.startOffsetY + (e.clientY - cropState.startY);
  clampCropOffset();
  applyCropTransform();
}
function cropPointerUp(){
  if(!cropState) return;
  cropState.dragging = false;
  cropState.viewportEl.style.cursor = 'grab';
}
function saveCroppedPhoto(){
  if(!cropState) return;
  const s = cropState;
  const OUT = 320;
  const outScale = OUT / s.vw;
  const scale = s.baseScale * s.zoom;
  const canvas = document.createElement('canvas');
  canvas.width = OUT; canvas.height = OUT;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(s.img, s.offsetX*outScale, s.offsetY*outScale, s.naturalWidth*scale*outScale, s.naturalHeight*scale*outScale);
  DB.settings.photoData = canvas.toDataURL('image/jpeg', 0.88);
  cropState = null;
  save(); populateBrand(); closeSheet(); toast('ફોટો સેવ થયો');
}

function saveBrandName(){
  const name = val('f_brand') || 'ExamPath';
  DB.settings.brandName = name;
  save(); populateBrand(); closeSheet(); toast('સેવ થયું');
}
/* ===================== NOTIFICATIONS ===================== */
function notificationStatusText(){
  if(!('Notification' in window)) return '❌ આ બ્રાઉઝર સપોર્ટ નથી કરતું';
  if(Notification.permission==='granted') return '✅ ચાલુ છે';
  if(Notification.permission==='denied') return '❌ બ્રાઉઝર સેટિંગ્સમાંથી બ્લોક છે — ત્યાંથી જ ચાલુ કરવું પડશે';
  return '⚪ બંધ છે';
}
function requestNotificationPermission(){
  if(!('Notification' in window)){ toast('આ બ્રાઉઝર સપોર્ટ નથી કરતું','error'); return; }
  Notification.requestPermission().then(function(perm){
    if(perm==='granted'){
      toast('નોટિફિકેશન ચાલુ થયું 🔔');
      showAppNotification('ExamPath 🎓','નોટિફિકેશન ચાલુ થઈ ગયું!','welcome');
      checkNotifications();
    } else toast('પરવાનગી ના મળી','error');
    renderMain();
  });
}
function showAppNotification(title, body, tag){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  if('serviceWorker' in navigator){
    navigator.serviceWorker.ready.then(function(reg){
      if(reg && reg.showNotification) reg.showNotification(title, {body:body, icon:'icon-192.png', badge:'icon-192.png', tag:tag||undefined});
      else new Notification(title, {body:body, icon:'icon-192.png', tag:tag||undefined});
    }).catch(function(){ try{ new Notification(title, {body:body, icon:'icon-192.png', tag:tag||undefined}); }catch(e){} });
  } else {
    try{ new Notification(title, {body:body, icon:'icon-192.png', tag:tag||undefined}); }catch(e){}
  }
}
function getNotifyLog(){
  try{
    const raw = localStorage.getItem('examPathNotifyLog_v1');
    const log = raw ? JSON.parse(raw) : {};
    if(log.date !== todayStr()) return {date: todayStr()};
    return log;
  }catch(e){ return {date: todayStr()}; }
}
function saveNotifyLog(log){ try{ localStorage.setItem('examPathNotifyLog_v1', JSON.stringify(log)); }catch(e){} }
function checkNotifications(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const exam = getActiveExam();
  if(!exam) return;
  const log = getNotifyLog();
  let changed = false;

  const block = timetableBlockNow();
  if(block && log.lastTimetableBlockId !== block.id){
    const s = DB.subjects.find(x=>x.id===block.subjectId);
    const curTopic = s ? currentOrNextTopic(s.id) : null;
    showAppNotification('🔴 હમણાં ચાલુ: '+(s?s.name:'રીડિંગ'), curTopic ? curTopic.name : 'રીડિંગ સમય', 'now-block');
    log.lastTimetableBlockId = block.id; changed = true;
  } else if(!block && log.lastTimetableBlockId){
    log.lastTimetableBlockId = null; changed = true;
  }

  if(!log.revisionsNotified){
    const pending = revisionsForActiveExam().filter(r=>r.dueDate===todayStr() && r.status==='pending').length;
    if(pending>0) showAppNotification('🔁 આજની રિવિઝન', pending+' રિવિઝન બાકી છે', 'due-today');
    log.revisionsNotified = true; changed = true;
  }

  if(!log.overdueNotified){
    const overdue = revisionsForActiveExam().filter(r=>r.status==='pending' && r.dueDate<todayStr()).length;
    if(overdue>0) showAppNotification('⚠️ ઓવરડ્યુ રિવિઝન', overdue+' રિવિઝન ઓવરડ્યુ છે', 'overdue');
    log.overdueNotified = true; changed = true;
  }

  if(!log.streakNotified){
    const st = calcStudyStreak(exam);
    if(st.streak>0 && !st.todayDone) showAppNotification('🔥 સ્ટ્રીક તૂટવાની તૈયારીમાં!', 'તમારી '+st.streak+' દિવસની સ્ટ્રીક છે — આજે કંઈક અભ્યાસ નોંધો!', 'streak');
    log.streakNotified = true; changed = true;
  }

  if(changed) saveNotifyLog(log);
}
function init(){
  applyTheme();
  buildNav();
  populateBrand();
  populateExamSwitcher();
  showTab('dashboard');
  checkNotifications();
  setInterval(checkNotifications, 60000);
}
window.addEventListener('DOMContentLoaded', init);
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(e){ console.error('SW register failed', e); });
  });
}
</script>
